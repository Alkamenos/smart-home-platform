
default_config:

homeassistant:
  auth_providers:
    - type: trusted_networks
      trusted_networks:
        - 172.16.0.0/12
        - 10.0.0.0/8
        - 192.168.0.0/16
        - 127.0.0.1
        - ::1
    - type: homeassistant

websocket_api:

api:

http:
  server_port: 8123
  trusted_proxies:
    - 172.16.0.0/12
    - 10.0.0.0/8
  use_x_forwarded_for: true

logger:
  default: info
  logs:
    homeassistant.components.websocket_api: debug
