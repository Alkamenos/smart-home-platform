# Конфигурация FSM для умной лампочки (lighting)
# Состояния: OFF, ON_MOTION, ON_MANUAL

entity_id: "light.kitchen"
initial_state: "OFF"
debounce_sec: 0.5

states:
  - "OFF"
  - "ON_MOTION"
  - "ON_MANUAL"

transitions:
  # Из OFF можно перейти в ON_MOTION при обнаружении движения
  - from_state: "OFF"
    to_state: "ON_MOTION"
    trigger: "motion_detected"
    guard: "is_night_time"  # Имя функции в Registry (только ночью)
    action: "turn_on_light"

  # Из OFF можно перейти в ON_MANUAL при ручном включении
  - from_state: "OFF"
    to_state: "ON_MANUAL"
    trigger: "manual_switch_on"
    action: "turn_on_light"

  # Из ON_MOTION можно перейти в OFF при отсутствии движения (таймаут)
  - from_state: "ON_MOTION"
    to_state: "OFF"
    trigger: "timeout"
    action: "turn_off_light"
    timeout_sec: 30.0  # Автоматический переход через 30 секунд

  # Из ON_MOTION можно перейти в ON_MANUAL при ручном вмешательстве
  - from_state: "ON_MOTION"
    to_state: "ON_MANUAL"
    trigger: "manual_override"
    guard: "is_manual_override_enabled"  # Имя функции в Registry

  # Из ON_MANUAL можно перейти в OFF при ручном выключении
  - from_state: "ON_MANUAL"
    to_state: "OFF"
    trigger: "manual_switch_off"
    action: "turn_off_light"

  # Из ON_MANUAL можно перейти в OFF при таймауте бездействия
  - from_state: "ON_MANUAL"
    to_state: "OFF"
    trigger: "timeout"
    action: "turn_off_light"
    timeout_sec: 300.0  # 5 минут автоматического выключения без действия
