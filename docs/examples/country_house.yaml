# Пример 2: Загородный дом (2 этажа)
# Расширенная конфигурация для многокомнатного дома с зональным управлением

instance:
  id: country_house
  name: Country House
  owner: Ivanov Family
  created_at: '2024-01-20'

version: 1

zones:
  # Первый этаж
  - id: entrance
    name: Entrance Hall
    floor: 1
  - id: kitchen
    name: Kitchen
    floor: 1
  - id: living_room
    name: Living Room
    floor: 1
  - id: guest_bathroom
    name: Guest Bathroom
    floor: 1
  
  # Второй этаж
  - id: master_bedroom
    name: Master Bedroom
    floor: 2
  - id: kids_room
    name: Kids Room
    floor: 2
  - id: main_bathroom
    name: Main Bathroom
    floor: 2
  - id: hallway_2
    name: Upstairs Hallway
    floor: 2

automation_rules:
  lighting:
    motion_enabled: true
    schedule_enabled: true
    manual_lockout_min: 60
  climate:
    safety_lockout_enabled: true
    away_mode_enabled: true
    manual_lockout_min: 90
  ventilation:
    humidity_based: true
    manual_lockout_min: 20
  global_manual_lockout_min: 45

dashboard:
  title: "Ivanov's Country House"
  show_history: true
  show_motion_sensors: true
  show_climate: true
  show_humidity: true
  history_days: 14

devices:
  # Прихожая - освещение с ночником
  - type: light_motion
    id: light.entrance
    name: Entrance Light
    room: entrance
    behaviors:
      - template: night_light
        priority: 20
        params:
          brightness: 10
          schedule: "22:00-06:00"
      - template: lighting
        priority: 10
        params:
          motion_sensor: binary_sensor.entrance_motion
          motion_timeout_sec: 120
          schedule: "06:00-22:00"
          brightness: 255

  # Кухня - композиция из 3 поведений
  - type: light_motion
    id: light.kitchen
    name: Kitchen Light
    room: kitchen
    behaviors:
      # Ночной режим - очень тусклый свет
      - template: night_light
        priority: 25
        params:
          brightness: 5
          schedule: "23:00-06:00"
      # Вечерний режим - умеренный свет
      - template: evening_light
        priority: 20
        params:
          brightness: 150
          schedule: "18:00-23:00"
      # Дневное освещение по движению
      - template: lighting
        priority: 10
        params:
          motion_sensor: binary_sensor.kitchen_motion
          motion_timeout_sec: 300
          schedule: "06:00-18:00"
          brightness: 255

  # Гостиная - основное освещение
  - type: light_motion
    id: light.living_room
    name: Living Room Light
    room: living_room
    behaviors:
      - template: lighting
        priority: 10
        params:
          motion_sensor: binary_sensor.living_room_motion
          motion_timeout_sec: 600
          schedule: "always"
          brightness: 255

  # Гостевой санузел
  - type: light_motion
    id: light.guest_bathroom
    name: Guest Bathroom Light
    room: guest_bathroom
    behaviors:
      - template: lighting
        priority: 10
        params:
          motion_sensor: binary_sensor.guest_bathroom_motion
          motion_timeout_sec: 180
          schedule: "always"
          brightness: 200

  # Спальня хозяев
  - type: light_motion
    id: light.master_bedroom
    name: Master Bedroom Light
    room: master_bedroom
    behaviors:
      - template: night_light
        priority: 20
        params:
          brightness: 20
          schedule: "22:00-07:00"
      - template: lighting
        priority: 10
        params:
          motion_sensor: binary_sensor.master_bedroom_motion
          motion_timeout_sec: 300
          schedule: "07:00-22:00"
          brightness: 200

  # Детская комната
  - type: light_motion
    id: light.kids_room
    name: Kids Room Light
    room: kids_room
    behaviors:
      - template: night_light
        priority: 20
        params:
          brightness: 15
          schedule: "21:00-07:00"
      - template: lighting
        priority: 10
        params:
          motion_sensor: binary_sensor.kids_room_motion
          motion_timeout_sec: 300
          schedule: "07:00-21:00"
          brightness: 255

  # Основной санузел
  - type: light_motion
    id: light.main_bathroom
    name: Main Bathroom Light
    room: main_bathroom
    behaviors:
      - template: lighting
        priority: 10
        params:
          motion_sensor: binary_sensor.main_bathroom_motion
          motion_timeout_sec: 300
          schedule: "always"
          brightness: 255

  # Коридор на втором этаже
  - type: light_motion
    id: light.hallway_2
    name: Upstairs Hallway Light
    room: hallway_2
    behaviors:
      - template: night_light
        priority: 20
        params:
          brightness: 10
          schedule: "22:00-06:00"
      - template: lighting
        priority: 10
        params:
          motion_sensor: binary_sensor.hallway_2_motion
          motion_timeout_sec: 180
          schedule: "06:00-22:00"
          brightness: 200

  # Климат-контроль первый этаж
  - type: climate_hysteresis
    id: climate.kitchen
    name: Climate Kitchen
    room: kitchen
    behaviors:
      - template: climate_hysteresis
        priority: 10
        params:
          sensor: sensor.kitchen_temperature
          target: 22.0
          hysteresis: 0.5
          modes:
            - heat
            - cool
            - auto

  - type: climate_hysteresis
    id: climate.living_room
    name: Climate Living Room
    room: living_room
    behaviors:
      - template: climate_hysteresis
        priority: 10
        params:
          sensor: sensor.living_room_temperature
          target: 22.0
          hysteresis: 0.5
          modes:
            - heat
            - cool
            - auto

  # Климат-контроль второй этаж
  - type: climate_hysteresis
    id: climate.master_bedroom
    name: Climate Master Bedroom
    room: master_bedroom
    behaviors:
      - template: climate_hysteresis
        priority: 10
        params:
          sensor: sensor.master_bedroom_temperature
          target: 20.0
          hysteresis: 0.5
          modes:
            - heat
            - cool

  - type: climate_hysteresis
    id: climate.kids_room
    name: Climate Kids Room
    room: kids_room
    behaviors:
      - template: climate_hysteresis
        priority: 10
        params:
          sensor: sensor.kids_room_temperature
          target: 21.0
          hysteresis: 0.5
          modes:
            - heat
            - cool

  # Вентиляция санузлов
  - type: ventilation_humidity
    id: fan.guest_bathroom
    name: Guest Bathroom Fan
    room: guest_bathroom
    behaviors:
      - template: ventilation_humidity
        priority: 10
        params:
          humidity_sensor: sensor.guest_bathroom_humidity
          humidity_threshold: 65
          timeout_sec: 1800

  - type: ventilation_humidity
    id: fan.main_bathroom
    name: Main Bathroom Fan
    room: main_bathroom
    behaviors:
      - template: ventilation_humidity
        priority: 10
        params:
          humidity_sensor: sensor.main_bathroom_humidity
          humidity_threshold: 65
          timeout_sec: 1800
