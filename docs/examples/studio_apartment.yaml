# Пример 1: Маленькая квартира-студия
# Базовая конфигурация для однокомнатной квартиры с простым освещением и климатом

instance:
  id: studio_apartment
  name: Studio Apartment
  owner: Alex
  created_at: '2024-01-15'

version: 1

zones:
  - id: main_room
    name: Main Room
    floor: 1
  - id: bathroom
    name: Bathroom
    floor: 1
  - id: balcony
    name: Balcony
    floor: 1

automation_rules:
  lighting:
    motion_enabled: true
    schedule_enabled: true
    manual_lockout_min: 30
  climate:
    safety_lockout_enabled: true
    away_mode_enabled: false
    manual_lockout_min: 60
  ventilation:
    humidity_based: true
    manual_lockout_min: 15
  global_manual_lockout_min: 30

dashboard:
  title: "Alex's Studio"
  show_history: true
  show_motion_sensors: true
  show_climate: true
  history_days: 7

devices:
  # Основное освещение студии с композицией поведений
  - type: light_motion
    id: light.main_room
    name: Main Room Light
    room: main_room
    behaviors:
      # Ночной режим с тусклым светом (высокий приоритет)
      - template: night_light
        priority: 20
        params:
          brightness: 15
          schedule: "23:00-07:00"
      # Дневное освещение по движению (стандартный приоритет)
      - template: lighting
        priority: 10
        params:
          motion_sensor: binary_sensor.main_room_motion
          motion_timeout_sec: 180
          schedule: "07:00-23:00"
          brightness: 255

  # Освещение в ванной
  - type: light_motion
    id: light.bathroom
    name: Bathroom Light
    room: bathroom
    behaviors:
      - template: lighting
        priority: 10
        params:
          motion_sensor: binary_sensor.bathroom_motion
          motion_timeout_sec: 300
          schedule: "always"
          brightness: 200

  # Климат-контроль
  - type: climate_hysteresis
    id: climate.main_room
    name: Climate Main Room
    room: main_room
    behaviors:
      - template: climate_hysteresis
        priority: 10
        params:
          sensor: sensor.main_room_temperature
          target: 21.0
          hysteresis: 0.5
          modes:
            - heat
            - cool

  # Вентиляция в ванной
  - type: ventilation_humidity
    id: fan.bathroom
    name: Bathroom Fan
    room: bathroom
    behaviors:
      - template: ventilation_humidity
        priority: 10
        params:
          humidity_sensor: sensor.bathroom_humidity
          humidity_threshold: 70
          timeout_sec: 1200
