automation_rules:
  climate:
    away_mode_enabled: true
    manual_lockout_min: 30
    safety_lockout_enabled: true
  lighting:
    manual_lockout_min: 60
    motion_enabled: true
    schedule_enabled: true
  ventilation:
    humidity_based: true
    manual_lockout_min: 15
dashboard:
  history_days: 7
  show_climate: true
  show_history: true
  show_motion_sensors: true
  title: Leonid's House
devices:
  climate:
  - hysteresis: 0.5
    id: climate.kitchen
    modes:
    - heat
    - cool
    - auto
    name: Климат Kitchen
    room: kitchen
    sensor: sensor.kitchen_temperature
    target: 22.0
  - hysteresis: 0.5
    id: climate.living_room
    modes:
    - heat
    - cool
    - auto
    name: Климат Living Room
    room: living_room
    sensor: sensor.living_room_temperature
    target: 22.0
  lighting:
  - id: light.kitchen
    motion_sensor: binary_sensor.kitchen_motion
    motion_timeout_sec: 300
    name: Свет в Kitchen
    room: kitchen
    schedule: 07:00-23:00
  - id: light.living_room
    motion_sensor: binary_sensor.living_room_motion
    motion_timeout_sec: 300
    name: Свет в Living Room
    room: living_room
    schedule: 07:00-23:00
  - id: light.bedroom
    motion_sensor: binary_sensor.bedroom_motion
    motion_timeout_sec: 300
    name: Свет в Bedroom
    room: bedroom
    schedule: 07:00-23:00
  ventilation:
  - humidity_sensor: sensor.bathroom_humidity
    humidity_threshold: 65
    id: fan.bathroom
    name: Вентиляция ванной
    room: bathroom
    timeout_sec: 1800
instance:
  created_at: '2026-09-08'
  id: leonids_house
  name: Leonid's House
  owner: Leo
version: 1
zones:
- floor: 1
  id: kitchen
  name: Kitchen
- floor: 1
  id: living_room
  name: Living Room
- floor: 1
  id: bedroom
  name: Bedroom
- floor: 1
  id: bathroom
  name: Bathroom
