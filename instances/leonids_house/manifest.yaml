instance:
  id: leonids_house
  name: Leonid's House
  owner: Leo
  created_at: "2024-01-15"

version: 1

rooms:
  - id: kitchen
    name: Kitchen
    sensors:
      motion: binary_sensor.kitchen_motion
      temperature: sensor.kitchen_temperature
      humidity: sensor.kitchen_humidity
    devices:
      - id: light.kitchen
        type: light
        behaviors:
          - template: lighting
            priority: 10
            params:
              brightness: 255
              motion_timeout_sec: 180
          - template: night_light
            priority: 20
            params:
              brightness: 15
              schedule: "23:00-07:00"
      - id: climate.kitchen
        type: climate
        behaviors:
          - template: climate_control
            priority: 15
            params:
              target_temp: 22.0
              hysteresis: 0.5

  - id: living_room
    name: Living Room
    sensors:
      temperature: sensor.living_room_temperature
      humidity: sensor.living_room_humidity
    devices:
      - id: light.living_room
        type: light
        behaviors:
          - template: lighting
            priority: 10
            params:
              brightness: 200
              motion_timeout_sec: 300
      - id: climate.living_room
        type: climate
        behaviors:
          - template: climate_control
            priority: 15
            params:
              target_temp: 21.0
              hysteresis: 0.5

  - id: bedroom
    name: Bedroom
    sensors:
      motion: binary_sensor.hallway_motion
      temperature: sensor.bedroom_temperature
    devices:
      - id: light.bedroom
        type: light
        behaviors:
          - template: lighting
            priority: 10
            params:
              brightness: 200
              motion_timeout_sec: 300
          - template: night_light
            priority: 20
            params:
              brightness: 10
              schedule: "23:00-07:00"

  - id: bathroom
    name: Bathroom
    sensors:
      humidity: sensor.bathroom_humidity
    devices:
      - id: fan.bathroom
        type: ventilation
        behaviors:
          - template: humidity_ventilation
            priority: 5
            params:
              humidity_threshold: 65

automation_rules:
  global_manual_lockout_min: 60
  lighting:
    motion_enabled: true
    schedule_enabled: true
    manual_lockout_min: 60
  climate:
    safety_lockout_enabled: true
    away_mode_enabled: true
    manual_lockout_min: 30
  ventilation:
    humidity_based: true
    manual_lockout_min: 15
