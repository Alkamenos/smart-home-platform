# Манифест платформы умного дома
# Версия формата для обратной совместимости
version: 1

# Мета-информация
instance:
  id: leonids_house
  name: "Leonid's House"
  owner: Leo
  created_at: "2026-09-08"

# Устройства
devices:
  lighting:
    - id: light.kitchen
      name: "Свет на кухне"
      room: kitchen
      motion_sensor: binary_sensor.kitchen_motion
      schedule: "07:00-23:00"
      motion_timeout_sec: 300

    - id: light.living_room
      name: "Свет в гостиной"
      room: living_room
      motion_sensor: binary_sensor.living_room_motion
      schedule: "08:00-23:30"
      motion_timeout_sec: 600

    - id: light.bedroom
      name: "Свет в спальне"
      room: bedroom
      motion_sensor: binary_sensor.bedroom_motion
      schedule: "06:30-23:00"
      motion_timeout_sec: 300

  climate:
    - id: climate.kitchen
      name: "Климат кухни"
      room: kitchen
      sensor: sensor.kitchen_temperature
      target: 22.0
      hysteresis: 0.5
      modes: ["heat", "cool", "auto"]

    - id: climate.living_room
      name: "Климат гостиной"
      room: living_room
      sensor: sensor.living_room_temperature
      target: 23.0
      hysteresis: 0.5
      modes: ["heat", "cool", "auto"]

  ventilation:
    - id: fan.bathroom
      name: "Вентиляция ванной"
      room: bathroom
      humidity_sensor: sensor.bathroom_humidity
      humidity_threshold: 65
      timeout_sec: 1800

# Глобальные настройки автоматизации
automation_rules:
  lighting:
    manual_lockout_min: 60
    schedule_enabled: true
    motion_enabled: true

  climate:
    manual_lockout_min: 30
    safety_lockout_enabled: true
    away_mode_enabled: true

  ventilation:
    manual_lockout_min: 15
    humidity_based: true

# Зоны и комнаты
zones:
  - id: kitchen
    name: "Кухня"
    floor: 1

  - id: living_room
    name: "Гостиная"
    floor: 1

  - id: bedroom
    name: "Спальня"
    floor: 2

  - id: bathroom
    name: "Ванная"
    floor: 1

# Настройки дашборда
dashboard:
  title: "Leonid's House"
  show_motion_sensors: true
  show_climate: true
  show_history: true
  history_days: 7
