instance:
  id: leonids_house
  name: Leonid's House
  owner: Leo
  created_at: '2024-01-15'
version: 1
rooms:
- id: gostinaia
  name: Гостиная
  sensors:
    motion: binary_sensor.datchik_dvizheniia_gostinnaia_occupancy
    temperature: sensor.datchik_temperatury_gostinnaia_temperature
    humidity: sensor.datchik_temperatury_gostinnaia_humidity
    battery: sensor.datchik_temperatury_gostinnaia_battery
  devices:
  - id: switch.obogrevatel_gostinnaia
    type: climate
    name: Обогреватель гостиной
    behaviors:
    - template: climate_control
      priority: 10
      params:
        heater_timer: number.obogrevatel_gostinnaia_countdown
        run_minutes: 15
        hysteresis: 0.5
  - id: light.svet_nad_stolom
    type: light
    name: Свет над столом
    behaviors:
    - template: lighting
      priority: 10
      params:
        brightness_pct: 100
        color_temp_kelvin: 3000
    - template: night_light
      priority: 20
      params: {}
  - id: cover.shtora_v_gostinnoi_pravaia
    type: cover
    name: Штора над дверью (гостиная)
    behaviors:
    - template: cover_modes
      priority: 10
      params:
        cover_role: door
  - id: cover.shtora_v_gostinnoi_levaia
    type: cover
    name: Штора гостиной (левая)
    behaviors:
    - template: cover_modes
      priority: 10
      params: {}
  # Ниже — приборы «только показ» (поведений нет): платформа ими не управляет,
  # но владелец видит их на панели дома и в обходе. Автоматика добавляется
  # отдельно, когда решено, что именно должно управляться.
  - id: climate.termostat_gostinaia
    type: climate
    name: Термостат гостиной
    behaviors: []
  - id: climate.esphome_web_0d22a4_ac_name
    type: climate
    name: Кондиционер
    behaviors: []
  - id: light.ambient_light
    type: light
    name: Фоновый свет
    behaviors: []
  - id: light.kus
    type: light
    name: Кусь
    behaviors: []
  - id: switch.podsvetka_zerkala
    type: light
    name: Подсветка зеркала
    behaviors: []
- id: sanuzel
  name: Санузел
  sensors:
    motion: binary_sensor.vykliuchatel_sanuzel_presence
    humidity: sensor.datchik_temperatury_sanuzel_humidity
    temperature: sensor.datchik_temperatury_sanuzel_temperature
    battery: sensor.datchik_temperatury_sanuzel_battery
  devices:
  - id: switch.obogrevatel_sanuzel
    type: climate
    name: Обогреватель санузла
    behaviors:
    - template: climate_control
      priority: 10
      params:
        heater_timer: number.obogrevatel_sanuzel_countdown
        run_minutes: 15
        hysteresis: 0.5
  - id: light.vykliuchatel_sanuzel_switch1
    type: light
    name: Свет в санузле
    behaviors:
    - template: lighting
      priority: 10
      params: {}
  - id: fan.vykliuchatel_sanuzel_switch2
    type: fan
    name: Вытяжка санузла
    behaviors:
    - template: ventilation_modes
      priority: 10
      params:
        ventilation_role: exhaust
        exhaust_temp_threshold: 25.0
        exhaust_humidity_threshold: 65.0
        exhaust_seconds: 3600
  - id: light.zerkalo_sanuzel
    type: light
    name: Зеркало в санузле
    behaviors: []
  - id: switch.par_v_saune
    type: switch
    name: Пар в сауне
    behaviors: []
- id: konteiner
  name: Контейнер
  sensors:
    motion: binary_sensor.datchik_dvizheniia_konteiner_occupancy
    battery: sensor.datchik_dvizheniia_konteiner_battery
  devices:
  - id: light.svet_v_konteinere
    type: light
    name: Свет в контейнере
    behaviors:
    - template: lighting
      priority: 10
      params: {}
- id: terassa
  name: Терраса
  sensors:
    motion:
    - binary_sensor.main_motion
    - binary_sensor.terassa_motion
    person:
    - binary_sensor.main_person
    - binary_sensor.terassa_person
    animal:
    - binary_sensor.main_pet
    - binary_sensor.terassa_pet
    vehicle:
    - binary_sensor.main_vehicle
    - binary_sensor.terassa_vehicle
    battery: sensor.datchik_temperatury_terassa_battery
    humidity: sensor.datchik_temperatury_terassa_humidity
    temperature: sensor.datchik_temperatury_terassa_temperature
  devices:
  - id: light.girlianda_terassa
    type: light
    name: Гирлянда на террасе
    behaviors:
    - template: deco_light
      priority: 10
      params:
        off_by: sleep
  - id: switch.girlianda_terassa
    type: light
    name: Гирлянда на террасе (выключатель)
    behaviors: []
  - id: light.girlianda_na_oknakh
    type: light
    name: Гирлянда на окнах
    behaviors: []
  - id: light.podsvetka_stupenei
    type: light
    name: Подсветка ступеней
    behaviors: []
- id: spalnia
  name: Спальня
  sensors:
    temperature: sensor.datchik_temperatury_spalnia_temperature
    humidity: sensor.datchik_temperatury_spalnia_humidity
    battery: sensor.datchik_temperatury_spalnia_battery
  devices:
  - id: switch.obogrevatel_spalnia
    type: climate
    name: Обогреватель спальни
    behaviors:
    - template: climate_control
      priority: 10
      params:
        heater_timer: number.obogrevatel_spalnia_countdown
        run_minutes: 15
        hysteresis: 0.5
  - id: light.svet_v_spalne_right
    type: light
    name: Свет в спальне
    behaviors:
    - template: lighting
      priority: 10
      params: {}
  - id: fan.base_smart
    type: fan
    name: Рекуператор спальни
    behaviors:
    - template: ventilation_modes
      priority: 10
      params:
        ventilation_role: supply
        mode_summer: Рекуперация (лето)
        mode_winter: Рекуперация (зима)
        mode_airing: Приток MAX
        speed_normal: 42
        speed_min: 14
        speed_cold_reference: 5.0
        speed_cold_gain: 2.0
        airing_seconds: 3600
  - id: cover.shtora_v_spalne
    type: cover
    name: Штора спальни
    behaviors:
    - template: cover_modes
      priority: 10
      params:
        closes_when_dogs_only: true
- id: kabinet
  name: Кабинет
  sensors:
    temperature: sensor.datchik_temperatury_kabinet_temperature
    humidity: sensor.datchik_temperatury_kabinet_humidity
    battery: sensor.datchik_temperatury_kabinet_battery
  devices:
  - id: switch.obogrevatel_kabinet
    type: climate
    name: Обогреватель кабинета
    behaviors:
    - template: climate_control
      priority: 10
      params:
        heater_timer: number.obogrevatel_kabinet_countdown
        run_minutes: 15
        hysteresis: 0.5
  - id: light.group_lights_workroom_celllights
    type: light
    name: Свет в кабинете
    behaviors:
    - template: lighting
      priority: 10
      params: {}
  - id: fan.base_smart_2
    type: fan
    name: Рекуператор кабинета
    behaviors:
    - template: ventilation_modes
      priority: 10
      params:
        ventilation_role: supply
        mode_summer: Рекуперация (лето)
        mode_winter: Рекуперация (зима)
        mode_airing: Приток MAX
        speed_normal: 42
        speed_min: 14
        speed_cold_reference: 5.0
        speed_cold_gain: 2.0
        airing_seconds: 3600
  - id: cover.shtora_v_kabinete
    type: cover
    name: Штора кабинета
    behaviors:
    - template: cover_modes
      priority: 10
      params:
        closes_when_dogs_only: true
- id: gostevaia_spalnia
  name: Гостевая спальня
  sensors:
    temperature: sensor.datchik_temperatury_gostevaia_spalnia_temperature
    humidity: sensor.datchik_temperatury_gostevaia_spalnia_humidity
    battery: sensor.datchik_temperatury_gostevaia_spalnia_battery
  devices:
  - id: switch.maslianyi_radiator
    type: climate
    name: Масляный радиатор гостевой спальни
    behaviors:
    - template: climate_control
      priority: 10
      params:
        heater_timer: number.maslianyi_radiator_countdown
        run_minutes: 20
        hysteresis: 0.5
  - id: light.torsher
    type: light
    name: Торшер
    behaviors:
    - template: lighting
      priority: 10
      params: {}
- id: kukhnia
  name: Кухня
  # Камера на кухне — исключение из правила «камеры относятся к локациям»
  # (требование владельца 2026-10-18). Датчик дыма живёт здесь же.
  sensors:
    battery: sensor.datchik_dyma_battery
  devices:
  - id: camera.lc_profile000
    type: camera
    name: Камера на кухне
    behaviors: []
  - id: light.svet_nad_rabochei_poverkhnostiu
    type: light
    name: Свет над рабочей поверхностью
    behaviors: []
- id: sad
  name: Сад
  sensors:
    motion: binary_sensor.kalitka_sad_lc_motion_alarm
    temperature: sensor.datchik_temperatury_sad_temperature
    humidity: sensor.datchik_temperatury_sad_humidity
    battery: sensor.datchik_temperatury_sad_battery
    water_level: sensor.datchik_urovnia_vody_v_bakakh_liquid_level_percent
  devices:
  - id: light.vse_fonari
    type: light
    name: Основное освещение сада
    behaviors: []
  - id: light.group_nochnoe_osveshcheni
    type: light
    name: Ночное освещение
    behaviors:
    - template: deco_light
      priority: 10
      params:
        off_by: sunrise
  - id: light.fonar
    type: light
    name: Фонарь
    behaviors: []
  - id: light.fonar_dvor
    type: light
    name: Фонарь (двор)
    behaviors: []
  - id: light.fonar_parkovka
    type: light
    name: Фонарь (парковка)
    behaviors: []
  - id: light.fonar_u_teplitsy
    type: light
    name: Фонарь у теплицы
    behaviors: []
  - id: light.ulichnaia_girlianda
    type: light
    name: Уличная гирлянда
    behaviors: []
  - id: light.vorota_sad
    type: light
    name: Ворота (сад)
    behaviors: []
  - id: light.kalitka_vostok_sad
    type: light
    name: Калитка (восток, сад)
    behaviors: []
  - id: switch.nasos
    type: switch
    name: Насос садовый
    behaviors: []
  - id: switch.nasos_i_septik
    type: switch
    name: Насос и септик
    behaviors: []
  - id: valve.klapan_napolneniia_bakov
    type: valve
    name: Клапан наполнения баков
    behaviors: []
  - id: valve.klapany_a_l1
    type: valve
    name: Клапан A1 (теплица)
    behaviors: []
  - id: valve.klapany_a_l2
    type: valve
    name: Клапан A2
    behaviors: []
  - id: valve.klapany_a_l3
    type: valve
    name: Клапан A3
    behaviors: []
  - id: valve.klapany_a_l4
    type: valve
    name: Клапан A4
    behaviors: []
  - id: valve.klapany_b_l1
    type: valve
    name: Клапан B1
    behaviors: []
  - id: valve.klapany_b_l2
    type: valve
    name: Клапан B2
    behaviors: []
  - id: valve.klapany_b_l3
    type: valve
    name: Клапан B3
    behaviors: []
  - id: valve.klapany_b_l4
    type: valve
    name: Клапан B4
    behaviors: []
locations:
- id: ulitsa
  name: Улица
  kind: outdoor
  sensors:
    temperature: sensor.temperatura_na_ulitse_srednee
    rain: binary_sensor.datchik_dozhdia_water_leak
    illuminance: sensor.datchik_osveshchennosti_illuminance
    battery: sensor.datchik_dozhdia_battery
    contact: binary_sensor.datchik_otkrytiia_vorota_contact
  devices:
  # Ворота и калитки — чтобы было видно, о чём речь (требование владельца
  # 2026-10-18). Камеры относятся к локациям; кухня и гостиная — исключения.
  - id: light.vorota_sever
    type: light
    name: Ворота (север)
    behaviors: []
  - id: light.kalitka_sever_fonar
    type: light
    name: Калитка (север)
    behaviors: []
  - id: light.kalitka_vostok_ulitsa
    type: light
    name: Калитка (восток, улица)
    behaviors: []
  - id: light.kalitka_iug
    type: light
    name: Калитка (юг)
    behaviors: []
  - id: light.fonar_vorota
    type: light
    name: Фонарь (ворота)
    behaviors: []
  - id: light.lampa_na_vorotakh
    type: light
    name: Лампа на воротах
    behaviors: []
  - id: light.podsvetka_doma
    type: light
    name: Подсветка дома
    behaviors: []
  - id: camera.main_sub_lens_0
    type: camera
    name: Камера (улица)
    behaviors: []
  stale_after_sec: 86400
- id: gryadki
  name: Грядки
  kind: garden
  sensors:
    illuminance: sensor.0xa4c138ef3971344e_illuminance
    humidity: sensor.0xa4c138ef3971344e_humidity
    soil_ec: sensor.0xa4c138ef3971344e_soil_fertility
    soil_moisture: sensor.0xa4c138ef3971344e_soil_moisture
    battery: sensor.0xa4c138ef3971344e_battery
    soil_temperature: sensor.0xa4c138ef3971344e_temperature
  stale_after_sec: 86400
- id: teplitsa
  name: Теплица
  kind: garden
  # Теплица — локация в саду, а не комната (требование владельца 2026-10-18).
  sensors:
    temperature:
    - sensor.temperatura_v_teplitse_ogurtsy_temperature
    - sensor.temperatura_v_teplitse_tomaty_temperature
    - sensor.d1215es_new_current_temperature
    humidity: sensor.temperatura_v_teplitse_ogurtsy_humidity
    battery:
    - sensor.temperatura_v_teplitse_ogurtsy_battery
    - sensor.temperatura_v_teplitse_tomaty_battery
  devices:
  - id: switch.0x842712fffe34d820
    type: light
    name: Свет в теплице
    behaviors: []
  - id: switch.d1215es_new_start
    type: switch
    name: Обогрев теплицы (запуск)
    behaviors: []
  - id: switch.d1215es_new_heat_preservation
    type: switch
    name: Обогрев теплицы (сохранение тепла)
    behaviors: []
  - id: switch.podsvetka_rassady
    type: light
    name: Подсветка рассады
    behaviors: []
  - id: switch.klapan_poliva_rassady
    type: valve
    name: Клапан полива рассады
    behaviors: []
  stale_after_sec: 86400
# Тип батарейки по сущности: в тревоге о севшей батарейке и в сведениях о датчике
# видно, какую покупать (требование владельца 2026-10-15). Home Assistant тип не
# отдаёт — его знает владелец.
#
# Внимание: здесь стоит заготовка «AAA» для всех датчиков дома — так решил владелец
# 2026-10-16 («пока все AAA, позже поменяю руками»). Это не описание приборов, а
# место, куда владелец вписывает настоящие типы: угадывать их по модели нельзя —
# промах стоит покупки не той батарейки.
#
# Список охватывает датчики дома (кнопки, движения, температура, теплица, сад,
# улица). Личные приборы владельца (телефоны, часы, машина) сюда не входят: это не
# датчики дома, и в обходе дома они не участвуют.
battery_types:
  sensor.0xa4c138ef3971344e_battery: AAA
  sensor.datchik_dozhdia_battery: AAA
  sensor.datchik_dvizheniia_gostinnaia_battery: AAA
  sensor.datchik_dvizheniia_konteiner_battery: AAA
  sensor.datchik_dyma_battery: AAA
  sensor.datchik_osveshchennosti_battery: AAA
  sensor.datchik_otkrytiia_vorota_battery: AAA
  sensor.datchik_temperatury_gostevaia_spalnia_battery: AAA
  sensor.datchik_temperatury_gostinnaia_battery: AAA
  sensor.datchik_temperatury_kabinet_battery: AAA
  sensor.datchik_temperatury_sad_battery: AAA
  sensor.datchik_temperatury_sanuzel_battery: AAA
  sensor.datchik_temperatury_spalnia_battery: AAA
  sensor.datchik_temperatury_terassa_battery: AAA
  sensor.knopka_zvonka_vorota_battery: AAA
  sensor.my_doma_knopka_battery: AAA
  sensor.svet_v_kabinete_knopka_battery: AAA
  sensor.temperatura_v_teplitse_ogurtsy_battery: AAA
  sensor.temperatura_v_teplitse_tomaty_battery: AAA
  sensor.temperature_humidity_sensor_7c65_battery: AAA
  sensor.ulichnyi_svet_knopka_battery: AAA
  sensor.ulitsa_ulitsa_battery: AAA
automation_rules:
  global_manual_lockout_min: 60
  time_zone: Asia/Yekaterinburg
  lighting:
    quiet_from: '23:00'
    quiet_to: 06:30
    night_motion_rooms:
    - sanuzel
    - konteiner
    always_on_motion_rooms:
    - sanuzel
    - konteiner
    sleep_modifier: input_boolean.sleep_mode
    night_off_at: '23:00'
    morning_at: 07:00
    battery_watch_entities:
    - sensor.datchik_temperatury_terassa_battery
    - sensor.datchik_temperatury_sad_battery
  climate:
    setpoint_entity: input_number.temperatura
    thermostat_entity: climate.termostat_gostinaia
    comfort_max_entity: input_number.maksimalno_komfortnaia_temperatura
    season_entity: input_boolean.zima
    feature_entity: input_boolean.feature_climate
    ac_min_outside_temp: 5.0
    ac_entities:
    - climate.esphome_web_0d22a4_ac_name
    setpoint_min: 5.0
    setpoint_max: 30.0
  ventilation:
    feature_entity: input_boolean.feature_ventilation
    enable_entity: input_boolean.ventiliatsiia
    airing_entity: input_boolean.provetrivanie
    exhaust_entity: input_boolean.provetrivanie_vytyazhka
    outside_temp_entity: sensor.temperatura_na_ulitse_srednee
  cover:
    feature_entity: input_boolean.feature_covers
    my_doma_entity: input_boolean.my_doma
    sobaki_doma_entity: input_boolean.sobaki_doma
    night_close_entity: input_boolean.zakryvat_shtory_nochiu
    emergency_entity: input_boolean.covers_emergency_open
  locations:
    stale_after_sec: 3600
    presence_window_sec: 600
    mirror_enabled: true
    mqtt_prefix: behavioral
dashboard:
  title: ''
  rooms: []
  show_sensors: true
  show_devices: true
