instance:
  id: leonids_house
  name: Leonid's House
  owner: Leo
  created_at: '2024-01-15'
version: 1
rooms:
- id: gostinaia
  name: Гостиная
  sensors:
    motion: binary_sensor.datchik_dvizheniia_gostinnaia_occupancy
    temperature: sensor.datchik_temperatury_gostinnaia_temperature
    humidity: sensor.datchik_temperatury_gostinnaia_humidity
    battery: sensor.datchik_temperatury_gostinnaia_battery
  devices:
  - id: switch.obogrevatel_gostinnaia
    type: climate
    name: Обогреватель гостиной
    behaviors:
    - template: climate_control
      priority: 10
      params:
        heater_timer: number.obogrevatel_gostinnaia_countdown
        run_minutes: 15
        hysteresis: 0.5
  - id: light.svet_nad_stolom
    type: light
    name: Свет над столом
    behaviors:
    - template: lighting
      priority: 10
      params:
        brightness_pct: 100
        color_temp_kelvin: 3000
    - template: night_light
      priority: 20
      params: {}
  - id: cover.shtora_v_gostinnoi_pravaia
    type: cover
    name: Штора над дверью (гостиная)
    behaviors:
    - template: cover_modes
      priority: 10
      params:
        cover_role: door
  - id: cover.shtora_v_gostinnoi_levaia
    type: cover
    name: Штора гостиной (левая)
    behaviors:
    - template: cover_modes
      priority: 10
      params: {}
- id: sanuzel
  name: Санузел
  sensors:
    motion: binary_sensor.vykliuchatel_sanuzel_presence
    humidity: sensor.datchik_temperatury_sanuzel_humidity
    temperature: sensor.datchik_temperatury_sanuzel_temperature
    battery: sensor.datchik_temperatury_sanuzel_battery
  devices:
  - id: switch.obogrevatel_sanuzel
    type: climate
    name: Обогреватель санузла
    behaviors:
    - template: climate_control
      priority: 10
      params:
        heater_timer: number.obogrevatel_sanuzel_countdown
        run_minutes: 15
        hysteresis: 0.5
  - id: light.vykliuchatel_sanuzel_switch1
    type: light
    name: Свет в санузле
    behaviors:
    - template: lighting
      priority: 10
      params: {}
  - id: fan.vykliuchatel_sanuzel_switch2
    type: fan
    name: Вытяжка санузла
    behaviors:
    - template: ventilation_modes
      priority: 10
      params:
        ventilation_role: exhaust
        exhaust_temp_threshold: 25.0
        exhaust_humidity_threshold: 65.0
        exhaust_seconds: 3600
- id: konteiner
  name: Контейнер
  sensors:
    motion: binary_sensor.datchik_dvizheniia_konteiner_occupancy
    battery: sensor.datchik_dvizheniia_konteiner_battery
  devices:
  - id: light.svet_v_konteinere
    type: light
    name: Свет в контейнере
    behaviors:
    - template: lighting
      priority: 10
      params: {}
- id: terassa
  name: Терраса
  sensors:
    motion:
    - binary_sensor.main_motion
    - binary_sensor.terassa_motion
    person:
    - binary_sensor.main_person
    - binary_sensor.terassa_person
    animal:
    - binary_sensor.main_pet
    - binary_sensor.terassa_pet
    vehicle:
    - binary_sensor.main_vehicle
    - binary_sensor.terassa_vehicle
    battery: sensor.datchik_temperatury_terassa_battery
    humidity: sensor.datchik_temperatury_terassa_humidity
    temperature: sensor.datchik_temperatury_terassa_temperature
  devices:
  - id: light.girlianda_terassa
    type: light
    name: Гирлянда на террасе
    behaviors:
    - template: deco_light
      priority: 10
      params:
        off_by: sleep
- id: spalnia
  name: Спальня
  sensors:
    temperature: sensor.datchik_temperatury_spalnia_temperature
    humidity: sensor.datchik_temperatury_spalnia_humidity
    battery: sensor.datchik_temperatury_spalnia_battery
  devices:
  - id: switch.obogrevatel_spalnia
    type: climate
    name: Обогреватель спальни
    behaviors:
    - template: climate_control
      priority: 10
      params:
        heater_timer: number.obogrevatel_spalnia_countdown
        run_minutes: 15
        hysteresis: 0.5
  - id: light.svet_v_spalne_right
    type: light
    name: Свет в спальне
    behaviors:
    - template: lighting
      priority: 10
      params: {}
  - id: fan.base_smart
    type: fan
    name: Рекуператор спальни
    behaviors:
    - template: ventilation_modes
      priority: 10
      params:
        ventilation_role: supply
        mode_summer: Рекуперация (лето)
        mode_winter: Рекуперация (зима)
        mode_airing: Приток MAX
        speed_normal: 42
        speed_min: 14
        speed_cold_reference: 5.0
        speed_cold_gain: 2.0
        airing_seconds: 3600
  - id: cover.shtora_v_spalne
    type: cover
    name: Штора спальни
    behaviors:
    - template: cover_modes
      priority: 10
      params:
        closes_when_dogs_only: true
- id: kabinet
  name: Кабинет
  sensors:
    temperature: sensor.datchik_temperatury_kabinet_temperature
    humidity: sensor.datchik_temperatury_kabinet_humidity
    battery: sensor.datchik_temperatury_kabinet_battery
  devices:
  - id: switch.obogrevatel_kabinet
    type: climate
    name: Обогреватель кабинета
    behaviors:
    - template: climate_control
      priority: 10
      params:
        heater_timer: number.obogrevatel_kabinet_countdown
        run_minutes: 15
        hysteresis: 0.5
  - id: light.group_lights_workroom_celllights
    type: light
    name: Свет в кабинете
    behaviors:
    - template: lighting
      priority: 10
      params: {}
  - id: fan.base_smart_2
    type: fan
    name: Рекуператор кабинета
    behaviors:
    - template: ventilation_modes
      priority: 10
      params:
        ventilation_role: supply
        mode_summer: Рекуперация (лето)
        mode_winter: Рекуперация (зима)
        mode_airing: Приток MAX
        speed_normal: 42
        speed_min: 14
        speed_cold_reference: 5.0
        speed_cold_gain: 2.0
        airing_seconds: 3600
  - id: cover.shtora_v_kabinete
    type: cover
    name: Штора кабинета
    behaviors:
    - template: cover_modes
      priority: 10
      params:
        closes_when_dogs_only: true
- id: gostevaia_spalnia
  name: Гостевая спальня
  sensors:
    temperature: sensor.datchik_temperatury_gostevaia_spalnia_temperature
    humidity: sensor.datchik_temperatury_gostevaia_spalnia_humidity
    battery: sensor.datchik_temperatury_gostevaia_spalnia_battery
  devices:
  - id: switch.maslianyi_radiator
    type: climate
    name: Масляный радиатор гостевой спальни
    behaviors:
    - template: climate_control
      priority: 10
      params:
        heater_timer: number.maslianyi_radiator_countdown
        run_minutes: 20
        hysteresis: 0.5
  - id: light.torsher
    type: light
    name: Торшер
    behaviors:
    - template: lighting
      priority: 10
      params: {}
- id: sad
  name: Сад
  sensors:
    motion: binary_sensor.kalitka_sad_lc_motion_alarm
    temperature: sensor.datchik_temperatury_sad_temperature
    humidity: sensor.datchik_temperatury_sad_humidity
    battery: sensor.datchik_temperatury_sad_battery
  devices:
  - id: light.vse_fonari
    type: light
    name: Основное освещение сада
    behaviors: []
  - id: light.group_nochnoe_osveshcheni
    type: light
    name: Ночное освещение
    behaviors:
    - template: deco_light
      priority: 10
      params:
        off_by: sunrise
locations:
- id: ulitsa
  name: Улица
  kind: outdoor
  sensors:
    temperature: sensor.temperatura_na_ulitse_srednee
    rain: binary_sensor.datchik_dozhdia_water_leak
    illuminance: sensor.datchik_osveshchennosti_illuminance
    battery: sensor.datchik_dozhdia_battery
  stale_after_sec: 86400
- id: gryadki
  name: Грядки
  kind: garden
  sensors:
    illuminance: sensor.0xa4c138ef3971344e_illuminance
    soil_ec: sensor.0xa4c138ef3971344e_soil_fertility
    soil_moisture: sensor.0xa4c138ef3971344e_soil_moisture
    battery: sensor.0xa4c138ef3971344e_battery
    soil_temperature: sensor.0xa4c138ef3971344e_temperature
  stale_after_sec: 86400
automation_rules:
  global_manual_lockout_min: 60
  time_zone: Asia/Yekaterinburg
  lighting:
    quiet_from: '23:00'
    quiet_to: 06:30
    night_motion_rooms:
    - sanuzel
    - konteiner
    always_on_motion_rooms:
    - sanuzel
    - konteiner
    sleep_modifier: input_boolean.sleep_mode
    night_off_at: '23:00'
    morning_at: 07:00
    battery_watch_entities:
    - sensor.datchik_temperatury_terassa_battery
    - sensor.datchik_temperatury_sad_battery
  climate:
    setpoint_entity: input_number.temperatura
    thermostat_entity: climate.termostat_gostinaia
    comfort_max_entity: input_number.maksimalno_komfortnaia_temperatura
    season_entity: input_boolean.zima
    feature_entity: input_boolean.feature_climate
    ac_gate_entity: input_boolean.ispolzovat_konditsioner
    ac_min_outside_temp: 5.0
    ac_entities:
    - climate.esphome_web_0d22a4_ac_name
    setpoint_min: 5.0
    setpoint_max: 30.0
  ventilation:
    manual_lockout_min: 15
    humidity_based: true
    feature_entity: input_boolean.feature_ventilation
    enable_entity: input_boolean.ventiliatsiia
    airing_entity: input_boolean.provetrivanie
    exhaust_entity: input_boolean.provetrivanie_vytyazhka
    outside_temp_entity: sensor.temperatura_na_ulitse_srednee
  cover:
    feature_entity: input_boolean.feature_covers
    my_doma_entity: input_boolean.my_doma
    sobaki_doma_entity: input_boolean.sobaki_doma
    night_close_entity: input_boolean.zakryvat_shtory_nochiu
    emergency_entity: input_boolean.covers_emergency_open
  locations:
    stale_after_sec: 3600
    presence_window_sec: 600
    mirror_enabled: true
    mqtt_prefix: behavioral
dashboard:
  title: ''
  rooms: []
  show_sensors: true
  show_devices: true
