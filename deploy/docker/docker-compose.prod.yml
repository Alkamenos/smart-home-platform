services:
  behavioral-platform:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
      args:
        - BUILD_ENV=production
      # Оптимизация для быстрого построения
#      cache_from:
#        - type=registry
      labels:
        - "build.version=${BUILD_VERSION:-latest}"
    # ОДИН файл конфигурации — .env. Он же читается Compose для интерполяции
    # ${...} по умолчанию.
    #
    # Раньше стоял env_file: .env.prod, а рядом лежал ещё и .env с ДРУГИМИ
    # значениями (разные HA_URL). Compose читал .env для интерполяции, а блок
    # environment: ниже имел приоритет над env_file — то есть в контейнер
    # попадали значения из .env, а .env.prod был мёртвой конфигурацией.
    # Проверено запуском: HA_URL в контейнере был 192.168.2.10 (из .env),
    # хотя в .env.prod стоял 192.168.1.100. Оператор правил .env.prod и не
    # получал никакого эффекта.
    env_file:
      - .env
    container_name: behavioral-platform
    restart: unless-stopped

    # Минимальные права (спека 018, US3): entrypoint выравнивает права на тома
    # и сбрасывает их до UID 10001 через setpriv.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    # Нужны только для выравнивания прав на тома в entrypoint; после setpriv
    # процесс работает от 10001 без возможностей.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0

    # Статус на успешный запуск контейнера
    pull_policy: if_not_present

    ports:
      - "${WEBUI_PORT:-8125}:8125"

    # Network mode: host для доступа ко всем устройствам HA
#    network_mode: host

    # TTY для поддержки ANSI цветов в логах Docker
    tty: true
    stdin_open: false

    # Environment variables.
    #
    # Здесь только литералы и настройки, НЕ зависящие от оператора.
    # Переменные конфигурации (HA_URL, HA_WEBSOCKET_URL, HA_TOKEN, SHADOW_MODE,
    # LOG_LEVEL) намеренно НЕ дублируются через ${...}: такая запись делает
    # оболочку вторым источником истины, который молча перекрывает файл .env
    # (проверено: `HA_URL=... docker compose up -d` подменял адрес источника, и
    # отличить это от значения в .env было невозможно).
    #
    # CONFIG_PATH указывает на ТОЧКУ МОНТИРОВАНИЯ тома. Раньше здесь стояло
    # /app/instances/leonids_house — каталог в слое контейнера, а не в томе.
    # Правки манифеста из интерфейса при этом молча откатывались при каждом
    # пересоздании: проверено хешем, d5c0f6… → 743f2a… (правка) → d5c0f6….
    environment:
      - PYTHONUNBUFFERED=1
      - FORCE_COLOR=1                   # Принудительная раскраска для Docker
      - CLICOLOR_FORCE=1                # Универсальный флаг для CLI
      - CONFIG_PATH=/config/behavioral_platform
      - DATA_PATH=/data/behavioral_platform
      # Часовой пояс дома для правил «светло ли сейчас» и «не ночь ли». Контейнер
      # работает в UTC; без этой переменной окно дня считалось бы по часам
      # контейнера и разрешало свет с 02:00 до 04:00 по местному.
      - HOUSE_TIMEZONE=Asia/Yekaterinburg

    # Volumes
    volumes:
      # Конфигурация
      - ./config:/config/behavioral_platform:rw
      # Данные (состояния, логи)
      - ./data:/data/behavioral_platform:rw
      # Логи HA (опционально, для интеграции)
      - /var/log/homeassistant:/var/log/homeassistant:ro

    # Запас Docker на завершение больше таймаута uvicorn (8 с), иначе Docker
    # по умолчанию (10 с) может убить процесс SIGKILL, не дав выполниться
    # ctx.shutdown(): сторож не остановится, сессия адаптера не закроется.
    stop_grace_period: 20s

    # Health check
    healthcheck:
      test: [ "CMD", "python", "-m", "src.cli.health_check" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging driver
    #
    # 30 МБ × 7 — не «на всякий случай»: наблюдение за «светом над столом»
    # (BACKLOG B91) идёт по этим строкам двое суток, а прежние 10 МБ × 7
    # съедались за сутки с небольшим (замер 18.10: 15.45 МБ за 10.5 часа) —
    # нужная ночь успевала уйти в ротацию раньше, чем её прочтут.
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "7"

    # Labels для обнаружения в HA
    labels:
      - "behavioral.platform.enabled=true"
      - "behavioral.platform.version=1.0.0"
