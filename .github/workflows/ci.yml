name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/ examples/
      - run: black --check src/ tests/ examples/
      - run: isort --check src/ tests/ examples/
      - run: mypy src/ --ignore-missing-imports --disable-error-code=misc --disable-error-code=no-untyped-def --disable-error-code=no-any-return --disable-error-code=type-arg --disable-error-code=assignment --disable-error-code=attr-defined --disable-error-code=union-attr --disable-error-code=arg-type --disable-error-code=call-arg --disable-error-code=has-type --disable-error-code=var-annotated --disable-error-code=valid-type --disable-error-code=unused-ignore --disable-error-code=no-untyped-call --disable-error-code=index

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: pytest --ignore=tests/integration --cov=src --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Защита от зависания

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: docker-ha-${{ runner.os }}-${{ hashFiles('**/test_ha_integration.py') }}
          restore-keys: |
            docker-ha-${{ runner.os }}-

      - name: Pre-pull HA image (or load from cache)
        run: |
          set -e
          IMAGE="ghcr.io/home-assistant/home-assistant:stable"
          CACHE_FILE="/tmp/docker-images/ha-stable.tar"

          # Если есть в кеше — загружаем
          if [ -f "$CACHE_FILE" ]; then
            echo "📦 Загружаю образ из кеша..."
            docker load -i "$CACHE_FILE"
          else
            echo "📥 Скачиваю образ (~1GB)..."
            docker pull "$IMAGE"

            # Сохраняем в кеш для следующих запусков
            mkdir -p /tmp/docker-images
            docker save "$IMAGE" -o "$CACHE_FILE"
            echo "💾 Образ сохранён в кеш"
          fi

          # Создаём симлинк для совместимости
          docker tag "$IMAGE" homeassistant/home-assistant:stable 2>/dev/null || true

      - name: Install dependencies
        run: pip install -e ".[dev,integration]"

      - name: Run integration tests
        run: make test-integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          PYTEST_TIMEOUT: "300"
          # Ускоряем testcontainers: образ уже есть
          TESTCONTAINERS_CHECKS_DISABLE: "true"

      - name: Upload test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            .pytest_cache/
            htmlcov/
          retention-days: 7
