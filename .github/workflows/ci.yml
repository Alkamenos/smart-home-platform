name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/ examples/
      - run: black --check src/ tests/ examples/
      - run: isort --check src/ tests/ examples/
      - run: mypy src/ --ignore-missing-imports --disable-error-code=misc --disable-error-code=no-untyped-def --disable-error-code=no-any-return --disable-error-code=type-arg --disable-error-code=assignment --disable-error-code=attr-defined --disable-error-code=union-attr --disable-error-code=arg-type --disable-error-code=call-arg --disable-error-code=has-type --disable-error-code=var-annotated --disable-error-code=valid-type --disable-error-code=unused-ignore --disable-error-code=no-untyped-call --disable-error-code=index

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: pytest --cov=src --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
