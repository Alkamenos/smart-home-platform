repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix ]
      - id: ruff-format


  # mypy запускается из окружения проекта, а не из изолированного venv хука.
  # Раньше здесь стоял mirrors-mypy с additional_dependencies из трёх пакетов:
  # в его окружении нет aiohttp, uvicorn, watchdog, websockets,
  # prometheus_client, dotenv и cryptography, поэтому хук всегда падал с
  # 20 ошибками import-not-found и вынуждал к --no-verify. Настоящая проверка
  # одна — `make type-check`, и хук обязан выполнять ровно её, иначе он
  # проверяет не тот код и не той версией mypy.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (окружение проекта)
        entry: mypy src/
        language: system
        pass_filenames: false
        types: [ python ]

      # Фронтенд нового интерфейса (спека 017, research R-13): проверки зеркальны
      # питоновским, но запускаются только когда меняется frontend/ — иначе каждый
      # коммит платил бы за сборку фронта.
      - id: frontend-lint
        name: frontend (eslint + tsc)
        entry: bash -c 'cd frontend && pnpm exec eslint --fix && pnpm exec tsc --noEmit'
        language: system
        files: ^frontend/.*\.(ts|tsx|mjs|js)$
        pass_filenames: false

      - id: frontend-format
        name: frontend (prettier)
        entry: bash -c 'cd frontend && pnpm exec prettier --write .'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-test
        name: frontend (vitest)
        entry: bash -c 'cd frontend && pnpm exec vitest run --reporter=dot'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
