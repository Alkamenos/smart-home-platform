title: Leonid's House
views:
- title: Главная
  icon: mdi:home
  cards:
  - type: horizontal-stack
    cards:
    - type: button
      name: Включить
      icon: mdi:robot
      show_name: true
      tap_action:
        action: call-service
        service: platform_v3.enable_automation
        service_data: {}
    - type: button
      name: Выключить
      icon: mdi:robot-off
      show_name: true
      tap_action:
        action: call-service
        service: platform_v3.disable_automation
        service_data: {}
    - type: button
      name: Ручной
      icon: mdi:hand-left
      show_name: true
      tap_action:
        action: call-service
        service: platform_v3.manual_mode
        service_data: {}
    - type: button
      name: Статус
      icon: mdi:information-outline
      show_name: true
      tap_action:
        action: call-service
        service: platform_v3.status
        service_data: {}
    - type: button
      name: Сброс
      icon: mdi:refresh
      show_name: true
      tap_action:
        action: call-service
        service: platform_v3.reset_lockouts
        service_data: {}
  - type: entities
    title: 🏠 Автоматы
    show_header_toggle: false
    entities:
    - entity: sensor.platform_v3_climate_kitchen_state
      name: Климат Kitchen
      icon: mdi:thermometer
      secondary_info: last-changed
    - entity: sensor.platform_v3_climate_living_room_state
      name: Климат Living Room
      icon: mdi:thermometer
      secondary_info: last-changed
    - entity: sensor.platform_v3_light_kitchen_state
      name: Свет в Kitchen
      icon: mdi:lightbulb
      secondary_info: last-changed
    - entity: sensor.platform_v3_light_living_room_state
      name: Свет в Living Room
      icon: mdi:lightbulb
      secondary_info: last-changed
    - entity: sensor.platform_v3_light_bedroom_state
      name: Свет в Bedroom
      icon: mdi:lightbulb
      secondary_info: last-changed
    - entity: sensor.platform_v3_fan_bathroom_state
      name: Вентиляция ванной
      icon: mdi:fan
      secondary_info: last-changed
  - type: entities
    title: 👁️ Датчики движения
    show_header_toggle: false
    entities:
    - entity: binary_sensor.kitchen_motion
      name: 'Движение: Свет в Kitchen'
      icon: mdi:motion-sensor
      secondary_info: last-changed
    - entity: binary_sensor.living_room_motion
      name: 'Движение: Свет в Living Room'
      icon: mdi:motion-sensor
      secondary_info: last-changed
    - entity: binary_sensor.bedroom_motion
      name: 'Движение: Свет в Bedroom'
      icon: mdi:motion-sensor
      secondary_info: last-changed
  - type: entities
    title: 🌡️ Климат
    show_header_toggle: false
    entities:
    - entity: sensor.kitchen_temperature
      name: Климат Kitchen
      icon: mdi:thermometer
      secondary_info: last-changed
    - entity: sensor.living_room_temperature
      name: Климат Living Room
      icon: mdi:thermometer
      secondary_info: last-changed
- title: Kitchen
  path: kitchen
  icon: mdi:room
  cards:
  - type: entities
    title: mdi:thermometer Климат Kitchen
    show_header_toggle: false
    entities:
    - entity: sensor.platform_v3_climate_kitchen_state
      name: Состояние FSM
      icon: mdi:state-machine
    - content: '**Текущее состояние:** `unknown`'
      type: custom:markdown
  - type: entity-button
    entity: binary_sensor.platform_v3_climate_kitchen_climate_hysteresis_active
    name: climate_hysteresis
    subtitle: 'Приоритет: 10'
    icon: mdi:thermostat
    tap_action:
      action: more-info
    hold_action:
      action: none
  - type: entities
    title: 📜 История переходов
    show_header_toggle: false
    entities:
    - entity: sensor.platform_v3_climate_kitchen_history
      name: История переходов
      secondary_info: last-changed
    sort:
      method: last_changed
      reverse: true
  - type: horizontal-stack
    cards:
    - type: button
      name: Включить
      icon: mdi:power-on
      show_name: true
      tap_action:
        action: call-service
        service: climate.set_hvac_mode
        service_data:
          entity_id: climate.kitchen
    - type: button
      name: Выключить
      icon: mdi:power-off
      show_name: true
      tap_action:
        action: call-service
        service: climate.turn_off
        service_data:
          entity_id: climate.kitchen
    - type: button
      name: Ручной режим
      icon: mdi:hand-left
      show_name: true
      tap_action:
        action: call-service
        service: platform_v3.manual_mode
        service_data:
          entity_id: climate.kitchen
    - type: button
      name: Авто режим
      icon: mdi:robot
      show_name: true
      tap_action:
        action: call-service
        service: platform_v3.enable_automation
        service_data:
          entity_id: climate.kitchen
  - type: entities
    title: mdi:lightbulb Свет в Kitchen
    show_header_toggle: false
    entities:
    - entity: sensor.platform_v3_light_kitchen_state
      name: Состояние FSM
      icon: mdi:state-machine
    - content: '**Текущее состояние:** `unknown`'
      type: custom:markdown
  - type: entity-button
    entity: binary_sensor.platform_v3_light_kitchen_night_light_active
    name: night_light
    subtitle: 'Приоритет: 20'
    icon: mdi:lightbulb-night
    tap_action:
      action: more-info
    hold_action:
      action: none
  - type: entity-button
    entity: binary_sensor.platform_v3_light_kitchen_lighting_active
    name: lighting
    subtitle: 'Приоритет: 10'
    icon: mdi:lightbulb-on
    tap_action:
      action: more-info
    hold_action:
      action: none
  - type: entities
    title: 📜 История переходов
    show_header_toggle: false
    entities:
    - entity: sensor.platform_v3_light_kitchen_history
      name: История переходов
      secondary_info: last-changed
    sort:
      method: last_changed
      reverse: true
  - type: horizontal-stack
    cards:
    - type: button
      name: Включить
      icon: mdi:power-on
      show_name: true
      tap_action:
        action: call-service
        service: light.turn_on
        service_data:
          entity_id: light.kitchen
    - type: button
      name: Выключить
      icon: mdi:power-off
      show_name: true
      tap_action:
        action: call-service
        service: light.turn_off
        service_data:
          entity_id: light.kitchen
    - type: button
      name: Ручной режим
      icon: mdi:hand-left
      show_name: true
      tap_action:
        action: call-service
        service: platform_v3.manual_mode
        service_data:
          entity_id: light.kitchen
    - type: button
      name: Авто режим
      icon: mdi:robot
      show_name: true
      tap_action:
        action: call-service
        service: platform_v3.enable_automation
        service_data:
          entity_id: light.kitchen
