instance:
  id: leonid_house
  name: "Дом Леонида"
  timezone: Europe/Moscow
  locale: ru-RU
  version: "1.1.0"
  metadata:
    customer: "Леонид"
    platform_version: "0.3.0"
    notes: "Климат: гостиная + санузел + спальня + кабинет, shadow mode"

devices:
  sensors:
    - id: temp_gostinnaia
      entity: sensor.datchik_temperatury_gostinnaia_temperature
      role: climate_zone
    - id: temp_sanuzel
      entity: sensor.datchik_temperatury_sanuzel_temperature
      role: climate_zone
    - id: temp_spalnia
      entity: sensor.datchik_temperatury_spalnia_temperature
      role: climate_zone
    - id: temp_kabinet
      entity: sensor.datchik_temperatury_kabinet_temperature
      role: climate_zone
    - id: temp_outdoor
      entity: sensor.temperatura_na_ulitse_srednee
      role: climate_reference

  actuators:
    # Тёплый пол — глобальный, платформа не управляет
    - id: floor_heating_global
      entity: climate.termostat_gostinaia
      type: climate_device
      managed_by_platform: false

    # Гостиная
    - id: convector_gostinnaia
      entity: switch.obogrevatel_gostinnaia
      type: relay
      managed_by_platform: true
      min_cycle_minutes: 5
    - id: ac_gostinnaia
      entity: climate.esphome_web_0d22a4_ac_name
      type: climate_device
      managed_by_platform: true

    # Санузел
    - id: convector_sanuzel
      entity: switch.obogrevatel_sanuzel
      type: relay
      managed_by_platform: true
      min_cycle_minutes: 5

    # Спальня
    - id: convector_spalnia
      entity: switch.obogrevatel_spalnia
      type: relay
      managed_by_platform: true
      min_cycle_minutes: 5

    # Кабинет
    - id: convector_kabinet
      entity: switch.obogrevatel_kabinet
      type: relay
      managed_by_platform: true
      min_cycle_minutes: 5

features:
  
  lighting:
    enabled: true
    mode: shadow
    override_timeout_min: 60
    anti_cycle_min: 2
    dark:
      illuminance_sensor: sensor.datchik_osveshchennosti_illuminance
      dark_lux: 20
      light_lux: 40
      sun_dark_elevation: -3
      sun_light_elevation: 1
    night_flag: input_boolean.vecher
    presence_imitation:
      enabled_flag: input_boolean.feature_imitation
      # поведение добавим в подшаге 2

    groups:
      - id: yard_floodlights
        name: "Улица/двор основное"
        lights: [switch.group_lights_outdoor_floodlights]
        profile: dusk_till_time
        on: sunset
        off: "23:00"
        require_dark: true
        feature_flag: input_boolean.feature_yard

      - id: street_night
        name: "Уличное ночное"
        lights: [light.night_light]
        profile: dusk_till_dawn
        feature_flag: input_boolean.feature_street_night

      - id: office
        name: "Кабинет"
        lights: [light.workroom_lights]
        profile: dusk_till_time
        on: sunset
        off: "23:00"
        require_dark: true
        follow_global_ct: true
        feature_flag: input_boolean.feature_office

      - id: bedroom
        name: "Спальня"
        lights: [light.svet_v_spalne_right]
        profile: dusk_till_time
        on: sunset
        off: "22:30"
        require_dark: true
        feature_flag: input_boolean.feature_bedroom

      - id: kitchen_work
        name: "Кухня рабочая"
        lights: [switch.kitchen_lights]
        profile: manual_auto
        on: "18:00"
        off: "23:00"
        auto_flag: input_boolean.feature_kitchen_work
        feature_flag: input_boolean.feature_kitchen_work

      - id: table
        name: "Обеденный стол"
        lights: [light.table_lights]
        profile: manual_auto
        on: sunset
        off: "23:00"
        motion_sensor: binary_sensor.datchik_dvizheniia_gostinnaia_occupancy
        auto_flag: input_boolean.feature_table
        feature_flag: input_boolean.feature_table
        nightlight: { brightness: 40, color: [255,150,60] }

      - id: container
        name: "Контейнер"
        lights: [light.svet_v_konteinere]
        profile: motion
        motion_sensor: binary_sensor.datchik_dvizheniia_konteiner_occupancy
        no_motion_day_min: 5
        no_motion_night_min: 2
        feature_flag: input_boolean.feature_container

      - id: bathroom
        name: "Санузел"
        lights: [light.vykliuchatel_sanuzel_switch1]
        profile: motion
        motion_sensor: binary_sensor.vykliuchatel_sanuzel_presence
        no_motion_day_min: 5
        no_motion_night_min: 2
        feature_flag: input_boolean.feature_bathroom_light

      - id: garland_terrace
        name: "Гирлянда терраса"
        lights: [light.girlianda_terassa]
        profile: dusk_till_time
        on: sunset
        off: "23:00"
        tolerate_unavailable: true
        feature_flag: input_boolean.feature_garland_terrace

      - id: garland_street
        name: "Гирлянда уличная"
        lights: [light.ulichnaia_girlianda]
        profile: dusk_till_time
        on: sunset
        off: "23:00"
        tolerate_unavailable: true
        feature_flag: input_boolean.feature_garland_street

      - id: garland_windows
        name: "Окна (лето антимоскитная / зима гирлянда)"
        lights: [light.girlianda_na_oknakh]
        profile: dusk_till_dawn
        tolerate_unavailable: true
        feature_flag: input_boolean.feature_garland_windows
        season:
          summer: { profile: dusk_till_dawn }
          winter: { profile: dusk_till_time, off: "23:00" }

      - id: xmas_a2
        name: "Рождественская уличная"
        lights: [light.girlianda_a2]
        profile: dusk_till_time
        on: sunset
        off: "23:00"
        tolerate_unavailable: true
        feature_flag: input_boolean.feature_xmas_a2
  
  sensor_health:
    enabled: true
    check_interval_min: 10
    battery_threshold: 20
    sensors:
      - { entity: sensor.datchik_temperatury_gostinnaia_temperature, battery: CR2450, count: 1 }
      - { entity: sensor.datchik_temperatury_spalnia_temperature, battery: CR2450, count: 1 }
      - { entity: sensor.datchik_temperatury_kabinet_temperature, battery: CR2450, count: 1 }
      - { entity: sensor.datchik_temperatury_sanuzel_temperature, battery: CR2450, count: 1 }
      - { entity: sensor.datchik_temperatury_gostevaia_spalnia_temperature, battery: CR2450, count: 1 }
      - { entity: sensor.datchik_temperatury_terassa_temperature, battery: CR2450, count: 1 }
      - { entity: sensor.temperatura_v_teplitse_tomaty_temperature, battery: CR2450, count: 1 }
      - { entity: sensor.temperatura_v_teplitse_ogurtsy_temperature, battery: CR2450, count: 1 }
      - { entity: sensor.temperatura_v_teni_temperature, battery: CR2450, count: 1 }
  
  climate:
    enabled: true
    mode: shadow
    override_timeout_min: 120 # сколько минут платформа не спорит с ручным управлением
    season:
      source: input_boolean.zima
      heating_when: "on"

    safety:
      min_setpoint: 16
      ac_winter_lockout: true
      ac_lockout_outdoor_max: 5 # ниже этой уличной t кондей запрещён
      ac_lockout_warn: script.ac_lockout_warning # озвучить через Яндекс
      ac_dry_summer: true
      ac_dry_humidity: 60

    zones:
      - id: gostinnaia
        temp_sensor_ref: temp_gostinnaia
        setpoints:
          heat: { source: input_number.temperatura }
          cool: { source: input_number.maksimalno_komfortnaia_temperatura }
          deadband: 0.5
        actuators:
          - ref: convector_gostinnaia
            role: secondary_heat
            priority: 1
          - ref: ac_gostinnaia
            role: primary_cool
            priority: 2

      - id: sanuzel
        temp_sensor_ref: temp_sanuzel
        setpoints:
          heat: { source: input_number.temperatura_v_sanuzle }
          deadband: 0.5
        actuators:
          - ref: convector_sanuzel
            role: secondary_heat
            priority: 1

      - id: spalnia
        temp_sensor_ref: temp_spalnia
        setpoints:
          heat: { source: input_number.temperatura }
          deadband: 0.5
        actuators:
          - ref: convector_spalnia
            role: secondary_heat
            priority: 1

      - id: kabinet
        temp_sensor_ref: temp_kabinet
        setpoints:
          heat: { source: input_number.temperatura }
          deadband: 0.5
        actuators:
          - ref: convector_kabinet
            role: secondary_heat
            priority: 1
  ventilation:
    enabled: true
    mode: shadow # старт в наблюдении
    override_timeout_min: 60

    devices:
      - id: rek_spalnia
        entity: fan.base_smart
      - id: rek_kabinet
        entity: fan.base_smart_2

    sensors:
      outdoor_temp: sensor.temperatura_na_ulitse_srednee
      outdoor_humidity: sensor.datchik_temperatury_terassa_humidity
      house_humidity: input_number.vlazhnost_v_dome

    rooms:
      - id: spalnia
        temp: sensor.datchik_temperatury_spalnia_temperature
      - id: kabinet
        temp: sensor.datchik_temperatury_kabinet_temperature

    setpoints_ref:
      heat: input_number.temperatura
      cool: input_number.maksimalno_komfortnaia_temperatura

    speeds: { day: 40, away: 20 } # percentage 0-100
    deltas: { free_cool: 2, free_heat: 2, humidity: 5 }
    boost_minutes: 60
    winter_pause_outdoor_max: -5

    flags:
      night: input_boolean.vecher
      away_home: input_boolean.my_doma # on = дома
      boost_intake: input_boolean.provetrivanie
      boost_exhaust: input_boolean.provetrivanie_vytyazhka

    open_doors:
      enabled_flag: input_boolean.feature_open_doors # флаг отключения фичи
      mock: true # пока нет датчиков — mock
      mock_state: input_boolean.open_doors_mock_state
      sensors: # будущие реальные датчики
        - { entity: binary_sensor.gostinnaia_window }
        - { entity: binary_sensor.gostinnaia_door }
        - { entity: binary_sensor.gostevaia_spalnia_window }
        - { entity: binary_sensor.sanuzel_window }
        - { entity: binary_sensor.sanuzel_interroom_door }

    bathroom_fan:
      enabled_flag: input_boolean.feature_bathroom_fan
      entity: fan.vykliuchatel_sanuzel_switch2
      temp_sensor: sensor.datchik_temperatury_sanuzel_temperature
      humidity_sensor: sensor.datchik_temperatury_sanuzel_humidity
      temp_min: 26
      humidity_min: 60
      run_minutes: 15

globals:
  modes:
    zima:
      entity: input_boolean.zima
      affects: [climate]
  override_policy:
    physical_switch: { priority: highest, duration: indefinite }
    voice_assistant: { priority: medium, default_timeout_min: 120 }
  evaluation_intervals:
    climate_sec: 30
