<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Smart Home Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-dark-5@1.1.3/dist/css/bootstrap-dark.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; }
        .chart-container { position: relative; height: 400px; margin-bottom: 30px; }
    </style>
</head>
<body class="bg-dark text-light">
    <div class="container-fluid">
        <h1 class="mb-4">{{ title }}</h1>

        <!-- Time-series chart -->
        <div class="card bg-secondary mb-4">
            <div class="card-header">
                <h5>Event Activity (24 hours)</h5>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="eventsChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Heatmap placeholder -->
        <div class="card bg-secondary mb-4">
            <div class="card-header">
                <h5>Activity Heatmap by Hour</h5>
            </div>
            <div class="card-body">
                <div id="heatmapPlaceholder" class="text-center py-5">
                    <p class="text-muted">Heatmap visualization coming soon...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Fetch event history data and render chart
        fetch('/api/events/history')
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('eventsChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: { color: '#fff' }
                            }
                        },
                        scales: {
                            y: {
                                ticks: { color: '#ccc' },
                                grid: { color: '#444' }
                            },
                            x: {
                                ticks: { color: '#ccc' },
                                grid: { color: '#444' }
                            }
                        }
                    }
                });
            })
            .catch(error => {
                console.error('Error loading event history:', error);
            });
    </script>
</body>
</html>
