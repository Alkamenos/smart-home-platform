<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мастер добавления устройств - Smart Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/htmx.min.js"></script>
    <style>
        :root {
            --primary-color: #0d6efd;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --info-color: #0dcaf0;
        }

        body {
            font-size: 14px;
        }

        .device-card {
            border-left: 4px solid var(--primary-color);
            padding: 0;
            margin-bottom: 0.5rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .device-card:hover {
            background-color: rgba(13, 110, 253, 0.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .device-card.selected {
            background-color: rgba(25, 135, 84, 0.1);
            border-left-color: var(--success-color);
        }

        .device-checkbox {
            margin-right: 0.75rem;
            cursor: pointer;
            width: 1.25rem;
            height: 1.25rem;
        }

        .device-header {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            gap: 0.5rem;
        }

        .device-body {
            padding: 0 0.75rem 0.75rem 3.25rem;
            font-size: 0.85rem;
            color: #999;
        }

        .device-meta {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .badge-custom {
            background-color: rgba(13, 110, 253, 0.2);
            color: #0d6efd;
            padding: 0.35rem 0.6rem;
            border-radius: 0.25rem;
            font-size: 0.8rem;
        }

        .badge-auto {
            background-color: rgba(25, 135, 84, 0.2);
            color: var(--success-color);
        }

        .badge-manual {
            background-color: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .filter-sidebar {
            position: sticky;
            top: 1rem;
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
        }

        .filter-group {
            margin-bottom: 1.5rem;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 0.5rem;
            display: block;
        }

        .filter-btn {
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            text-align: left;
            justify-content: flex-start;
        }

        .preview-panel {
            position: sticky;
            top: 1rem;
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 0.5rem;
            padding: 1rem;
        }

        .preview-item {
            background: rgba(13, 110, 253, 0.05);
            border-left: 3px solid var(--primary-color);
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
        }

        .preview-item-remove {
            cursor: pointer;
            color: var(--danger-color);
            float: right;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .preview-item-remove:hover {
            opacity: 1;
        }

        .stat-box {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .stat-box h4 {
            margin-bottom: 0.25rem;
            color: var(--primary-color);
        }

        .stat-box p {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 0;
        }

        .search-input {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
        }

        .search-input::placeholder {
            color: #999;
        }

        .btn-action {
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
        }

        .progress-indicator {
            font-size: 0.8rem;
            padding: 0.5rem;
            background: rgba(13, 110, 253, 0.1);
            border-radius: 0.25rem;
            text-align: center;
            color: var(--primary-color);
        }

        .devices-loading {
            text-align: center;
            padding: 2rem;
            color: #999;
        }

        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #999;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 1024px) {
            .filter-sidebar {
                max-height: 400px;
            }

            .preview-panel {
                max-height: 400px;
            }
        }

        .alert-custom {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        .select-all-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            margin-right: 0.75rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom">
        <div class="container-fluid">
            <span class="navbar-brand">
                <i class="bi bi-plus-circle"></i> Добавление устройств
            </span>
            <div class="d-flex gap-2 align-items-center">
                <small id="source-info" class="text-muted"></small>
                <a href="/" class="btn btn-outline-secondary btn-sm">← Назад</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4 mb-4">
        <!-- Header with stats -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-md-3">
                                <div class="stat-box">
                                    <h4 id="total-devices">-</h4>
                                    <p>Всего устройств</p>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="stat-box">
                                    <h4 id="auto-count">-</h4>
                                    <p>✅ Автоприменение</p>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="stat-box">
                                    <h4 id="manual-count">-</h4>
                                    <p>⚠️ Требует внимания</p>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="stat-box">
                                    <h4 id="selected-count">0</h4>
                                    <p>🎯 Выбрано</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main content -->
        <div class="row">
            <!-- Left: Filters and Scan -->
            <div class="col-lg-2">
                <div class="card border-0 shadow-sm filter-sidebar">
                    <div class="card-body">
                        <h6 class="mb-3">
                            <i class="bi bi-funnel"></i> Управление
                        </h6>

                        <button id="scan-btn" class="btn btn-primary w-100 btn-action mb-3" onclick="startScan()">
                            <i class="bi bi-arrow-repeat"></i> Сканировать
                        </button>

                        <hr>

                        <div class="filter-group">
                            <label>Быстрый выбор</label>
                            <button class="btn btn-outline-secondary w-100 filter-btn mb-2" onclick="selectAll()">
                                ✓ Выбрать все
                            </button>
                            <button class="btn btn-outline-secondary w-100 filter-btn mb-2" onclick="deselectAll()">
                                ✗ Очистить
                            </button>
                            <button class="btn btn-outline-secondary w-100 filter-btn" onclick="selectAuto()">
                                ✅ Только авто
                            </button>
                        </div>

                        <hr>

                        <div class="filter-group">
                            <label>По домену</label>
                            <div id="domain-filters"></div>
                        </div>

                        <div class="filter-group">
                            <label>По категории</label>
                            <div id="category-filters"></div>
                        </div>

                        <div class="filter-group">
                            <label>Поиск</label>
                            <input type="text" id="search-box" class="form-control form-control-sm search-input"
                                   placeholder="Entity ID или имя..." oninput="applyFilters()">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center: Device List -->
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="bi bi-list-ul"></i> Обнаруженные устройства
                        </h5>
                        <div id="pagination-info" class="text-muted small"></div>
                    </div>
                    <div class="card-body" style="max-height: calc(100vh - 300px); overflow-y: auto;">
                        <div id="devices-container" class="devices-loading">
                            <p class="text-muted">Нажмите "Сканировать" для начала</p>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent">
                        <nav aria-label="Пагинация">
                            <ul class="pagination pagination-sm justify-content-center mb-0" id="pagination-controls">
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>

            <!-- Right: Preview and Actions -->
            <div class="col-lg-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent">
                        <h5 class="mb-0">
                            <i class="bi bi-eye"></i> Предпросмотр
                        </h5>
                    </div>
                    <div class="preview-panel">
                        <div id="preview-list">
                            <p class="text-muted text-center" style="padding: 1rem 0;">
                                Выбранных устройств нет
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Action buttons -->
                <div class="card border-0 shadow-sm mt-3">
                    <div class="card-body">
                        <button class="btn btn-outline-primary w-100 btn-action mb-2" onclick="dryRun()">
                            <i class="bi bi-eye"></i> Тестовый запуск
                        </button>
                        <button class="btn btn-success w-100 btn-action" onclick="applySelected()">
                            <i class="bi bi-check-circle"></i> Применить
                        </button>
                    </div>
                </div>

                <!-- Status -->
                <div id="status-area" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allDevices = [];
        let selectedDevices = new Set();
        let currentPage = 1;
        let totalPages = 1;
        let currentFilters = {
            domain: null,
            category: null,
            search: ''
        };
        let discoveryData = null;
        const sourceId = new URLSearchParams(window.location.search).get('source_id');

        async function loadDiscoveryData() {
            if (!sourceId) {
                showStatus('error', 'Не указан source_id. Пожалуйста, откройте страницу с параметром ?source_id=UUID');
                return;
            }

            try {
                console.log('Загружаю данные для source_id:', sourceId);
                const url = `/api/v1/devices/sources/${sourceId}/discovery-data`;
                console.log('Запрос к:', url);

                const response = await fetch(url);

                console.log('Ответ статус:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Ошибка ответа:', errorText);
                    throw new Error(`Статус ${response.status}: ${errorText}`);
                }

                discoveryData = await response.json();
                console.log('Discovery data loaded:', discoveryData);
                return discoveryData;
            } catch (error) {
                console.error('Full error:', error);
                showStatus('error', `Ошибка загрузки: ${error.message}`);
                return null;
            }
        }

        async function startScan() {
            const btn = document.getElementById('scan-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Сканирование...';

            try {
                // Load discovery data from HA
                const haData = await loadDiscoveryData();
                if (!haData) {
                    throw new Error('Не удалось загрузить данные из Home Assistant. Проверьте консоль для деталей.');
                }

                console.log('Преобразую данные для отображения...');

                // Transform available_devices to the expected format
                allDevices = (haData.available_devices || []).map(device => {
                    const domain = device.device_type || 'unknown';
                    return {
                        entity_id: device.entity_id,
                        friendly_name: device.friendly_name,
                        name: device.friendly_name,
                        device_type: domain,
                        domain: domain,
                        category: domain === 'light' ? 'lighting' :
                                  domain === 'climate' ? 'climate' :
                                  domain === 'sensor' ? 'sensors' :
                                  'other',
                        state: device.state || 'unknown',
                        area_id: device.area_id,
                        area_name: device.area_name,
                        icon: device.icon,
                        auto_apply: true,
                        suggested_behavior: suggestBehavior(domain)
                    };
                });

                console.log('Загружено устройств:', allDevices.length);

                totalPages = Math.ceil(allDevices.length / 25);
                currentPage = 1;

                const stats = {
                    total: allDevices.length,
                    auto_apply_stats: {
                        auto_apply: allDevices.filter(d => d.auto_apply).length,
                        manual: allDevices.filter(d => !d.auto_apply).length
                    },
                    by_domain: groupBy(allDevices, 'domain'),
                    by_category: groupBy(allDevices, 'category')
                };

                updateStats(stats);
                renderFilterButtons(stats);
                renderDevices(allDevices.slice(0, 25));
                renderPagination();

                showStatus('success', `✅ Загружено ${allDevices.length} устройств`);

                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Сканировать';
            } catch (error) {
                console.error('startScan error:', error);
                showStatus('error', `Ошибка сканирования: ${error.message}`);
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Сканировать';
            }
        }

        function suggestBehavior(domain) {
            const behaviorMap = {
                'light': 'lighting',
                'climate': 'climate_control',
                'switch': 'switch_control',
                'sensor': 'sensor_monitoring',
                'binary_sensor': 'binary_sensor_monitoring'
            };
            return behaviorMap[domain] || null;
        }

        function groupBy(arr, key) {
            return arr.reduce((result, item) => {
                const groupKey = item[key] || 'unknown';
                result[groupKey] = (result[groupKey] || 0) + 1;
                return result;
            }, {});
        }

        function updateStats(data) {
            document.getElementById('total-devices').textContent = data.total;
            document.getElementById('auto-count').textContent = data.auto_apply_stats?.auto_apply || 0;
            document.getElementById('manual-count').textContent = data.auto_apply_stats?.manual || 0;
        }

        function renderFilterButtons(data) {
            // Domain filters
            const domainContainer = document.getElementById('domain-filters');
            domainContainer.innerHTML = '';
            Object.entries(data.by_domain || {}).forEach(([domain, count]) => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-outline-secondary w-100 filter-btn';
                btn.textContent = `${domain} (${count})`;
                btn.onclick = () => {
                    currentFilters.domain = currentFilters.domain === domain ? null : domain;
                    applyFilters();
                };
                domainContainer.appendChild(btn);
            });

            // Category filters
            const categoryContainer = document.getElementById('category-filters');
            categoryContainer.innerHTML = '';
            Object.entries(data.by_category || {}).forEach(([category, count]) => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-outline-secondary w-100 filter-btn';
                btn.textContent = `${category} (${count})`;
                btn.onclick = () => {
                    currentFilters.category = currentFilters.category === category ? null : category;
                    applyFilters();
                };
                categoryContainer.appendChild(btn);
            });
        }

        function renderDevices(devices) {
            const container = document.getElementById('devices-container');
            if (devices.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <p>Устройства не найдены</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="list-group list-group-flush">';
            devices.forEach(device => {
                const isSelected = selectedDevices.has(device.entity_id);
                const autoApplyBadge = device.auto_apply
                    ? '<span class="badge badge-custom badge-auto">✅ Авто</span>'
                    : '<span class="badge badge-custom badge-manual">⚠️ Ручное</span>';

                const areaDisplay = device.area_name
                    ? `<span class="badge badge-custom">📍 ${device.area_name}</span>`
                    : '<span class="badge badge-custom" style="opacity: 0.5;">📍 нет комнаты</span>';

                html += `
                    <div class="card device-card ${isSelected ? 'selected' : ''}"
                         onclick="toggleDevice('${device.entity_id}', this)">
                        <div class="device-header">
                            <input type="checkbox" class="device-checkbox"
                                   ${isSelected ? 'checked' : ''}
                                   onclick="event.stopPropagation()">
                            <div class="flex-grow-1">
                                <div style="font-weight: 500;">${device.friendly_name || device.name}</div>
                                <small style="color: #666;">${device.entity_id}</small>
                            </div>
                            ${autoApplyBadge}
                        </div>
                        <div class="device-body">
                            <div class="device-meta">
                                <span class="badge badge-custom">🏷️ ${device.domain}</span>
                                <span class="badge badge-custom">📁 ${device.category}</span>
                                ${areaDisplay}
                            </div>
                            ${device.suggested_behavior ? `<div style="margin-top: 0.5rem;"><small>Шаблон: <strong>${device.suggested_behavior}</strong></small></div>` : ''}
                            <div style="margin-top: 0.5rem; color: #777;"><small>Статус: ${device.state}</small></div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function renderPagination() {
            const container = document.getElementById('pagination-controls');
            const infoContainer = document.getElementById('pagination-info');

            infoContainer.textContent = `Страница ${currentPage} из ${totalPages}`;
            let html = '';

            // Previous
            html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                <button class="page-link" onclick="goToPage(${currentPage - 1})">← Пред.</button>
            </li>`;

            // Page numbers
            const maxVisible = 5;
            let start = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let end = Math.min(totalPages, start + maxVisible - 1);
            if (end - start + 1 < maxVisible) {
                start = Math.max(1, end - maxVisible + 1);
            }

            for (let i = start; i <= end; i++) {
                html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                    <button class="page-link" onclick="goToPage(${i})">${i}</button>
                </li>`;
            }

            // Next
            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                <button class="page-link" onclick="goToPage(${currentPage + 1})">След. →</button>
            </li>`;

            container.innerHTML = html;
        }

        async function goToPage(page) {
            if (page < 1 || page > totalPages) return;

            currentPage = page;
            const filteredDevices = filterDevices(allDevices);
            const start = (page - 1) * 25;
            const end = start + 25;

            renderDevices(filteredDevices.slice(start, end));
            renderPagination();
        }

        function filterDevices(devices) {
            return devices.filter(d => {
                if (currentFilters.domain && d.domain !== currentFilters.domain) return false;
                if (currentFilters.category && d.category !== currentFilters.category) return false;
                if (currentFilters.search) {
                    const search = currentFilters.search.toLowerCase();
                    if (!d.entity_id.toLowerCase().includes(search) &&
                        !d.friendly_name.toLowerCase().includes(search)) {
                        return false;
                    }
                }
                return true;
            });
        }

        function applyFilters() {
            currentFilters.search = document.getElementById('search-box').value;
            currentPage = 1;
            const filteredDevices = filterDevices(allDevices);
            totalPages = Math.ceil(filteredDevices.length / 25);
            renderDevices(filteredDevices.slice(0, 25));
            renderPagination();
        }

        function toggleDevice(entityId, element) {
            if (selectedDevices.has(entityId)) {
                selectedDevices.delete(entityId);
            } else {
                selectedDevices.add(entityId);
            }
            updatePreview();
            element.classList.toggle('selected');
        }

        function selectAll() {
            const filteredDevices = filterDevices(allDevices);
            filteredDevices.forEach(d => selectedDevices.add(d.entity_id));
            updatePreview();
            document.querySelectorAll('.device-card').forEach(el => el.classList.add('selected'));
        }

        function deselectAll() {
            selectedDevices.clear();
            updatePreview();
            document.querySelectorAll('.device-card').forEach(el => el.classList.remove('selected'));
        }

        function selectAuto() {
            selectedDevices.clear();
            allDevices.forEach(d => {
                if (d.auto_apply) selectedDevices.add(d.entity_id);
            });
            updatePreview();
            document.querySelectorAll('.device-card').forEach(el => {
                const isAuto = allDevices.some(d => d.entity_id && el.textContent.includes(d.entity_id) && d.auto_apply);
                el.classList.toggle('selected', isAuto);
            });
        }

         let deviceRoomAssignments = {};

         function updatePreview() {
             const container = document.getElementById('preview-list');
             document.getElementById('selected-count').textContent = selectedDevices.size;

             if (selectedDevices.size === 0) {
                 container.innerHTML = '<p class="text-muted text-center" style="padding: 1rem 0;">Выбранных устройств нет</p>';
                 return;
             }

             let html = '';
             selectedDevices.forEach(entityId => {
                 const device = allDevices.find(d => d.entity_id === entityId);
                 if (device) {
                     const assignedRoom = deviceRoomAssignments[entityId] || device.area_id || 'unassigned';
                     const areaName = device.area_name || 'нет комнаты';
                     html += `
                         <div class="preview-item">
                             <span class="preview-item-remove" onclick="toggleDevice('${entityId}'); updatePreview();">✕</span>
                             <strong>${device.friendly_name || device.name}</strong><br>
                             <small>${device.entity_id}</small><br>
                             <small style="color: #999;">
                                 Комната:
                                 <a href="#" onclick="openRoomSelector('${entityId}'); return false;" style="cursor: pointer; text-decoration: underline;">
                                     ${assignedRoom === device.area_id ? areaName : assignedRoom}
                                 </a>
                             </small>
                         </div>
                     `;
                 }
             });
             container.innerHTML = html;
         }

         function openRoomSelector(entityId) {
             const device = allDevices.find(d => d.entity_id === entityId);
             const currentRoom = deviceRoomAssignments[entityId] || device.area_id || 'unassigned';

             // Create modal
             const modal = document.createElement('div');
             modal.className = 'modal fade';
             modal.id = 'roomSelectorModal';
             modal.tabIndex = -1;
             modal.innerHTML = `
                 <div class="modal-dialog modal-sm">
                     <div class="modal-content bg-dark border-secondary">
                         <div class="modal-header border-secondary">
                             <h5 class="modal-title">
                                 Выбор комнаты для ${device.friendly_name || device.name}
                             </h5>
                             <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                         </div>
                         <div class="modal-body">
                             <div class="mb-3">
                                 <label class="form-label">Доступные комнаты из Home Assistant:</label>
                                 <div id="roomOptions" style="max-height: 200px; overflow-y: auto;">
                                     ${discoveryData && discoveryData.areas && discoveryData.areas.length > 0
                                         ? discoveryData.areas.map(area => `
                                             <div class="form-check">
                                                 <input class="form-check-input room-radio" type="radio" name="room" id="room_${area.id}" value="${area.id}"
                                                     ${currentRoom === area.id ? 'checked' : ''}>
                                                 <label class="form-check-label" for="room_${area.id}">
                                                     ${area.icon ? `<i class="${area.icon}"></i> ` : ''}${area.name}
                                                 </label>
                                             </div>
                                         `).join('')
                                         : '<p class="text-muted small">Нет доступных комнат в Home Assistant</p>'
                                     }
                                 </div>
                             </div>
                             <hr>
                             <div class="mb-3">
                                 <label class="form-label">Или указайте вручную:</label>
                                 <input type="text" class="form-control form-control-sm bg-secondary text-white border-secondary"
                                        id="newRoomName" placeholder="Код комнаты (например: kitchen)">
                                 <small class="text-muted d-block mt-2">Используйте строчные буквы и подчеркивание</small>
                             </div>
                         </div>
                         <div class="modal-footer border-secondary">
                             <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                             <button type="button" class="btn btn-primary" onclick="saveRoomAssignment('${entityId}')">Сохранить</button>
                         </div>
                     </div>
                 </div>
             `;

             document.body.appendChild(modal);
             const roomModal = new bootstrap.Modal(modal);
             roomModal.show();
             modal.addEventListener('hidden.bs.modal', () => modal.remove());
         }

         function saveRoomAssignment(entityId) {
             const selectedRadio = document.querySelector('input[name="room"]:checked');
             const newRoomName = document.getElementById('newRoomName').value.trim().toLowerCase();

             let selectedRoom = null;
             if (selectedRadio) {
                 selectedRoom = selectedRadio.value;
             } else if (newRoomName) {
                 selectedRoom = newRoomName.replace(/\s+/g, '_');
             }

             if (!selectedRoom) {
                 alert('Пожалуйста, выберите комнату или введите новую');
                 return;
             }

             deviceRoomAssignments[entityId] = selectedRoom;
             updatePreview();

             // Close modal
             const modal = document.getElementById('roomSelectorModal');
             const bsModal = bootstrap.Modal.getInstance(modal);
             bsModal.hide();
         }

         async function dryRun() {
             if (selectedDevices.size === 0) {
                 showStatus('warning', 'Выберите хотя бы одно устройство');
                 return;
             }

             const selections = Array.from(selectedDevices).map(entityId => {
                 const device = allDevices.find(d => d.entity_id === entityId);
                 const assignedRoom = deviceRoomAssignments[entityId] || device.area_id || 'unassigned';
                 return {
                     device_entity_id: entityId,
                     target_room: assignedRoom,
                     behavior_template: device.suggested_behavior,
                     ha_area_id: device.area_id
                 };
             });

             showStatus('info', 'Проверка...');

             try {
                 const response = await fetch('/api/v1/devices/apply', {
                     method: 'POST',
                     headers: {'Content-Type': 'application/json'},
                     body: JSON.stringify({source_id: sourceId, selections, dry_run: true})
                 });

                 if (!response.ok) throw new Error(await response.text());
                 const result = await response.json();
                 showStatus('info', `Будет добавлено устройств: <strong>${result.devices_count || selectedDevices.size}</strong>`);
             } catch (error) {
                 showStatus('error', `Ошибка: ${error.message}`);
             }
         }

         async function applySelected() {
             if (selectedDevices.size === 0) {
                 showStatus('warning', 'Выберите хотя бы одно устройство');
                 return;
             }

             const selections = Array.from(selectedDevices).map(entityId => {
                 const device = allDevices.find(d => d.entity_id === entityId);
                 const assignedRoom = deviceRoomAssignments[entityId] || device.area_id || 'unassigned';
                 return {
                     device_entity_id: entityId,
                     target_room: assignedRoom,
                     behavior_template: device.suggested_behavior,
                     ha_area_id: device.area_id
                 };
             });

             showStatus('info', '<span class="spinner-border spinner-border-sm me-2"></span>Применение...');

             try {
                 const response = await fetch('/api/v1/devices/apply', {
                     method: 'POST',
                     headers: {'Content-Type': 'application/json'},
                     body: JSON.stringify({source_id: sourceId, selections, dry_run: false})
                 });

                 if (!response.ok) throw new Error(await response.text());
                 const result = await response.json();

                 if (result.success) {
                     showStatus('success',
                         `✅ Успешно добавлено: <strong>${result.devices_count || selectedDevices.size}</strong> устройств`);
                     selectedDevices.clear();
                     deviceRoomAssignments = {};
                     updatePreview();
                     deselectAll();
                 } else {
                     showStatus('error', 'Ошибка при применении');
                 }
             } catch (error) {
                 showStatus('error', `Ошибка: ${error.message}`);
             }
         }

        function showStatus(type, message) {
            const statusArea = document.getElementById('status-area');
            const alertClass = {
                'success': 'alert-success',
                'error': 'alert-danger',
                'warning': 'alert-warning',
                'info': 'alert-info'
            }[type] || 'alert-info';

            statusArea.innerHTML = `
                <div class="alert ${alertClass} alert-custom" role="alert">
                    ${message}
                </div>
            `;

            // Auto-hide after 5 seconds for success
            if (type === 'success') {
                setTimeout(() => statusArea.innerHTML = '', 5000);
            }
        }

         // Auto-load on page load
         window.addEventListener('load', () => {
             // Display source ID info
             const sourceInfo = document.getElementById('source-info');
             if (!sourceId) {
                 sourceInfo.innerHTML = '⚠️ Нет source_id в URL';
                 showStatus('error', 'Пожалуйста, откройте страницу с параметром: ?source_id=YOUR_UUID');
             } else {
                 sourceInfo.innerHTML = `📋 Source: <code>${sourceId.substring(0, 8)}...</code>`;
                 startScan();
             }
         });
    </script>
</body>
</html>
