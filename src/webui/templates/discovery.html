<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мастер добавления устройств — Smart Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-size: 14px; }

        .device-card {
            border-left: 4px solid var(--bs-primary);
            padding: 0;
            margin-bottom: 0.5rem;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }
        .device-card:hover { background-color: rgba(13, 110, 253, 0.05); }
        .device-card.selected { background-color: rgba(25, 135, 84, 0.1); border-left-color: var(--bs-success); }
        .device-card.disabled { opacity: 0.5; cursor: not-allowed; }
        .device-checkbox { margin-right: 0.5rem; width: 1.1rem; height: 1.1rem; }
        .device-header { display: flex; align-items: center; padding: 0.6rem 0.75rem; gap: 0.5rem; }
        .device-body { padding: 0 0.75rem 0.6rem 2.6rem; }
        .source-card { cursor: pointer; height: 100%; }
        .source-card.active { border-color: var(--bs-success); }
        .filter-btn { font-size: 0.8rem; }
        .btn-action { font-size: 0.85rem; }
        .empty-state { padding: 2rem 1rem; text-align: center; }
        code.entity-id { font-size: 0.75rem; }
    </style>
</head>
<body data-user-id="{{ user_id }}"
      data-user-is-admin="{{ 'true' if user_is_admin else 'false' }}">

<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h4 mb-0"><i class="bi bi-magic"></i> Мастер добавления устройств</h1>
            <small id="source-info" class="text-muted">Источник не выбран</small>
        </div>
        <a href="/" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-house"></i> К списку устройств
        </a>
    </div>

    <!-- Шаг 1: выбор или создание источника -->
    <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-hdd-network"></i> Шаг 1. Источник Home Assistant</span>
            <button class="btn btn-sm btn-outline-primary" type="button"
                    data-bs-toggle="collapse" data-bs-target="#source-form-collapse"
                    aria-controls="source-form-collapse" aria-expanded="false">
                <i class="bi bi-plus-circle"></i> Создать источник
            </button>
        </div>
        <div class="card-body">
            <div id="sources-list" class="row g-3">
                <div class="col-12 text-muted" id="sources-loading">
                    <span class="spinner-border spinner-border-sm me-2"></span>Загрузка источников…
                </div>
            </div>

            <div class="collapse mt-3" id="source-form-collapse">
                <form id="source-form" class="row g-3" novalidate>
                    <div class="col-md-4">
                        <label class="form-label" for="source-name">Название</label>
                        <input class="form-control form-control-sm" id="source-name"
                               name="name" placeholder="Дом" required>
                        <div class="invalid-feedback" id="source-name-error"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="source-url">Адрес</label>
                        <input class="form-control form-control-sm" id="source-url"
                               name="url" placeholder="http://192.168.1.10:8123" required>
                        <div class="invalid-feedback" id="source-url-error"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="source-token">Токен</label>
                        <input class="form-control form-control-sm" id="source-token"
                               name="token" type="password" placeholder="Долгосрочный токен HA" required>
                        <div class="invalid-feedback" id="source-token-error"></div>
                    </div>
                    <div class="col-12 d-flex align-items-center gap-2">
                        <button type="submit" class="btn btn-primary btn-sm" id="source-submit">
                            <i class="bi bi-check-lg"></i> Создать и выбрать
                        </button>
                        <span id="source-form-status" class="small"></span>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Шаг 2: найденные устройства -->
    <div class="card mb-3" id="devices-section" hidden>
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-search"></i> Шаг 2. Найденные устройства</span>
            <button type="button" class="btn btn-sm btn-outline-primary" id="scan-btn">
                <i class="bi bi-arrow-repeat"></i> Обновить
            </button>
        </div>
        <div class="card-body">
            <div class="row text-center mb-3">
                <div class="col-6 col-md-3">
                    <div class="h4 mb-0" id="total-devices">—</div>
                    <small class="text-muted">Всего</small>
                </div>
                <div class="col-6 col-md-3">
                    <div class="h4 mb-0" id="selected-count">0</div>
                    <small class="text-muted">Выбрано</small>
                </div>
                <div class="col-6 col-md-3">
                    <div class="h4 mb-0" id="room-count">—</div>
                    <small class="text-muted">Комнат</small>
                </div>
                <div class="col-6 col-md-3">
                    <div class="h4 mb-0" id="page-info">—</div>
                    <small class="text-muted">Страница</small>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-lg-3">
                    <div class="btn-group w-100 mb-2" role="group">
                        <button class="btn btn-sm btn-outline-secondary" onclick="selectAll()">Все</button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="deselectAll()">Снять</button>
                    </div>
                    <div class="mb-2">
                        <small class="text-muted">Фильтр по категории</small>
                        <div id="category-filters" class="d-flex flex-wrap gap-1 mt-1"></div>
                    </div>
                    <div class="mb-2">
                        <input type="search" class="form-control form-control-sm" id="search-box"
                               placeholder="Поиск по названию или entity_id">
                    </div>
                    <div>
                        <small class="text-muted">Комната по умолчанию</small>
                        <select class="form-select form-select-sm mt-1" id="default-room"></select>
                    </div>
                </div>

                <div class="col-lg-9">
                    <div id="devices-container" class="empty-state text-muted">
                        <span class="spinner-border spinner-border-sm me-2"></span>Загрузка устройств…
                    </div>
                    <nav aria-label="Страницы устройств">
                        <ul class="pagination pagination-sm justify-content-center mb-0" id="pagination-controls"></ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Шаг 3: применение -->
    <div class="card mb-3" id="apply-section" hidden>
        <div class="card-header"><i class="bi bi-check2-square"></i> Шаг 3. Применение</div>
        <div class="card-body">
            <div id="preview-list" class="small text-muted mb-3">Устройства не выбраны</div>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-outline-primary btn-action" id="dry-run-btn" onclick="dryRun()">
                    <i class="bi bi-clipboard-check"></i> Проверить
                </button>
                <button type="button" class="btn btn-success btn-action" id="apply-btn" onclick="applySelected()">
                    <i class="bi bi-check-lg"></i> Применить
                </button>
            </div>
        </div>
    </div>

    <div id="status-area" class="sticky-bottom" aria-live="polite"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    'use strict';

    // ------------------------------------------------------------------
    // Конфигурация из серверной разметки: идентичность приходит с бэкенда,
    // чтобы запросы интерфейса проходили проверку доступа (FR-009).
    // ------------------------------------------------------------------
    const IDENTITY = {
        userId: document.body.dataset.userId || '',
        isAdmin: document.body.dataset.userIsAdmin === 'true'
    };
    const TEMPLATES = {{ available_templates | tojson }};
    const CATEGORIES = {{ categories | tojson }};

    const API = {
        sources: '/api/v1/devices/sources',
        discoveryData: (id) => `/api/v1/devices/sources/${encodeURIComponent(id)}/discovery-data`,
        apply: '/api/v1/devices/apply',
        rooms: '/api/rooms'
    };

    const PAGE_SIZE = 25;

    const state = {
        sourceId: new URLSearchParams(window.location.search).get('source_id'),
        devices: [],
        rooms: [],
        selected: new Set(),
        page: 1,
        filterCategory: null,
        search: '',
        defaultRoom: '',
        sourceError: null
    };

    // ------------------------------------------------------------------
    // Запросы: идентичность на все обращения к API устройств.
    // Раньше мастер отправлял запросы без заголовков и получал 401.
    // ------------------------------------------------------------------
    const nativeFetch = window.fetch.bind(window);
    window.fetch = (input, init = {}) => {
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        const options = { ...init };
        if (url.startsWith('/api/')) {
            options.headers = {
                'X-User-ID': IDENTITY.userId,
                'X-Is-Admin': String(IDENTITY.isAdmin),
                ...(init.headers || {})
            };
        }
        return nativeFetch(input, options);
    };

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[ch]);
    }

    function showStatus(type, message) {
        const area = document.getElementById('status-area');
        const icon = { success: 'check-circle', error: 'exclamation-octagon', info: 'info-circle' }[type] || 'info-circle';
        area.innerHTML = `<div class="alert alert-${type} py-2 mb-2 d-flex gap-2 align-items-start">
            <i class="bi bi-${icon}"></i><div class="flex-grow-1">${escapeHtml(message)}</div>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>`;
    }

    function withBusy(button, busy, label) {
        button.disabled = busy;
        if (busy) {
            button.dataset.label = button.innerHTML;
            button.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${escapeHtml(label)}`;
        } else if (button.dataset.label) {
            button.innerHTML = button.dataset.label;
        }
    }

    async function apiError(response, fallback) {
        let detail = fallback;
        try {
            const body = await response.json();
            detail = typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail || body);
        } catch (err) {
            /* тело ответа не JSON — оставляем fallback */
        }
        return detail;
    }

    // ------------------------------------------------------------------
    // Шаг 1: источники
    // ------------------------------------------------------------------
    async function loadSources() {
        const container = document.getElementById('sources-list');
        container.innerHTML = '<div class="col-12 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Загрузка…</div>';
        try {
            const response = await fetch(API.sources);
            if (!response.ok) {
                throw new Error(await apiError(response, `HTTP ${response.status}`));
            }
            const sources = await response.json();
            if (!sources.length) {
                container.innerHTML = '<div class="col-12 text-muted">Источников пока нет. Создайте первый — форма выше.</div>';
                return;
            }
            container.innerHTML = sources.map((source) => `
                <div class="col-md-6 col-lg-4">
                    <div class="card source-card ${source.id === state.sourceId ? 'active' : ''}"
                         data-source-id="${escapeHtml(source.id)}">
                        <div class="card-body py-2">
                            <div class="fw-semibold">${escapeHtml(source.name)}</div>
                            <small class="text-muted d-block text-truncate">${escapeHtml(source.url)}</small>
                        </div>
                    </div>
                </div>`).join('');
            container.querySelectorAll('.source-card').forEach((card) => {
                card.addEventListener('click', () => selectSource(card.dataset.sourceId));
            });
        } catch (error) {
            container.innerHTML = `<div class="col-12 text-danger">Не удалось загрузить источники: ${escapeHtml(error.message)}</div>`;
        }
    }

    async function selectSource(sourceId) {
        state.sourceId = sourceId;
        state.selected.clear();
        state.page = 1;
        document.querySelectorAll('.source-card').forEach((card) => {
            card.classList.toggle('active', card.dataset.sourceId === sourceId);
        });
        const url = new URL(window.location.href);
        url.searchParams.set('source_id', sourceId);
        window.history.replaceState({}, '', url);
        document.getElementById('source-info').textContent = `Источник: ${sourceId.slice(0, 8)}…`;
        await Promise.all([loadRooms(), loadDiscoveryData()]);
    }

    function showSourceFormErrors(detail) {
        ['name', 'url', 'token'].forEach((field) => {
            document.getElementById(`source-${field}-error`).textContent = '';
            document.getElementById(`source-${field}`).classList.remove('is-invalid');
        });
        const items = Array.isArray(detail) ? detail : [];
        if (!items.length) {
            document.getElementById('source-form-status').innerHTML =
                `<span class="text-danger">${escapeHtml(Array.isArray(detail) ? 'Проверьте поля' : String(detail))}</span>`;
            return;
        }
        items.forEach((item) => {
            const field = String(item.loc || item.field || '').split('.').pop();
            const input = document.getElementById(`source-${field}`);
            if (!input) return;
            input.classList.add('is-invalid');
            document.getElementById(`source-${field}-error`).textContent = item.msg || 'Некорректное значение';
        });
    }

    document.getElementById('source-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const submit = document.getElementById('source-submit');
        const status = document.getElementById('source-form-status');
        status.textContent = '';
        const payload = {
            name: document.getElementById('source-name').value.trim(),
            url: document.getElementById('source-url').value.trim(),
            token: document.getElementById('source-token').value.trim()
        };
        withBusy(submit, true, 'Создание…');
        try {
            const response = await fetch(API.sources, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                const detail = (await response.json().catch(() => null) || {}).detail;
                showSourceFormErrors(detail ?? `HTTP ${response.status}`);
                return;
            }
            const created = await response.json();
            document.getElementById('source-form').reset();
            await loadSources();
            showStatus('success', `Источник «${created.name}» создан`);
            await selectSource(created.id);
        } catch (error) {
            status.innerHTML = `<span class="text-danger">${escapeHtml(error.message)}</span>`;
        } finally {
            withBusy(submit, false);
        }
    });

    // ------------------------------------------------------------------
    // Шаг 2: устройства источника
    // ------------------------------------------------------------------
    function categoryOf(device) {
        return CATEGORIES[device.device_type] || 'monitoring_only';
    }

    function templateFor(category) {
        return {
            lighting: 'lighting',
            climate_control: 'climate_control',
            ventilation: 'humidity_ventilation',
            cover_control: 'generic_cover',
            switch_control: 'generic_switch'
        }[category] || null;
    }

    async function loadRooms() {
        try {
            const response = await fetch(API.rooms);
            state.rooms = response.ok ? (await response.json()).rooms : [];
        } catch (error) {
            state.rooms = [];
        }
        document.getElementById('room-count').textContent = state.rooms.length;
        const select = document.getElementById('default-room');
        select.innerHTML = '<option value="">— не выбрана —</option>' + state.rooms
            .map((room) => `<option value="${escapeHtml(room.id)}">${escapeHtml(room.name)}</option>`)
            .join('');
        if (!state.defaultRoom && state.rooms.length) {
            state.defaultRoom = state.rooms[0].id;
            select.value = state.defaultRoom;
        }
    }

    async function loadDiscoveryData() {
        if (!state.sourceId) {
            showStatus('info', 'Выберите источник, чтобы увидеть его устройства');
            return;
        }
        const container = document.getElementById('devices-container');
        const scanBtn = document.getElementById('scan-btn');
        document.getElementById('devices-section').hidden = false;
        container.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Опрос источника…';
        withBusy(scanBtn, true, 'Опрос…');
        try {
            const response = await fetch(API.discoveryData(state.sourceId));
            if (!response.ok) {
                throw new Error(await apiError(response, `HTTP ${response.status}`));
            }
            const data = await response.json();
            state.sourceError = data.error || null;
            state.devices = (data.available_devices || []).map((device) => {
                const category = categoryOf(device);
                return {
                    ...device,
                    category,
                    template: templateFor(category)
                };
            });
            state.page = 1;
            render();
            if (state.sourceError) {
                showStatus('error', `Источник недоступен: ${state.sourceError}`);
            } else if (!state.devices.length) {
                showStatus('info', 'Источник не вернул ни одного устройства. Проверьте, что в Home Assistant есть сущности и токен имеет доступ к ним.');
            } else {
                showStatus('success', `Найдено устройств: ${state.devices.length}`);
            }
        } catch (error) {
            state.sourceError = error.message;
            state.devices = [];
            render();
            showStatus('error', `Не удалось получить устройства источника: ${error.message}`);
        } finally {
            withBusy(scanBtn, false);
        }
    }

    function filteredDevices() {
        const search = state.search.trim().toLowerCase();
        return state.devices.filter((device) => {
            if (state.filterCategory && device.category !== state.filterCategory) return false;
            if (!search) return true;
            return `${device.friendly_name} ${device.entity_id}`.toLowerCase().includes(search);
        });
    }

    function render() {
        renderStats();
        renderCategoryFilters();
        renderDevices();
        renderPagination();
        renderPreview();
    }

    function renderStats() {
        document.getElementById('total-devices').textContent = state.devices.length;
        document.getElementById('selected-count').textContent = state.selected.size;
        document.getElementById('page-info').textContent =
            state.devices.length ? `${state.page} / ${Math.max(1, Math.ceil(filteredDevices().length / PAGE_SIZE))}` : '—';
    }

    function renderCategoryFilters() {
        const counts = new Map();
        state.devices.forEach((device) => counts.set(device.category, (counts.get(device.category) || 0) + 1));
        document.getElementById('category-filters').innerHTML =
            `<button class="btn btn-sm filter-btn ${state.filterCategory === null ? 'btn-primary' : 'btn-outline-secondary'}"
                     onclick="setCategory(null)">все</button>` +
            [...counts.entries()]
                .sort((a, b) => b[1] - a[1])
                .map(([category, count]) => `
                    <button class="btn btn-sm filter-btn ${state.filterCategory === category ? 'btn-primary' : 'btn-outline-secondary'}"
                            onclick="setCategory('${escapeHtml(category)}')">${escapeHtml(category)} (${count})</button>`)
                .join('');
    }

    function renderDevices() {
        const container = document.getElementById('devices-container');
        const devices = filteredDevices();
        if (!devices.length) {
            container.innerHTML = `<div class="empty-state text-muted">
                ${state.sourceError ? 'Источник недоступен — устройства не показаны' : 'Ничего не найдено по текущему фильтру'}
            </div>`;
            document.getElementById('pagination-controls').innerHTML = '';
            document.getElementById('apply-section').hidden = true;
            return;
        }
        document.getElementById('apply-section').hidden = false;

        const start = (state.page - 1) * PAGE_SIZE;
        const pageDevices = devices.slice(start, start + PAGE_SIZE);
        const roomOptions = state.rooms
            .map((room) => `<option value="${escapeHtml(room.id)}">${escapeHtml(room.name)}</option>`)
            .join('');

        container.innerHTML = pageDevices.map((device) => {
            const checked = state.selected.has(device.entity_id);
            const preferred = device.area_id || state.defaultRoom;
            return `
            <div class="card device-card ${checked ? 'selected' : ''}" data-entity-id="${escapeHtml(device.entity_id)}">
                <div class="device-header">
                    <input class="form-check-input device-checkbox" type="checkbox" ${checked ? 'checked' : ''}
                           onclick="event.stopPropagation(); toggleDevice('${escapeHtml(device.entity_id)}')">
                    <div class="flex-grow-1">
                        <span class="fw-semibold">${escapeHtml(device.friendly_name)}</span>
                        <span class="badge text-bg-secondary ms-1">${escapeHtml(device.category)}</span>
                        ${device.area_name ? `<span class="badge text-bg-info ms-1">${escapeHtml(device.area_name)}</span>` : ''}
                    </div>
                    <small class="text-muted">${escapeHtml(device.state)}</small>
                </div>
                <div class="device-body">
                    <code class="entity-id text-muted">${escapeHtml(device.entity_id)}</code>
                    <div class="row g-2 mt-1">
                        <div class="col-sm-6">
                            <select class="form-select form-select-sm device-room" data-entity-id="${escapeHtml(device.entity_id)}">
                                <option value="">— комната не выбрана —</option>
                                ${roomOptions}
                            </select>
                        </div>
                        <div class="col-sm-6">
                            <select class="form-select form-select-sm device-template" data-entity-id="${escapeHtml(device.entity_id)}"
                                    ${device.template ? '' : 'disabled'}>
                                <option value="">без автоматики</option>
                                ${TEMPLATES.filter((t) => !device.template || t === device.template)
                                    .map((t) => `<option value="${escapeHtml(t)}" ${t === device.template ? 'selected' : ''}>${escapeHtml(t)}</option>`)
                                    .join('')}
                            </select>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');

        container.querySelectorAll('.device-room').forEach((select) => {
            select.value = preferred;
            select.addEventListener('click', (event) => event.stopPropagation());
            select.addEventListener('change', () => {
                state.defaultRoom = select.value;
                renderPreview();
            });
        });
        container.querySelectorAll('.device-template').forEach((select) => {
            select.addEventListener('click', (event) => event.stopPropagation());
        });
        container.querySelectorAll('.device-card').forEach((card) => {
            card.addEventListener('click', () => toggleDevice(card.dataset.entityId));
        });
    }

    function renderPagination() {
        const pages = Math.ceil(filteredDevices().length / PAGE_SIZE);
        const control = document.getElementById('pagination-controls');
        if (pages <= 1) {
            control.innerHTML = '';
            return;
        }
        control.innerHTML = `
            <li class="page-item ${state.page <= 1 ? 'disabled' : ''}">
                <button class="page-link" onclick="goToPage(${state.page - 1})">←</button>
            </li>
            ${Array.from({ length: pages }, (_, i) => `
                <li class="page-item ${state.page === i + 1 ? 'active' : ''}">
                    <button class="page-link" onclick="goToPage(${i + 1})">${i + 1}</button>
                </li>`).join('')}
            <li class="page-item ${state.page >= pages ? 'disabled' : ''}">
                <button class="page-link" onclick="goToPage(${state.page + 1})">→</button>
            </li>`;
    }

    function setCategory(category) {
        state.filterCategory = category;
        state.page = 1;
        render();
    }

    function goToPage(page) {
        state.page = page;
        renderDevices();
        renderStats();
    }

    function toggleDevice(entityId) {
        if (state.selected.has(entityId)) {
            state.selected.delete(entityId);
        } else {
            state.selected.add(entityId);
        }
        renderStats();
        renderDevices();
        renderPreview();
    }

    function selectAll() {
        filteredDevices().forEach((device) => state.selected.add(device.entity_id));
        render();
    }

    function deselectAll() {
        state.selected.clear();
        render();
    }

    function selectionsPayload() {
        return [...state.selected].map((entityId) => {
            const device = state.devices.find((item) => item.entity_id === entityId);
            const roomSelect = document.querySelector(`.device-room[data-entity-id="${CSS.escape(entityId)}"]`);
            const templateSelect = document.querySelector(`.device-template[data-entity-id="${CSS.escape(entityId)}"]`);
            return {
                device_entity_id: entityId,
                device_type: device?.device_type || null,
                name: device?.friendly_name || entityId,
                target_room: roomSelect?.value || state.defaultRoom || null,
                ha_area_id: device?.area_id || null,
                behavior_template: templateSelect?.value || null
            };
        });
    }

    function renderPreview() {
        const preview = document.getElementById('preview-list');
        if (!state.selected.size) {
            preview.textContent = 'Устройства не выбраны';
            document.getElementById('apply-btn').disabled = true;
            document.getElementById('dry-run-btn').disabled = true;
            return;
        }
        document.getElementById('apply-btn').disabled = false;
        document.getElementById('dry-run-btn').disabled = false;
        preview.innerHTML = `Выбрано устройств: <strong>${state.selected.size}</strong> — они получат
            машину состояния и попадут в общий список сразу после применения.`;
    }

    async function dryRun() {
        if (!state.selected.size || !state.sourceId) return;
        const button = document.getElementById('dry-run-btn');
        withBusy(button, true, 'Проверка…');
        try {
            const response = await fetch(API.apply, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    source_id: state.sourceId,
                    selections: selectionsPayload(),
                    dry_run: true
                })
            });
            if (!response.ok) {
                throw new Error(await apiError(response, `HTTP ${response.status}`));
            }
            const result = await response.json();
            showStatus('info', `Проверка: добавится устройств — ${result.would_add ?? 0}, ошибок — ${result.failed ?? 0}`);
        } catch (error) {
            showStatus('error', `Проверка не удалась: ${error.message}`);
        } finally {
            withBusy(button, false);
        }
    }

    async function applySelected() {
        if (!state.selected.size || !state.sourceId) return;
        const button = document.getElementById('apply-btn');
        const dryRunButton = document.getElementById('dry-run-btn');
        withBusy(button, true, 'Применение…');
        dryRunButton.disabled = true;
        try {
            const response = await fetch(API.apply, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    source_id: state.sourceId,
                    selections: selectionsPayload()
                })
            });
            if (!response.ok) {
                throw new Error(await apiError(response, `HTTP ${response.status}`));
            }
            const result = await response.json();
            const parts = [];
            if (result.devices_added) parts.push(`добавлено: ${result.devices_added}`);
            if (result.devices_updated) parts.push(`обновлено: ${result.devices_updated}`);
            if (result.failed) parts.push(`ошибок: ${result.failed}`);
            const message = parts.length ? parts.join(', ') : 'изменений нет';
            if (result.failed) {
                const reasons = (result.failed_devices || [])
                    .map((item) => `${item.ha_entity_id}: ${item.reason}`).join('; ');
                showStatus('error', `Применено частично (${message}). ${reasons}`);
            } else {
                showStatus('success', `Готово (${message}). Устройства работают без перезапуска.`);
            }
            await Promise.all([loadSources(), loadRooms()]);
            await loadDiscoveryData();
        } catch (error) {
            showStatus('error', `Применение не удалось: ${error.message}`);
        } finally {
            withBusy(button, false);
            renderPreview();
        }
    }

    document.getElementById('search-box').addEventListener('input', (event) => {
        state.search = event.target.value;
        state.page = 1;
        render();
    });

    document.getElementById('scan-btn').addEventListener('click', loadDiscoveryData);

    (async function init() {
        await loadSources();
        if (state.sourceId) {
            await Promise.all([loadRooms(), loadDiscoveryData()]);
        }
    })();
</script>
</body>
</html>
