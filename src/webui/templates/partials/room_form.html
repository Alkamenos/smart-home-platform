<div class="modal-header">
    <h5 class="modal-title">{% if room_index >= 0 %}Edit Room{% else %}Add Room{% endif %}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    {% if room_index >= 0 %}
    <!-- Edit form -->
    <form hx-post="/rooms/{{ room_index }}/update"
          hx-target="#room-{{ room_index }}"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) { new bootstrap.Modal(document.getElementById('editModal')).hide(); }">
        <input type="hidden" name="room_id" value="{{ room_index }}">
        <div class="mb-3">
            <label for="name" class="form-label">Room Name</label>
            <input type="text" class="form-control" id="name" name="name"
                   value="{{ room.name }}" required>
        </div>
        <div class="modal-footer p-0">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
    {% else %}
    <!-- Add form -->
    <form hx-post="/rooms/add"
          hx-target="#rooms-container"
          hx-swap="beforeend"
          hx-on::after-request="if(event.detail.successful) { new bootstrap.Modal(document.getElementById('editModal')).hide(); }">
        <div class="mb-3">
            <label for="room_id" class="form-label">Room ID</label>
            <input type="text" class="form-control" id="room_id" name="room_id"
                   placeholder="e.g., garage" required>
        </div>
        <div class="mb-3">
            <label for="room_name" class="form-label">Room Name</label>
            <input type="text" class="form-control" id="room_name" name="room_name"
                   placeholder="e.g., Garage" required>
        </div>
        <div class="modal-footer p-0">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Add Room</button>
        </div>
    </form>
    {% endif %}
</div>
