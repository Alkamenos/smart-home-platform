<div class="modal-header">
    <h5 class="modal-title">{% if room_index >= 0 %}Edit Room{% else %}Add Room{% endif %}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    <form id="room-form">
        <input type="hidden" name="room_index" value="{{ room_index }}">
        <div class="mb-3">
            <label for="room-name" class="form-label">Room Name</label>
            <input type="text" class="form-control" id="room-name" 
                   value="{{ room.name if room.name else '' }}" required>
        </div>
        <div class="mb-3">
            <label for="room-id" class="form-label">Room ID</label>
            <input type="text" class="form-control" id="room-id" 
                   value="{{ room.id if room.id else '' }}" 
                   placeholder="e.g., living_room" required>
        </div>
        
        <h6>Devices</h6>
        <div id="devices-container">
            {% if room.devices %}
                {% for device in room.devices %}
                <div class="device-form border p-2 mb-2 rounded">
                    <div class="mb-2">
                        <label class="form-label">Device ID</label>
                        <input type="text" class="form-control form-control-sm" 
                               value="{{ device.id }}" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Device Type</label>
                        <select class="form-select form-select-sm">
                            <option value="light_motion" {% if device.type == 'light_motion' %}selected{% endif %}>Light with Motion</option>
                            <option value="light" {% if device.type == 'light' %}selected{% endif %}>Light Only</option>
                            <option value="fan" {% if device.type == 'fan' %}selected{% endif %}>Fan</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Behaviors</label>
                        <div class="behaviors-list">
                            {% for behavior in device.behaviors %}
                            <div class="behavior-item d-flex gap-2 mb-1">
                                <input type="text" class="form-control form-control-sm" 
                                       value="{{ behavior.template }}" placeholder="template">
                                <input type="number" class="form-control form-control-sm" 
                                       value="{{ behavior.priority }}" placeholder="priority" style="width: 80px;">
                                <button type="button" class="btn btn-sm btn-danger">×</button>
                            </div>
                            {% endfor %}
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-primary mt-1">+ Add Behavior</button>
                    </div>
                </div>
                {% endfor %}
            {% endif %}
        </div>
        <button type="button" class="btn btn-sm btn-outline-secondary mt-2">+ Add Device</button>
    </form>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="button" class="btn btn-primary" onclick="saveRoom()">Save Changes</button>
</div>
