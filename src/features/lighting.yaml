# Конфигурация FSM для умной лампочки (lighting) - АБСТРАКТНЫЙ ШАБЛОН
#
# Этот файл определяет шаблон поведения для освещения по движению.
# Он НЕ содержит хардкода entity_id - вместо этого параметры передаются через манифест.
#
# ОЖИДАЕМЫЕ ПАРАМЕТРЫ В params (из манифеста):
#   - motion_sensor: str - ID датчика движения (например, "binary_sensor.kitchen_motion")
#   - motion_timeout_sec: float - Таймаут отсутствия движения для выключения света
#   - schedule: str - Расписание активности (например, "07:00-23:00")
#   - brightness: int (опционально) - Яркость света (по умолчанию 255)
#   - brightness_pct: int (опционально) - Яркость включения в процентах; сильнее
#     brightness, если заданы оба
#   - color_temp_kelvin: int (опционально) - Цветовая температура включения, К;
#     сильнее rgb_color, если заданы оба. Задавать яркость и цвет явно —
#     требование владельца 2026-10-13: иначе лампа вспоминает прошлые настройки
#     (включалась красным после ночника).
#
# ПРИМЕР ИСПОЛЬЗОВАНИЯ В manifest.yaml:
#   devices:
#     - type: light_motion
#       id: light.kitchen
#       behaviors:
#         - template: lighting
#           priority: 10
#           params:
#             motion_sensor: binary_sensor.kitchen_motion
#             motion_timeout_sec: 300
#             schedule: "07:00-23:00"
#             brightness: 255
#
# СОСТОЯНИЯ:
#   - OFF: Свет выключен
#   - ON_MOTION: Горит, есть свежее движение
#   - ON_HOLD: Горит, движения нет, ждём `motion_timeout_sec`
#   - ON_MANUAL: Горит по решению человека
#
# МОДИФИКАТОР «МЫ СПИМ» (automation_rules.lighting.sleep_modifier в манифесте):
#   - включение сущности шлёт событие sleep_started — свет гаснет во всех
#     состояниях, включая ручное (входит в SAFETY_EVENTS, обход локаута);
#   - пока модификатор включён, guard may_turn_on не даёт включать яркий свет
#     ни в одной комнате — ночной свет сбивает циркадные ритмы;
#   - ночью (окно тишины) при ИЗВЕСТНОМ модификаторе решает только он: False —
#     включение по движению разрешено (если темно), True — запрещено. Окно
#     тишины остаётся фолбэком, только когда сущности в доме нет. Решение
#     владельца 2026-10-09: «свет по движению всегда, кроме периода мы спим».
#
# ПРИМЕЧАНИЕ: entity_id будет переопределен фабрикой на основе device_id и priority

initial_state: "OFF"
debounce_sec: 0.5

states:
  - "OFF"
  - "ON_MOTION"
  - "ON_HOLD"
  - "ON_MANUAL"

transitions:
  # Из OFF можно перейти в ON_MOTION при обнаружении движения днем
  # Guard is_day_time проверяет, что сейчас день (для дневного режима освещения)
  # Если guard не указан, переход возможен всегда
  - from_state: "OFF"
    to_state: "ON_MOTION"
    trigger: "motion_detected"
    # Условие ночного окна: в тихие часы движение не включает свет нигде, кроме
    # комнат из `night_motion_rooms` (санузел, кухня, коридор). Значения приходят
    # из `automation_rules.lighting`, часовой пояс — из `automation_rules`.
    guard: "may_turn_on"
    action: "turn_on_light"

  # Из OFF можно перейти в ON_MANUAL при ручном включении
  - from_state: "OFF"
    to_state: "ON_MANUAL"
    trigger: "manual_switch_on"
    action: "turn_on_light"

  # Удержание: после движения свет горит `motion_timeout_sec`, и каждое новое
  # движение продлевает горение.
  #
  # Раньше снятие движения выключало свет сразу, а таймер стоял 30 секунд: человек
  # вставал с дивана — и свет гас, хотя в комнате ещё кто-то есть. Требование
  # владельца — «не выключать, если движение было недавно».
  - from_state: "ON_MOTION"
    to_state: "ON_HOLD"
    trigger: "motion_cleared"
    action: null
    timeout_sec: 600.0

  # Новое движение возвращает горение в режим движения и перевзводит таймер
  - from_state: "ON_HOLD"
    to_state: "ON_MOTION"
    trigger: "motion_detected"
    action: null
    timeout_sec: 600.0

  # Удержание истекло — выключаем
  - from_state: "ON_HOLD"
    to_state: "OFF"
    trigger: "timeout"
    action: "turn_off_light"
    timeout_sec: 600.0

  # Повторное «движение снято» в состоянии ожидания: таймер продлевается, свет
  # остаётся гореть, и событие не кончается отказом
  - from_state: "ON_HOLD"
    to_state: "ON_HOLD"
    trigger: "motion_cleared"
    action: null
    timeout_sec: 600.0

  # Из ON_MOTION можно перейти в OFF по таймауту (если движение не возобновилось
  # и состояние ожидания не успел отработать)
  - from_state: "ON_MOTION"
    to_state: "OFF"
    trigger: "timeout"
    action: "turn_off_light"
    timeout_sec: 600.0

  # Суточный цикл платформы: в назначенный час свет гаснет сам, независимо от
  # датчиков. В доме четыре комнаты без датчиков движения — там автоматика по
  # движению не работает вовсе, и часы остаются единственным способом не
  # оставить свет гореть всю ночь.
  #
  # Переход разрешён и из состояния ожидания: человек ушёл, свет держится на
  # удержании — значит в час X гасить надо и его.
  - from_state: "ON_MOTION"
    to_state: "OFF"
    trigger: "quiet_hours_started"
    action: "turn_off_light"

  - from_state: "ON_HOLD"
    to_state: "OFF"
    trigger: "quiet_hours_started"
    action: "turn_off_light"

  # Свет горит, а автомат считает его выключенным: человек включил выключателем,
  # и движения не было — состояние автомата о том, что горит, не знает. Без этого
  # перехода расписание в час X молча ничего не делало, и свет оставался гореть
  # до утра: проверено в боре 2026-10-09 на уличном освещении.
  #
  # Переход в то же состояние — нормально: здесь важен не смена состояния, а
  # команда. Если свет уже выключен, команда уйдёт вхолостую и ничего не сломает.
  - from_state: "OFF"
    to_state: "OFF"
    trigger: "quiet_hours_started"
    action: "turn_off_light"

  # Утренний сброс ночного режима: отдельное действие не нужно, свет уже
  # выключен предыдущим переходом. Переход существует, чтобы утреннее событие
  # не превращалось в отказ «нет такого перехода» у каждого автомата света.
  - from_state: "OFF"
    to_state: "OFF"
    trigger: "day_started"
    action: null

  # Модификатор «мы спим» включился (сущность Home Assistant, которую владелец
  # переключает сам): свет гаснет немедленно, во всех состояниях. Требование
  # владельца 2026-10-09: «свет над столом выключается по модификатору мы спим».
  #
  # Событие приходит от адаптера (переключение сущности в HA), не от часов,
  # и входит в SAFETY_EVENTS: выключить свет важнее локаута ручного действия —
  # иначе свет, включённый из приложения час назад, продолжал бы гореть,
  # пока все спят.
  - from_state: "ON_MOTION"
    to_state: "OFF"
    trigger: "sleep_started"
    action: "turn_off_light"

  - from_state: "ON_HOLD"
    to_state: "OFF"
    trigger: "sleep_started"
    action: "turn_off_light"

  - from_state: "ON_MANUAL"
    to_state: "OFF"
    trigger: "sleep_started"
    action: "turn_off_light"

  # Свет горит, а автомат считает его выключенным (включили выключателем или
  # включил другой шаблон): гасим и здесь — иначе включённый при засыпании свет
  # остался бы гореть, потому что автомат «и так выключен».
  - from_state: "OFF"
    to_state: "OFF"
    trigger: "sleep_started"
    action: "turn_off_light"

  # Из ON_MOTION — ручное состояние
  - from_state: "ON_MOTION"
    to_state: "ON_MANUAL"
    trigger: "manual_override"
    guard: "is_manual_override_enabled"  # Функция в Registry

  # Из ON_MOTION можно перейти в ON_MANUAL при ручном вмешательстве
  - from_state: "ON_HOLD"
    to_state: "ON_MANUAL"
    trigger: "manual_override"
    guard: "is_manual_override_enabled"  # Функция в Registry

  - from_state: "ON_HOLD"
    to_state: "OFF"
    trigger: "manual_switch_off"
    action: "turn_off_light"

  # Ручное выключение **из ON_MOTION** — тот же случай, что из ON_HOLD: человек
  # погасил свет, пока шло удержание по движению, и решение автомата становится
  # «выключено» (следующее движение снова зажжёт). Без этого перехода событие
  # человека отвергалось как «нет такого перехода»: автомат продолжал считать
  # свет горящим, хотя его погасили (боевой случай 2026-10-14, фонари сада:
  # владелец выключил, а в журнале остался отказ).
  - from_state: "ON_MOTION"
    to_state: "OFF"
    trigger: "manual_switch_off"
    action: "turn_off_light"

  # Человек включил свет, пока автомат считал его горящим (прибор при этом
  # молчал или был погашен другим путём): решение уже «гори», и команда не
  # нужна — переход только фиксирует вмешательство, а не спорит с ним.
  - from_state: "ON_MOTION"
    to_state: "ON_MOTION"
    trigger: "manual_switch_on"
    action: null

  - from_state: "ON_HOLD"
    to_state: "ON_HOLD"
    trigger: "manual_switch_on"
    action: null

  # Из ON_MANUAL можно перейти в OFF при ручном выключении
  - from_state: "ON_MANUAL"
    to_state: "OFF"
    trigger: "manual_switch_off"
    action: "turn_off_light"

  # Из ON_MANUAL возврат к автоматике по таймауту оверрайда (60 минут —
  # стандартный срок ручного приоритета, automation_rules.*.manual_lockout_min).
  #
  # Здесь возврат к автоматике для основного света означает «выключено»: сейчас
  # автоматика его не включает, и выключенное состояние — тоже её решение.
  # Раньше стояло 300 с (5 минут): ручное включение гасло слишком быстро, а
  # главное — срок не совпадал со стандартным оверрайдом 60 минут (требование
  # владельца 2026-10-14, BACKLOG B57).
  #
  # Смена правил не должна превращаться в команду «выключить» (концепция,
  # .ai/02_ARCHITECTURE.md §7): когда автоматика научится держать свет дольше,
  # изменится именно решение, а не появится приказ гасить.
  - from_state: "ON_MANUAL"
    to_state: "OFF"
    trigger: "timeout"
    action: "turn_off_light"
    timeout_sec: 3600.0

  # --- Прибор разошёлся с решением: решение повторяется (B64) ---
  #
  # Сторож читает фактическое состояние прибора и, если оно противоречит
  # решению, шлёт `device_state_diverged`. Автомат повторяет **своё** решение,
  # а не получает приказ: свет, который решено держать включённым, включается
  # снова; погашенный — гасится снова. Команда проходит общий путь (посредник,
  # блокировка человека), поэтому ручного владельца такой повтор не задевает:
  # при действующем оверрайде расхождение и не считается отказом.
  - from_state: "OFF"
    to_state: "OFF"
    trigger: "device_state_diverged"
    action: "turn_off_light"

  - from_state: "ON_MOTION"
    to_state: "ON_MOTION"
    trigger: "device_state_diverged"
    action: "turn_on_light"

  - from_state: "ON_HOLD"
    to_state: "ON_HOLD"
    trigger: "device_state_diverged"
    action: "turn_on_light"

  - from_state: "ON_MANUAL"
    to_state: "ON_MANUAL"
    trigger: "device_state_diverged"
    action: "turn_on_light"
