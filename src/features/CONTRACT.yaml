# Контракт шаблонов поведения
#
# Файл сгенерирован: правьте шаблоны и реестр, затем перегенерируйте, иначе
# tests/contract/test_template_contract.py упадёт. Разделы `gaps` заполняются
# руками — они не выводятся из кода.
#
# Зачем он нужен: платформа публикует события датчиков, но из них шаблоны
# слушают единицы, а триггеры шаблонов порождаются ещё реже. По этой таблице
# веб-интерфейс должен строить форму поведения из того, что платформа правда
# выполнит, и не предлагать пользователю недостижимого.

sensor_events:
  motion: [motion_detected, motion_cleared]
  temperature: [temperature_changed]
  humidity: [humidity_changed]
  lux: [brightness_changed]
  contact: [opened, closed]

engine_events:
  # События, которые порождает сам движок, а не внешний источник.
  timeout: таймер взводится по исходящим переходам состояния с триггером timeout.

registered_actions:  # реестр после register_all_actions
  - ac_cool_on
  - ac_dry_on
  - ac_forced_off
  - ac_off
  - ac_set_mode
  - airing_after_timeout
  - airing_off
  - climate_cool
  - climate_heat
  - climate_off
  - exhaust_after_timeout
  - exhaust_off
  - exhaust_on
  - fan_airing_on
  - fan_apply_mode_and_speed
  - fan_set_percentage
  - fan_set_preset
  - fan_turn_off
  - fan_turn_on
  - heater_emergency_off
  - heater_off
  - heater_on
  - heater_timer_on
  - release_device
  - turn_off_light
  - turn_off_night_light
  - turn_on_light
  - turn_on_night_light

registered_guards:  # реестр после register_all_guards
  - at_or_above_setpoint
  - below_setpoint
  - climate_is_enabled
  - exhaust_should_stop
  - has_usable_reading
  - humidity_above_60
  - humidity_below_60
  - is_day_time
  - is_manual_override_enabled
  - managed_by_hardware_ok
  - may_cool
  - may_dry
  - may_heat
  - may_stay_idle
  - may_stop_heating
  - may_turn_on
  - mode_for_weather
  - modifier_is_on
  - owner_wants_airing
  - sensor_is_alive
  - should_run_exhaust
  - speed_within_limits
  - stops_on_sleep
  - stops_on_sunrise
  - ventilation_should_stop

uncovered_platform_events:
  # События, которые платформа публикует, но ни один шаблон не слушает.
  - brightness_changed
  - closed
  - opened

templates:
  climate_control:
    reachable: true
    in_manifest: []
    actions: [heater_timer_on, heater_off, heater_emergency_off, ac_cool_on, ac_dry_on, ac_off]
    guards: [may_heat, may_stop_heating, may_cool, may_dry, may_stay_idle]
    triggers:
      temperature_changed: sensor
      timeout: engine
      humidity_changed: sensor
    unproduced_triggers: []
    gaps:
      - Условие «греть» составное (may_heat), потому что движок допускает на переход ровно одно имя guard'а: перечислить проверки по отдельности шаблон не может, и менять это — значит менять структуру FSMDefinition (конституция I — только по явному согласованию).
      - Целевая температура берётся из automation_rules.climate.setpoint_entity, а не из параметра target_temp шаблона: уставку ведёт Home Assistant, и вторая копия числа разошлась бы с первой (FR-001 спеки 011).
    params:
      target_temp:
        type: float
        range: "5-35"
        effective: true
        note: "Целевая температура в градусах. Уходит в команду climate.set_temperature кондиционера (action_handlers.py:ac_cool_on); для обогрева цель берётся из automation_rules.climate, а не отсюда."
      hysteresis:
        type: float
        range: "0-5"
        effective: true
        note: "Ширина мёртвой зоны обогревателя, °C. Читает условие may_heat (guards/builtin.py:_hysteresis_value); по умолчанию 0.5."
      run_minutes:
        type: float
        range: "1-43200"
        effective: true
        note: "На сколько минут включается обогреватель через его таймер. Читает действие heater_timer_on; по умолчанию 15 минут. Верхняя граница 43200 — это предел устройства `number.*_countdown`, проверено в доме 2026-10-10; ставить больше суток бессмысленно, но ограничивать сильнее нельзя: локарь-обогреватель на две смены нужен."
      heater_timer:
        type: str
        range: "entity_id"
        effective: true
        note: "Сущность таймера обогревателя (number.*_countdown). Читает heater_timer_on; без неё обогреватель включается напрямую, и защиты от перегрева при отказе датчика нет."
      managed_by_hardware:
        type: bool
        range: "true/false"
        effective: true
        note: "В комнате стоит штатный термостат; платформа обогревателем здесь не управляет (guards/builtin.py:make_may_heat)."
  deco_light:
    reachable: true
    in_manifest: []
    actions: [turn_on_light, turn_off_light]
    guards: [is_manual_override_enabled, stops_on_sleep]
    triggers:
      sunset_started: НЕТ ПРОИСХОДИТЕЛЯ
      sleep_started: НЕТ ПРОИСХОДИТЕЛЯ
      sunrise_started: НЕТ ПРОИСХОДИТЕЛЯ
      day_started: НЕТ ПРОИСХОДИТЕЛЯ
    unproduced_triggers: [sunset_started, sleep_started, sunrise_started, day_started]
    gaps:
      - События заката и рассвета порождает адаптер по состоянию sun.sun, а не роутер: солнце не входит в манифест и в подписку, поэтому в карте SENSOR_EVENT_MAP его нет. Шаблон слушает то, чего роутер не публикует, и это нормально ровно до тех пор, пока события доставляет контейнер.
      - Включение по датчику освещённости не сделано: датчик сломан и ждёт замены (B31). Солнце уходит, а в доме ещё светло — при замене датчика для вечернего света это разные триггеры, и подменять один другим нельзя.
    params:
      off_by:
        type: str
        range: "sleep|sunrise"
        effective: true
        note: "Разводит только выключение по модификатору «мы спим». `sleep` — гаснет и по отбою, и по рассвету (гирлянда на террасе); `sunrise` — живёт до рассвета и отбоем не гасится (ночное освещение). По рассвету гаснут оба: среди бела дня декоративный свет не нужен (журнал 2026-10-10: гирлянда горела весь день, потому что рассвет для off_by=sleep был отказом guard_failed). Читает условие stops_on_sleep."
  generic_cover:
    reachable: false
    in_manifest: []
    actions: [start_opening, confirm_open, start_closing, confirm_closed, stop_cover, record_manual_override, close_cover]
    guards: []
    triggers:
      open: НЕТ ПРОИСХОДИТЕЛЯ
      fully_opened: НЕТ ПРОИСХОДИТЕЛЯ
      close: НЕТ ПРОИСХОДИТЕЛЯ
      fully_closed: НЕТ ПРОИСХОДИТЕЛЯ
      stop: НЕТ ПРОИСХОДИТЕЛЯ
      manual_change: НЕТ ПРОИСХОДИТЕЛЯ
      timeout: engine
    unproduced_triggers: [open, fully_opened, close, fully_closed, stop, manual_change]
    gaps:
      - Ни одного из семи действий в реестре нет — шаблон неисполним целиком. Вне объёма варианта (a).
  generic_switch:
    reachable: false
    in_manifest: []
    actions: [turn_on_switch, turn_off_switch, record_manual_override]
    guards: []
    triggers:
      turn_on: НЕТ ПРОИСХОДИТЕЛЯ
      turn_off: НЕТ ПРОИСХОДИТЕЛЯ
      manual_change: НЕТ ПРОИСХОДИТЕЛЯ
      timeout: engine
    unproduced_triggers: [turn_on, turn_off, manual_change]
    gaps:
      - Все три действия в реестре отсутствуют — шаблон неисполним целиком. Вне объёма варианта (a).
  humidity_ventilation:
    reachable: true
    in_manifest: [bathroom]
    actions: [fan_turn_on, fan_turn_off]
    guards: [humidity_above_60, humidity_below_60]
    triggers:
      humidity_changed: sensor
    unproduced_triggers: []
    gaps:
      - Имя guard'а содержит 60, хотя значение порога берётся из параметра поведения humidity_threshold. Расхождение осталось только в имени: на решение оно не влияет (движок кладёт параметры поведения в контекст условия), но читающий контракт видит «60» и считает порог зашитым.
    params:
      humidity_threshold:
        type: float
        range: "0-100"
        effective: true
        note: "Порог включения вентиляции; читается guard'ом — единственный параметр этого шаблона с силой."
  lighting:
    reachable: true
    in_manifest: [kitchen, living_room, bedroom, bathroom]
    actions: [turn_on_light, turn_off_light]
    guards: [may_turn_on, is_manual_override_enabled]
    triggers:
      motion_detected: sensor
      manual_switch_on: НЕТ ПРОИСХОДИТЕЛЯ
      motion_cleared: sensor
      timeout: engine
      quiet_hours_started: НЕТ ПРОИСХОДИТЕЛЯ
      day_started: НЕТ ПРОИСХОДИТЕЛЯ
      sleep_started: НЕТ ПРОИСХОДИТЕЛЯ
      manual_override: НЕТ ПРОИСХОДИТЕЛЯ
      manual_switch_off: НЕТ ПРОИСХОДИТЕЛЯ
    unproduced_triggers: [manual_switch_on, quiet_hours_started, day_started, sleep_started, manual_override, manual_switch_off]
    gaps:
      - motion_cleared публикуется платформой, но перехода по нему нет — движение кончилось, свет горит до таймаута. Это сценарий «свет с задержкой», а не дефект; отдельная задача на выбор поведения.
      - manual_switch_on и manual_switch_off нигде не порождаются. Ручной путь управления устройством в платформе отсутствует как класс (пункт 3 веб-плана), поэтому и manual_override не имеет источника.
    params:
      brightness:
        type: int
        range: "0-255"
        effective: true
        note: "Яркость включения; уходит в команду HA."
      motion_timeout_sec:
        type: int
        range: "30-3600"
        effective: true
        note: "Задержка выключения. Переопределяет timeout_sec только у переходов с триггером timeout (factory.py:_timeout_from_params); у остальных переходов timeout_sec — верхняя граница ожидания, и подменять её неверно."
  night_light:
    reachable: true
    in_manifest: [kitchen, living_room, bedroom, bathroom]
    actions: [turn_on_night_light, turn_off_night_light]
    guards: [modifier_is_on]
    triggers:
      motion_detected: sensor
      timeout: engine
      manual_switch_off: НЕТ ПРОИСХОДИТЕЛЯ
      day_started: НЕТ ПРОИСХОДИТЕЛЯ
    unproduced_triggers: [manual_switch_off, day_started]
    gaps:
      - schedule_end не порождается — расписание не выключает ночной свет.
      - У состояния ON_NIGHT нет guard'а на ночь, поэтому оно достижимо и днём через motion_detected.
    params:
      brightness:
        type: int
        range: "0-255"
        effective: true
        note: "Ночная яркость; уходит в команду HA."
      schedule:
        type: str
        range: "ЧЧ:ММ-ЧЧ:ММ"
        effective: true
        note: "Окно ночного режима. Сейчас ИНЕРТЕН: читается только валидатором."
  smart_lock:
    reachable: false
    in_manifest: []
    actions: [start_unlock, confirm_unlock, start_lock, confirm_lock, alert_jam, emergency_unlock]
    guards: []
    triggers:
      unlock: НЕТ ПРОИСХОДИТЕЛЯ
      unlocked: НЕТ ПРОИСХОДИТЕЛЯ
      timeout: engine
      lock: НЕТ ПРОИСХОДИТЕЛЯ
      locked: НЕТ ПРОИСХОДИТЕЛЯ
      jam_detected: НЕТ ПРОИСХОДИТЕЛЯ
      jam_cleared: НЕТ ПРОИСХОДИТЕЛЯ
      emergency_unlock: НЕТ ПРОИСХОДИТЕЛЯ
    unproduced_triggers: [unlock, unlocked, lock, locked, jam_detected, jam_cleared, emergency_unlock]
    gaps:
      - Ни одного из шести действий в реестре нет — шаблон неисполним целиком. Для замков осознанно не сделано: удалённой отпирающей команде не доверяем.
  speed_control:
    reachable: false
    in_manifest: []
    actions: [set_low_speed, set_medium_speed, set_high_speed, turn_off_fan, record_manual_override]
    guards: []
    triggers:
      turn_on: НЕТ ПРОИСХОДИТЕЛЯ
      increase_speed: НЕТ ПРОИСХОДИТЕЛЯ
      decrease_speed: НЕТ ПРОИСХОДИТЕЛЯ
      turn_off: НЕТ ПРОИСХОДИТЕЛЯ
      manual_change: НЕТ ПРОИСХОДИТЕЛЯ
      timeout: engine
    unproduced_triggers: [turn_on, increase_speed, decrease_speed, turn_off, manual_change]
    gaps:
      - Ни одного из пяти действий в реестре нет — шаблон неисполним целиком. Вне объёма варианта (a).
  ventilation_modes:
    reachable: true
    in_manifest: []
    actions: [fan_airing_on, exhaust_on, fan_apply_mode_and_speed, fan_set_percentage, fan_turn_off, airing_after_timeout, airing_off, exhaust_after_timeout, exhaust_off]
    guards: [owner_wants_airing, should_run_exhaust, mode_for_weather, speed_within_limits, ventilation_should_stop, exhaust_should_stop]
    triggers:
      temperature_changed: sensor
      humidity_changed: sensor
      timeout: engine
    unproduced_triggers: []
    gaps:
      - Один шаблон обслуживает и рекуператор, и вытяжку: роль устройства задаётся параметром ventilation_role. Разделить их отдельными шаблонами значило бы дублировать условие остановки и таймеры; движок допускает на переход ровно одно имя guard'а (конституция I).
      - Ночью ограничивается скорость (speed_night_max), а не режим: отдельного ночного режима нет, и параметры mode_night/mode_exhaust из data-model.md §5 удалены как не имеющие силы (вытяжка — отдельный прибор без режимов).
    params:
      ventilation_role:
        type: str
        range: "supply|exhaust"
        effective: true
        note: "Роль устройства: supply — рекуператор (режим и скорость), exhaust — вытяжка санузла (только вкл/выкл). Читают все условия вентиляции; без неё вытяжка выбирала бы режим, которого у неё нет. По умолчанию supply."
      mode_supply:
        type: str
        range: "из списка устройства"
        effective: true
        note: "Режим притока — быстрое охлаждение свежим воздухом. Читает mode_for_weather, когда комната теплее улицы не меньше supply_delta_threshold (research.md D18)."
      mode_summer:
        type: str
        range: "из списка устройства"
        effective: true
        note: "Режим рекуперации, когда модификатор «зима» снят."
      mode_winter:
        type: str
        range: "из списка устройства"
        effective: true
        note: "Режим рекуперации, когда модификатор «зима» включён (is_winter)."
      mode_airing:
        type: str
        range: "из списка устройства"
        effective: true
        note: "Режим проветривания (Приток MAX). MAX-режимы форсируют скорость 100 сами, поэтому отдельной команды скорости нет (research.md D15)."
      winter_mode_threshold:
        type: float
        range: "0-30"
        effective: true
        note: "Запасной порог зимы, °C: применяется, пока модификатор «зима» ещё не прочитан. По умолчанию 5.0."
      supply_delta_threshold:
        type: float
        range: "0-30"
        effective: true
        note: "Разница «комната − улица», °C, с которой рекуперация переключается на приток. По умолчанию 5.0 (research.md D18)."
      speed_normal:
        type: int
        range: "0-100"
        effective: true
        note: "Обычная скорость. Прибор квантует к списку [14, 29, 43, 57, 71, 86, 100] (research.md D15). По умолчанию 30."
      speed_delta_gain:
        type: float
        range: "0-20"
        effective: true
        note: "Добавка скорости на градус разницы температур. По умолчанию 5.0."
      speed_night_max:
        type: int
        range: "0-100"
        effective: true
        note: "Ночной потолок скорости, только понижает (FR-022, T088). По умолчанию 20."
      delta_deadband:
        type: float
        range: "0-2"
        effective: true
        note: "Мёртвая зона разницы температур, °C: колебания меньше не двигают скорость (FR-030). По умолчанию 0.3."
      airing_seconds:
        type: float
        range: "60-86400"
        effective: true
        note: "Длительность проветривания, с; переопределяет timeout_sec перехода AIRING (FR-025). По умолчанию 3600."
      exhaust_seconds:
        type: float
        range: "60-86400"
        effective: true
        note: "Длительность вытяжки по модификатору, с; переопределяет timeout_sec перехода EXHAUST (T085). По умолчанию 3600."
      exhaust_temp_threshold:
        type: float
        range: "0-50"
        effective: true
        note: "Порог температуры санузла, °C, при котором включается вытяжка (T086). По умолчанию 25.0."
      exhaust_humidity_threshold:
        type: float
        range: "0-100"
        effective: true
        note: "Порог влажности санузла, %, при котором включается вытяжка (T086). По умолчанию 65.0."
