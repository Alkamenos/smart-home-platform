# Конфигурация FSM для ночного освещения (night_light) - АБСТРАКТНЫЙ ШАБЛОН
#
# Ночник: пока включён модификатор «мы спим» (сущность Home Assistant из
# automation_rules.lighting.sleep_modifier, которую владелец переключает сам),
# свет по движению включается на 3% яркости чистым красным (255, 0, 0) и
# гаснет через 5 минут без движения.
#
# Требование владельца (2026-10-09): «после того как модификатор мы спим
# включился, свет над столом начинает работать в режиме ночника, яркость 3% и
# свет красный при движении, а выключается через 5 мин при отсутствии
# движения». Красный выбран потому, что не содержит голубой части спектра,
# которая будит, — яркий свет ночью сбивает циркадные ритмы.
#
# Раньше шаблон был иным, и три вещи в нём не работали:
#   - движение ночью не проверяло модификатор вообще — ночник включался и
#     днём (теперь guard modifier_is_on);
#   - таймаут стоял 60 секунд и заканчивался действием release_device, которое
#     только отпускает устройство, но не выключает свет — ночник оставался
#     гореть (теперь 300 секунд и turn_off_night_light);
#   - повторное движение не продлевало горение.
#
# ОЖИДАЕМЫЕ ПАРАМЕТРЫ В params (из манифеста, все необязательные):
#   - brightness_pct: int - Яркость в процентах (по умолчанию 3)
#   - rgb_color: [int, int, int] - Цвет (по умолчанию [255, 0, 0])
#   - brightness: int - Прежняя шкала 0-255, уважается, если задана
#
# СОСТОЯНИЯ:
#   - OFF: Ночник выключен
#   - ON_NIGHT: Ночник включён (3% красным)
#
# ПРИМЕЧАНИЕ: entity_id будет переопределен фабрикой на основе device_id и priority
# ПРИОРИТЕТ: Рекомендуется использовать priority=20 или выше для ночника,
#            чтобы он имел приоритет над обычным освещением по движению (priority=10)

initial_state: "OFF"
debounce_sec: 0.5

states:
  - "OFF"
  - "ON_NIGHT"
  - "ON_MANUAL"

transitions:
  # Движение, пока «мы спим» — включаем ночник. Guard читает состояние
  # модификатора из контекста события (sleep_modifier_on); если сущности в доме
  # нет или её состояние не прочитано, переход не проходит — слепой ночной
  # свет хуже отсутствия ночника (отказ называется guard_data_missing).
  - from_state: "OFF"
    to_state: "ON_NIGHT"
    trigger: "motion_detected"
    guard: "modifier_is_on"
    action: "turn_on_night_light"

  # Повторное движение продлевает горение и возвращает цвет: без этого перехода
  # событие «движение снято/есть» в ночнике заканчивалось отказом «нет
  # перехода», а свет гас посреди нахождения человека в комнате.
  - from_state: "ON_NIGHT"
    to_state: "ON_NIGHT"
    trigger: "motion_detected"
    action: "turn_on_night_light"
    timeout_sec: 300.0

  # Пять минут без движения — ночник гаснет (требование владельца: «выключается
  # через 5 мин при отсутствии движения»). Действие именно выключение, а не
  # освобождение устройства: release_device отпускает захват и оставляет свет
  # гореть — прежний шаблон гас не так.
  - from_state: "ON_NIGHT"
    to_state: "OFF"
    trigger: "timeout"
    action: "turn_off_night_light"
    timeout_sec: 300.0

  # Человек выключил свет сам — гасим и отпускаем состояние.
  - from_state: "ON_NIGHT"
    to_state: "OFF"
    trigger: "manual_switch_off"
    action: "turn_off_night_light"

  # Утро: модификатор выключили, а ночник ещё горит (двигался до утра) — гасим.
  # Событие приходит из суточного цикла платформы (morning_at манифеста).
  - from_state: "ON_NIGHT"
    to_state: "OFF"
    trigger: "day_started"
    action: "turn_off_night_light"

  # Утреннее событие для выключенного ночника: без этого перехода утро
  # превращалось у каждого автомата света в отказ «нет такого перехода».
  - from_state: "OFF"
    to_state: "OFF"
    trigger: "day_started"
    action: null

  # --- Ручное состояние: возврат к автоматике через срок оверрайда (B57) ---
  #
  # Ночник, включённый человеком, — ручное состояние: через 60 минут автомат
  # возвращается к автоматике (ночью — снова ночной режим, днём — выключено),
  # а не получает приказ «выключить». Концепция — .ai/02_ARCHITECTURE.md §7.
  - from_state: "OFF"
    to_state: "ON_MANUAL"
    trigger: "manual_switch_on"
    guard: "is_manual_override_enabled"
    action: "turn_on_night_light"

  # Новое ручное действие перезапускает срок: считаем от более позднего события.
  - from_state: "ON_MANUAL"
    to_state: "ON_MANUAL"
    trigger: "manual_switch_on"
    action: null

  - from_state: "ON_MANUAL"
    to_state: "ON_MANUAL"
    trigger: "manual_switch_off"
    action: null

  # Возврат к автоматике: ночью — ночной режим, днём — выключено.
  - from_state: "ON_MANUAL"
    to_state: "ON_NIGHT"
    trigger: "timeout"
    guard: "is_night_time"
    action: "turn_on_night_light"
    timeout_sec: 3600.0

  - from_state: "ON_MANUAL"
    to_state: "OFF"
    trigger: "timeout"
    action: "turn_off_night_light"
    timeout_sec: 3600.0

  - from_state: "ON_MANUAL"
    to_state: "OFF"
    trigger: "sunrise_started"
    action: "turn_off_night_light"

  - from_state: "ON_MANUAL"
    to_state: "OFF"
    trigger: "day_started"
    action: "turn_off_night_light"

  # --- Прибор разошёлся с решением: решение повторяется (B64) ---
  #
  # Сторож шлёт `device_state_diverged`, когда фактическое состояние прибора
  # противоречит решению. Ночник повторяет своё решение: включённый по решению —
  # включается снова, погашенный — гасится снова. Команда идёт общим путём
  # (посредник и блокировка человека), поэтому ручного владельца не задевает.
  - from_state: "OFF"
    to_state: "OFF"
    trigger: "device_state_diverged"
    action: "turn_off_night_light"

  - from_state: "ON_NIGHT"
    to_state: "ON_NIGHT"
    trigger: "device_state_diverged"
    action: "turn_on_night_light"

  - from_state: "ON_MANUAL"
    to_state: "ON_MANUAL"
    trigger: "device_state_diverged"
    action: "turn_on_night_light"
