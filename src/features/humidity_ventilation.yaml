# Humidity Ventilation Behavior Template
# Автоматическое управление вентиляцией на основе влажности

fsm:
  initial_state: "idle"
  states:
    - idle
    - ventilating
  
  transitions:
    # Включение вентиляции при высокой влажности
    - from: "idle"
      to: "ventilating"
      trigger: "humidity_high"
      condition: "humidity > 60"
      action: "fan.turn_on"
      
    # Выключение вентиляции при нормальной влажности
    - from: "ventilating"
      to: "idle"
      trigger: "humidity_normal"
      condition: "humidity <= 60"
      action: "fan.turn_off"

  events:
    humidity_high:
      description: "Влажность превысила пороговое значение (60%)"
      entity_id: "sensor.humidity"
      above: 60
      
    humidity_normal:
      description: "Влажность вернулась к нормальному уровню"
      entity_id: "sensor.humidity"
      below: 60

  actions:
    fan.turn_on:
      service: "fan.turn_on"
      target:
        entity_id: "fan.bathroom_ventilation"
        
    fan.turn_off:
      service: "fan.turn_off"
      target:
        entity_id: "fan.bathroom_ventilation"

metadata:
  version: "1.0"
  description: "Шаблон управления вентиляцией по влажности"
  author: "Smart Home System"
