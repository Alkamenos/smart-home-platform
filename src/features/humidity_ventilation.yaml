# Humidity Ventilation Behavior Template
# Автоматическое управление вентиляцией на основе влажности

initial_state: "idle"
debounce_sec: 0.5

states:
  - idle
  - ventilating

transitions:
  # Включение вентиляции при высокой влажности
  - from_state: "idle"
    to_state: "ventilating"
    trigger: "humidity_high"
    guard: "humidity_above_60"
    action: "fan_turn_on"

  # Выключение вентиляции при нормальной влажности
  - from_state: "ventilating"
    to_state: "idle"
    trigger: "humidity_normal"
    guard: "humidity_below_60"
    action: "fan_turn_off"
