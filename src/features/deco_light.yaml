# Вечерний (декоративный) свет — АБСТРАКТНЫЙ ШАБЛОН
#
# Для света, который должен гореть вечером, а не «когда мимо кто-то прошёл»:
# гирлянда на террасе, ночное освещение. Требования владельца 2026-10-09:
#
#   - **Гирлянда на террасе**: включается по закату (или по датчику освещённости,
#     когда он появится) и выключается, когда владелец включил «мы спим».
#   - **Ночное освещение**: включается по закату и горит до рассвета.
#
# Обе разновидности — один шаблон с параметром `off_by`:
#
#   - `off_by: "sleep"`   — гаснуть по модификатору «мы спим» (гирлянда);
#   - `off_by: "sunrise"` — гаснуть по рассвету (ночное освещение).
#
# Разделение не декоративное: гирлянда, доживающая до утра в пустом дворе, ни
# кому не нужна, а ночное освещение, гаснущее вместе с «мы спим», оставит
# участок без света на рассвете — как раз тогда, когда оно ещё нужно.
#
# Датчика движения шаблон не слушает **намеренно**. Раньше гирлянда была
# описана обычным освещением (`lighting`), и это выглядело исправно: она
# включалась при проходе по террасе и гасла через 10 минут удержания
# (`motion_timeout_sec`). Декоративный свет так себя не ведёт — и это был
# боевой дефект, вскрытый владельцем в тот же вечер.
#
# ПРИМЕР ИСПОЛЬЗОВАНИЯ в manifest.yaml:
#   - id: terassa
#     name: Терраса
#     sensors: {}
#     devices:
#       - id: light.girlianda_terassa
#         type: light
#         name: Гирлянда на террасе
#         behaviors:
#           - template: deco_light
#             priority: 10
#             params: {off_by: "sleep"}
#
# СОСТОЯНИЯ:
#   - OFF: Вечерний свет выключен
#   - ON_DECO: Горит до своего часа выключения
#
# СОБЫТИЯ (все порождаются платформой):
#   - sunset_started  — солнце ушло за горизонт (адаптер → контейнер → доставка,
#                       как и sleep_started);
#   - sunrise_started — солнце взошло;
#   - sleep_started   — владелец включил модификатор «мы спим».
#
# ПРИМЕЧАНИЕ: entity_id будет переопределен фабрикой на основе device_id и priority

initial_state: "OFF"
# Дебаунс длинный: события приходят по одному на закате, а не потоком, и
# ждать полсекунды ради одиночного события незачем. Общий дебаунс шаблона нужен
# и для повторного события того же триггера.
debounce_sec: 0.5

states:
  - "OFF"
  - "ON_DECO"
  - "ON_MANUAL"

transitions:
  # Закат — вечерний свет включается.
  #
  # Условия нет: решение принимает сам факт захода солнца, и «а может, ещё не
  # совсем темно» здесь неуместно — владелец попросил включать по закату, а
  # датчик освещённости, когда его починят, добавит проверку своим триггером.
  - from_state: "OFF"
    to_state: "ON_DECO"
    trigger: "sunset_started"
    # Локаут ручного действия обязателен именно здесь: вечерний свет сверяется
    # каждые 15 минут (страховка от потерянного заката), и без этой проверки
    # сверка через 15 минут включила бы обратно гирлянду, которую владелец
    # выключил руками час назад — тихо и назло.
    guard: "is_manual_override_enabled"
    action: "turn_on_light"

  # Повторный закат при уже горящем свете: без этого перехода событие стало бы
  # отказом «нет такого перехода» в журнале, то есть шумом без последствий.
  - from_state: "ON_DECO"
    to_state: "ON_DECO"
    trigger: "sunset_started"
    action: null

  # Выключение по модификатору «мы спим» — только для `off_by: "sleep"`.
  #
  # Входит в SAFETY_EVENTS: свет, включённый вручную из приложения, должен
  # погаснуть вместе со всеми, пока все спят.
  - from_state: "ON_DECO"
    to_state: "OFF"
    trigger: "sleep_started"
    guard: "stops_on_sleep"
    action: "turn_off_light"

  # Выключение по рассвету — для обоих вариантов.
  #
  # Рассвет означает «светло», а декоративный свет среди бела дня не нужен ни
  # гирлянде, ни ночному освещению. Раньше переход был закрыт условием
  # `stops_on_sunrise`, то есть работал только для `off_by: "sunrise"`: гирлянда
  # на рассвете получала отказ `guard_failed`, и сверка вечернего света
  # повторяла его каждые 15 минут, не сходясь никогда (журнал боевого запуска
  # 2026-10-10, 04:27 — 06:42). Итог — гирлянда горела весь день.
  #
  # Теперь `off_by` разводит только выключение по «мы спим»: гирлянда гаснет и
  # по отбою, и по рассвету; ночное освещение живёт до рассвета и отбоем не
  # гасится.
  - from_state: "ON_DECO"
    to_state: "OFF"
    trigger: "sunrise_started"
    action: "turn_off_light"

  # Утреннее событие платформы (morning_at манифеста) гасит вечерний свет
  # независимо от рассвета: рассвет по солнцу может не наступить вовсе (погода),
  # а к утру свет гореть не должен. Сработает для обеих разновидностей.
  - from_state: "ON_DECO"
    to_state: "OFF"
    trigger: "day_started"
    action: "turn_off_light"

  # События, не меняющие состояния, — чтобы они не превращались в отказ.
  #
  # Исключение — выключение: у светящего декоративного света автомат может
  # считать себя выключенным (владелец включил гирлянду руками, а решение
  # пришло не от платформы). Тогда переход в то же состояние без действия
  # оставил бы свет гореть до утра — ровно тот дефект, ради которого шаблон и
  # писался. Поэтому здесь действие настоящее, а не пустое.
  - from_state: "OFF"
    to_state: "OFF"
    trigger: "sleep_started"
    guard: "stops_on_sleep"
    action: "turn_off_light"

  # Свет уже выключен по мнению автомата, но горит по-настоящему (владелец
  # включил его сам, либо включил другой шаблон). На рассвете такое тоже гасится:
  # рассвет означает «светло», и оставлять декоративный свет гореть до следующего
  # перезапуска платформы неправильно. Раньше здесь стоял `stops_on_sunrise`,
  # и для гирлянды (`off_by: "sleep"`) переход превращался в отказ `guard_failed`.
  - from_state: "OFF"
    to_state: "OFF"
    trigger: "sunrise_started"
    action: "turn_off_light"

  # Утреннее событие для уже выключенного вечернего света: действие
  # пустое — свет и так не горит, а отказ «нет такого перехода» в журнале
  # был бы шумом.
  - from_state: "OFF"
    to_state: "OFF"
    trigger: "day_started"
    action: null

  # --- Ручное состояние: возврат к автоматике через срок оверрайда (B57) ---
  #
  # Человек включил или выключил свет сам (событие приходит из Home Assistant,
  # когда состояние меняет пользователь). Автомат запоминает это как ручное
  # состояние и через 60 минут **возвращается к автоматике** — пересчитывает
  # решение, а не получает команду «выключить»: ночью это «горит» (ON_DECO),
  # днём — «выключено», потому что днём декоративный свет автоматика не держит.
  # Концепция — .ai/02_ARCHITECTURE.md §7.
  - from_state: "OFF"
    to_state: "ON_MANUAL"
    trigger: "manual_switch_on"
    guard: "is_manual_override_enabled"
    action: "turn_on_light"

  - from_state: "ON_DECO"
    to_state: "ON_MANUAL"
    trigger: "manual_switch_off"
    action: null

  # Новое ручное действие перезапускает срок: считаем от более позднего события.
  - from_state: "ON_MANUAL"
    to_state: "ON_MANUAL"
    trigger: "manual_switch_on"
    action: null

  - from_state: "ON_MANUAL"
    to_state: "ON_MANUAL"
    trigger: "manual_switch_off"
    action: null

  # Возврат к автоматике: ночью — снова горит, днём — выключено.
  - from_state: "ON_MANUAL"
    to_state: "ON_DECO"
    trigger: "timeout"
    guard: "is_night_time"
    action: "turn_on_light"
    timeout_sec: 3600.0

  - from_state: "ON_MANUAL"
    to_state: "OFF"
    trigger: "timeout"
    action: "turn_off_light"
    timeout_sec: 3600.0

  # Автоматика сильнее по своим событиям: рассвет и утро гасят свет.
  - from_state: "ON_MANUAL"
    to_state: "OFF"
    trigger: "sunrise_started"
    action: "turn_off_light"

  - from_state: "ON_MANUAL"
    to_state: "OFF"
    trigger: "day_started"
    action: "turn_off_light"

  # Гирлянда гаснет вместе со «мы спим» (`off_by: sleep`); ночное освещение —
  # нет, поэтому переход под условием.
  - from_state: "ON_MANUAL"
    to_state: "OFF"
    trigger: "sleep_started"
    guard: "stops_on_sleep"
    action: "turn_off_light"
