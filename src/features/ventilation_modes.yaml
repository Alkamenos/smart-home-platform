# Вентиляция дома: рекуператоры по погоде, проветривание и вытяжка — АБСТРАКТНЫЙ ШАБЛОН
#
# Один шаблон обслуживает два рода устройств, и роль задаётся параметром
# `ventilation_role`:
#   - `supply` — рекуператор (Vakio Base Smart): две независимые оси — режим
#     выбирается из списка устройства, скорость задаётся отдельно (research.md
#     D7, D15; живые замеры 2026-10-12);
#   - `exhaust` — вытяжка санузла: прибор без скорости, только вкл/выкл
#     (FR-026, FR-028).
# Без роли вытяжка «выбирала бы режим», которого у неё нет, а рекуператор
# пытался бы работать вытяжкой.
#
# УТОЧНЕНИЯ ВЛАДЕЛЬЦА (research.md D22, 2026-10-12), по которым переписан шаблон:
#   - вентиляция стоит, когда `ventiliatsiia` = false, фиче-флаг выключен или
#     температура комнаты ниже уставки `input_number.temperatura` (причина
#     `room_below_setpoint`); отдельного правила по обогреву больше нет — его
#     заменяет уставка (FR-049, FR-055);
#   - обычный режим — по модификатору «зима»: «Рекуперация (зима)» /
#     «Рекуперация (лето)» (FR-050);
#   - жарко (комната выше потолка комфорта `maksimalno_komfortnaia_temperatura`)
#     — «Приток MAX» на `airing_seconds`, затем возврат к обычному режиму
#     (FR-051);
#   - скорость падает при понижении температуры улицы, не ниже `speed_min`;
#     ночью при нормальной температуре — минимум (FR-052, FR-053);
#   - проветривание и вытяжка — модификаторы с автосбросом в `false` по таймеру
#     60 минут (T085): сначала возвращается обычный режим, затем снимается флаг;
#   - вытяжка включается по высокой температуре И/ИЛИ влажности санузла (T086).
#
# ОЖИДАЕМЫЕ ПАРАМЕТРЫ в params (из манифеста), диапазоны — data-model.md §5:
#   - ventilation_role: str = "supply" — роль устройства: supply | exhaust
#   - mode_summer: str = «Рекуперация (лето)» — модификатор «зима» снят
#   - mode_winter: str = «Рекуперация (зима)» — модификатор «зима» включён
#   - mode_airing: str = «Приток MAX» — максимальный приток при жаре и
#     проветривании (скорость не задаётся: MAX-режимы форсируют 100 сами, D15)
#   - winter_mode_threshold: float = 5.0 — запасной порог зимы, °C, когда
#     модификатор «зима» ещё не прочитан
#   - speed_normal: int = 42 — обычная скорость; прибор квантует к
#     [14, 29, 43, 57, 71, 86, 100] и округляет запрос ВВЕРХ, поэтому 42 даёт
#     ступень 43 %, а 43 — уже 57 % (research.md D24)
#   - speed_min: int = 14 — минимальная скорость: нижняя граница и ночная
#   - speed_cold_reference: float = 5.0 — температура улицы, °C, ниже которой
#     скорость падает
#   - speed_cold_gain: float = 2.0 — снижение скорости на градус улицы ниже
#     опорной, %/°C
#   - airing_seconds: float = 3600 — длительность проветривания и «Притока MAX»
#     при жаре, с (FR-025, FR-051)
#   - exhaust_seconds: float = 3600 — длительность вытяжки по модификатору, с
#   - exhaust_temp_threshold: float = 25.0 — порог температуры санузла, °C (T086)
#   - exhaust_humidity_threshold: float = 65.0 — порог влажности санузла, % (T086)
#
# ПРИМЕР ИСПОЛЬЗОВАНИЯ в manifest.yaml:
#   rooms:
#     - id: kabinet
#       devices:
#         - id: fan.base_smart
#           type: fan
#           behaviors:
#             - template: ventilation_modes
#               priority: 10
#               params:
#                 ventilation_role: supply
#                 mode_winter: "Рекуперация (зима)"
#                 speed_normal: 42
#                 speed_min: 14
#                 speed_cold_reference: 5.0
#                 speed_cold_gain: 2.0
#                 airing_seconds: 1800
#         - id: fan.vytyazhka_sanuzel
#           type: fan
#           behaviors:
#             - template: ventilation_modes
#               priority: 10
#               params:
#                 ventilation_role: exhaust
#                 exhaust_temp_threshold: 25.0
#
# СОСТОЯНИЯ:
#   - IDLE: прибор стоит — выключен владельцем, комната холоднее уставки или
#     данных нет
#   - SUPPLY: обычная вентиляция — режим по модификатору «зима», скорость по
#     температуре улицы и времени суток
#   - AIRING: максимальный приток — жара выше потолка комфорта или модификатор
#     владельца; само гаснет по таймеру
#   - EXHAUST: вытяжка санузла — по модификатору либо по температуре/влажности
#
# ТРИГГЕРЫ: `temperature_changed` (режим, скорость, температура санузла),
# `humidity_changed` (влажность санузла), `settings_changed` (выключатель
# владельца, фиче-флаг, сезон, модификаторы), `timeout` (самоотключение
# модификаторов и «Притока MAX»). Событие, которого никто не публикует, дало бы
# молчащую автоматику (урок humidity_ventilation, Known Issue #67): события
# датчиков порождает EventRouter (SENSOR_EVENT_MAP), а `settings_changed` —
# `EventRouter.route_settings_change`.
#
# ПОЧЕМУ ПЕРЕХОДОВ БОЛЬШЕ, ЧЕМ СОСТОЯНИЙ: пересчёт скорости — переход в то же
# состояние SUPPLY; выход из EXHAUST по температуре и по влажности — разные
# триггеры одного решения.

initial_state: "IDLE"

states:
  - "IDLE"
  - "SUPPLY"
  - "AIRING"
  - "EXHAUST"

transitions:
  # Проветривание: попросил человек (input_boolean.provetrivanie = on).
  # Ставится ПЕРВЫМ из группы IDLE: обычный режим (ниже) не должен перехватить
  # показание раньше, иначе проветривание не включалось бы вовсе. Скорость не
  # задаётся: «Приток MAX» форсирует 100 сам (D15).
  - from_state: "IDLE"
    to_state: "AIRING"
    trigger: "temperature_changed"
    guard: "owner_wants_airing"
    action: "fan_airing_on"

  # Жарко в комнате (выше потолка комфорта): максимальный приток с таймером,
  # затем возврат к обычному режиму (FR-051). Стоит после проветривания и ПЕРЕД
  # обычным режимом: жара сильнее сезонной рекуперации.
  - from_state: "IDLE"
    to_state: "AIRING"
    trigger: "temperature_changed"
    guard: "should_run_max_supply"
    action: "fan_airing_on"

  # Вытяжка санузла: по модификатору владельца ИЛИ по температуре/влажности
  # санузла (T086). Триггеры температуры и влажности — оба ведут к одному
  # решению (конституция I: у перехода одно условие, но не один триггер).
  - from_state: "IDLE"
    to_state: "EXHAUST"
    trigger: "temperature_changed"
    guard: "should_run_exhaust"
    action: "exhaust_on"
  - from_state: "IDLE"
    to_state: "EXHAUST"
    trigger: "humidity_changed"
    guard: "should_run_exhaust"
    action: "exhaust_on"

  # Обычная вентиляция: режим по модификатору «зима», скорость по температуре
  # улицы и времени суток. Обе команды уходят порядком «режим, затем скорость»
  # (fan_apply_mode_and_speed): прибор принимает скорость только уже включённым
  # (D15).
  - from_state: "IDLE"
    to_state: "SUPPLY"
    trigger: "temperature_changed"
    guard: "mode_for_weather"
    action: "fan_apply_mode_and_speed"

  # Смена глобального переключателя (выключатель владельца, фиче-флаг дома,
  # сезон, модификаторы проветривания/вытяжки) — тот же разбор, что и на
  # показании датчика, но повод другой: решение владельца не должно ждать
  # датчика, который может молчать часами (боевой разбор 2026-10-12). Порядок
  # внутри группы — как у `temperature_changed`: проветривание, вытяжка,
  # обычный режим.
  - from_state: "IDLE"
    to_state: "AIRING"
    trigger: "settings_changed"
    guard: "owner_wants_airing"
    action: "fan_airing_on"
  - from_state: "IDLE"
    to_state: "AIRING"
    trigger: "settings_changed"
    guard: "should_run_max_supply"
    action: "fan_airing_on"
  - from_state: "IDLE"
    to_state: "EXHAUST"
    trigger: "settings_changed"
    guard: "should_run_exhaust"
    action: "exhaust_on"
  - from_state: "IDLE"
    to_state: "SUPPLY"
    trigger: "settings_changed"
    guard: "mode_for_weather"
    action: "fan_apply_mode_and_speed"

  # Проветривание из обычного режима: владелец включил модификатор.
  - from_state: "SUPPLY"
    to_state: "AIRING"
    trigger: "temperature_changed"
    guard: "owner_wants_airing"
    action: "fan_airing_on"

  # Жарко: перейти на «Приток MAX» с таймером (FR-051).
  - from_state: "SUPPLY"
    to_state: "AIRING"
    trigger: "temperature_changed"
    guard: "should_run_max_supply"
    action: "fan_airing_on"

  # Пересчёт скорости на новом показании — переход в то же состояние. Режим
  # здесь НЕ трогается: он меняется по модификатору «зима», а не на каждое
  # показание (D7), иначе смена режима на каждом опросе выглядела бы как
  # поломка. Границы скорости и ночной минимум — внутри speed_within_limits.
  - from_state: "SUPPLY"
    to_state: "SUPPLY"
    trigger: "temperature_changed"
    guard: "speed_within_limits"
    action: "fan_set_percentage"

  # Вентиляции работать нельзя (фиче-флаг, выключатель владельца, комната
  # холоднее уставки) — погасить прибор (FR-027, FR-049). Стоит ПОСЛЕ пересчёта
  # скорости: пока работа разрешена, пересчёт перехватывает показание сам.
  - from_state: "SUPPLY"
    to_state: "IDLE"
    trigger: "temperature_changed"
    guard: "ventilation_should_stop"
    action: "fan_turn_off"

  # Пересмотр по решению владельца: погасить, начать проветривание или
  # пересобрать режим и скорость. Режим пересобирается здесь, а не на каждом
  # показании датчика: смена сезона обязана сменить приток на рекуперацию (и
  # обратно), а на каждое показание это выглядело бы щелчком режима (D7).
  - from_state: "SUPPLY"
    to_state: "AIRING"
    trigger: "settings_changed"
    guard: "owner_wants_airing"
    action: "fan_airing_on"
  - from_state: "SUPPLY"
    to_state: "AIRING"
    trigger: "settings_changed"
    guard: "should_run_max_supply"
    action: "fan_airing_on"
  - from_state: "SUPPLY"
    to_state: "SUPPLY"
    trigger: "settings_changed"
    guard: "mode_for_weather"
    action: "fan_apply_mode_and_speed"
  - from_state: "SUPPLY"
    to_state: "IDLE"
    trigger: "settings_changed"
    guard: "ventilation_should_stop"
    action: "fan_turn_off"

  # Проветривание закончилось по таймеру: вернуть обычный режим и снять
  # модификатор владельца (T085). Условие пересчитало режим и скорость здесь же,
  # поэтому действие берёт готовые значения, а не накопленные (иначе после
  # проветривания осталось бы «Приток MAX»).
  - from_state: "AIRING"
    to_state: "SUPPLY"
    trigger: "timeout"
    guard: "mode_for_weather"
    action: "airing_after_timeout"
    # Значение по умолчанию; манифест переопределяет через airing_seconds
    # (factory: _timeout_from_params).
    timeout_sec: 3600.0

  # Обычный режим вернуть нельзя (нет улицы, комната холоднее уставки, выключил
  # владелец) — погасить прибор и снять модификатор, иначе проветривание
  # продлилось бы само на следующем показании датчика. Переход без условия:
  # он запасной и вступает только когда предыдущий отказал.
  - from_state: "AIRING"
    to_state: "IDLE"
    trigger: "timeout"
    action: "airing_off"
    timeout_sec: 3600.0

  # Жарко и уже в «Притоке MAX» — подтвердить режим прибору. Перехода из AIRING
  # в AIRING не было, и команда не уходила: прибор оставался на прежнем режиме —
  # в бою 2026-10-13 «Рекуперация (зима)» на ночном минимуме 14 %, хотя в комнате
  # 27 °C, а автомат считал себя в максимальном притоке. Стоит ДО остановки: пока
  # жарко, режим подтверждается, а не гасится.
  - from_state: "AIRING"
    to_state: "AIRING"
    trigger: "temperature_changed"
    guard: "should_run_max_supply"
    action: "fan_airing_on"
  - from_state: "AIRING"
    to_state: "AIRING"
    trigger: "settings_changed"
    guard: "should_run_max_supply"
    action: "fan_airing_on"

  # Во время проветривания владелец выключил вентиляцию или комната остыла ниже
  # уставки — погасить, не дожидаясь таймера.
  - from_state: "AIRING"
    to_state: "IDLE"
    trigger: "temperature_changed"
    guard: "ventilation_should_stop"
    action: "airing_off"
  - from_state: "AIRING"
    to_state: "IDLE"
    trigger: "settings_changed"
    guard: "ventilation_should_stop"
    action: "airing_off"

  # Вытяжка кончилась по таймеру (модификатор): погасить прибор и снять
  # модификатор (T085). Если вытяжку держит сам санузел, следующее событие
  # датчика включит её снова.
  - from_state: "EXHAUST"
    to_state: "IDLE"
    trigger: "timeout"
    action: "exhaust_after_timeout"
    # Значение по умолчанию; манифест переопределяет через exhaust_seconds
    # (factory: _TIMEOUT_OVERRIDE_KEYS).
    timeout_sec: 3600.0

  # Вытяжка больше не нужна: модификатор снят и санузел в норме (T086), либо
  # вентиляции работать нельзя.
  - from_state: "EXHAUST"
    to_state: "IDLE"
    trigger: "temperature_changed"
    guard: "exhaust_should_stop"
    action: "exhaust_off"
  - from_state: "EXHAUST"
    to_state: "IDLE"
    trigger: "humidity_changed"
    guard: "exhaust_should_stop"
    action: "exhaust_off"
  - from_state: "EXHAUST"
    to_state: "IDLE"
    trigger: "settings_changed"
    guard: "exhaust_should_stop"
    action: "exhaust_off"
