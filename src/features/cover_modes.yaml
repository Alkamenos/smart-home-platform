# Шторы дома: открыть или закрыть по флагам дома — АБСТРАКТНЫЙ ШАБЛОН (спека 015)
#
# Логика владельца (2026-10-12/13):
#   - обычная ситуация (`my_doma` = true): шторы закрыты, когда «мы спим», и
#     открыты, когда нет — но только если владелец разрешил закрывать ночью
#     (`input_boolean.zakryvat_shtory_nochiu`); без разрешения ночью не закрывают;
#   - штора над дверью (параметр `cover_role: door`) не закрывается, пока в доме
#     кто-нибудь есть: пожарная безопасность, закрытая штора мешает выходу;
#   - дома никого (`my_doma` = false и `sobaki_doma` = false) — закрываются все
#     шторы, включая штору над дверью;
#   - дома только собаки (`my_doma` = false, `sobaki_doma` = true) — закрываются
#     только спальня и кабинет (параметр `closes_when_dogs_only: true`);
#   - аварийный флаг (`input_boolean.covers_emergency_open`) — шторы открываются,
#     игнорируя все остальные правила (даже выключенный фиче-флаг дома);
#   - `my_doma` = false отменяет логику «мы спим».
#
# ОЖИДАЕМЫЕ ПАРАМЕТРЫ в params (из манифеста):
#   - cover_role: str = "regular" — "regular" | "door" (дверь: пожарная
#     безопасность)
#   - closes_when_dogs_only: bool = false — закрывать, когда дома только собаки
#     (спальня, кабинет)
#
# Флаги дома приходят в контекст из Home Assistant (GLOBAL_ENTITY_FIELDS):
#   my_doma, sobaki_doma, covers_close_night, cover_emergency, covers_enabled —
#   и общий sleep_modifier_on («мы спим»). Их смену доносит
#   EventRouter.route_settings_change событием `settings_changed`: автомат штор
#   датчиков не слушает вовсе, поэтому без этого события решение не принималось
#   бы до смены флага, которого может не быть часами.
#
# СОСТОЯНИЯ: OPEN (штора открыта) и CLOSED (закрыта). Позицию прибора платформа
# не отслеживает: она просит открыть или закрыть, а движение делает прибор.
#
# ПОЧЕМУ ОДИН ТРИГГЕР: решение шторы зависит только от флагов дома, а не от
# датчиков и не от часов — платформа часов не считает, «ночь» задаёт модификатор
# «мы спим». Поэтому единственный повод пересмотреть решение — смена флагов.

initial_state: "OPEN"
debounce_sec: 0.5

states:
  - "OPEN"
  - "CLOSED"

transitions:
  # Аварийный случай и обычное «закрываться не нужно» — одна ветка на открытие.
  - from_state: "CLOSED"
    to_state: "OPEN"
    trigger: "settings_changed"
    guard: "covers_should_open"
    action: "cover_open"

  - from_state: "OPEN"
    to_state: "CLOSED"
    trigger: "settings_changed"
    guard: "covers_should_close"
    action: "cover_close"
