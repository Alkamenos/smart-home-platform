# Шторы дома: открыть или закрыть по флагам дома — АБСТРАКТНЫЙ ШАБЛОН (спека 015)
#
# Логика владельца (2026-10-12/13):
#   - обычная ситуация (`my_doma` = true): шторы закрыты, когда «мы спим», и
#     открыты, когда нет — но только если владелец разрешил закрывать ночью
#     (`input_boolean.zakryvat_shtory_nochiu`); без разрешения ночью не закрывают;
#   - штора над дверью (параметр `cover_role: door`) не закрывается, пока в доме
#     кто-нибудь есть: пожарная безопасность, закрытая штора мешает выходу;
#   - дома никого (`my_doma` = false и `sobaki_doma` = false) — закрываются все
#     шторы, включая штору над дверью;
#   - дома только собаки (`my_doma` = false, `sobaki_doma` = true) — закрываются
#     только спальня и кабинет (параметр `closes_when_dogs_only: true`);
#   - аварийный флаг (`input_boolean.covers_emergency_open`) — шторы открываются,
#     игнорируя все остальные правила (даже выключенный фиче-флаг дома);
#   - `my_doma` = false отменяет логику «мы спим».
#
# ОЖИДАЕМЫЕ ПАРАМЕТРЫ в params (из манифеста):
#   - cover_role: str = "regular" — "regular" | "door" (дверь: пожарная
#     безопасность)
#   - closes_when_dogs_only: bool = false — закрывать, когда дома только собаки
#     (спальня, кабинет)
#
# Флаги дома приходят в контекст из Home Assistant (GLOBAL_ENTITY_FIELDS):
#   my_doma, sobaki_doma, covers_close_night, cover_emergency, covers_enabled —
#   и общий sleep_modifier_on («мы спим»). Их смену доносит
#   EventRouter.route_settings_change событием `settings_changed`: автомат штор
#   датчиков не слушает вовсе, поэтому без этого события решение не принималось
#   бы до смены флага, которого может не быть часами.
#
# СОСТОЯНИЯ: OPEN, CLOSED и MANUAL. Позицию прибор отдаёт (`current_position`),
# сторож читает её и движение (`opening`/`closing`). Ручное движение переводит
# автомат в MANUAL: штора стоит там, где её оставил человек, пока не сменится
# флаг дома (my_doma, собаки, сон, ночное закрытие, авария, фича). Команда
# по-прежнему «открыть»/«закрыть»: мотор сам доедет до края.
#
# ПОЧЕМУ ОДИН ТРИГГЕР: решение шторы зависит только от флагов дома, а не от
# датчиков и не от часов — платформа часов не считает, «ночь» задаёт модификатор
# «мы спим». Поэтому единственный повод пересмотреть решение — смена флагов.

initial_state: "OPEN"
debounce_sec: 0.5

states:
  - "OPEN"
  - "CLOSED"
  - "MANUAL"

transitions:
  # Аварийный случай и обычное «закрываться не нужно» — одна ветка на открытие.
  - from_state: "CLOSED"
    to_state: "OPEN"
    trigger: "settings_changed"
    guard: "covers_should_open"
    action: "cover_open"

  - from_state: "OPEN"
    to_state: "CLOSED"
    trigger: "settings_changed"
    guard: "covers_should_close"
    action: "cover_close"

  # --- Штора закрыта, а автомат считает её открытой: модель уступает прибору (B89) ---
  #
  # Штору мог закрыть кто-то вне платформы — человек выключателем или автоматизация
  # Home Assistant. Ручное действие опознаётся по `user_id`, а у этих источников
  # пользователя нет: платформа изменения не замечает и продолжает считать штору
  # открытой (боевой разбор 2026-10-17 — штора спальни стояла в расхождении
  # «автомат OPEN, прибор closed»). Сторож сообщает факт «прибор не работает»
  # одноразовым признаком `_device_is_off`, и автомат говорит правду: штора
  # закрыта. Дальше решение принимается обычным путём — на смену флагов дома
  # (`settings_changed`) автомат откроет её снова, если так велят правила.
  #
  # Переход стоит **до** повтора решения: у одной пары (состояние, событие)
  # побеждает первое условие, которое прошло.
  - from_state: "OPEN"
    to_state: "CLOSED"
    trigger: "device_state_diverged"
    guard: "device_is_off"
    action: null

  # --- Обратная правда: штора открыта, а автомат считает её закрытой (B104) ---
  #
  # Человек открыл штору пультом, а решение — «закрыть». Повторять «закрыть»
  # нельзя: это спор с человеком. Сторож сообщает факт `_device_is_on`, и
  # модель принимает OPEN. Переход стоит до повтора решения по той же причине,
  # что и предыдущий.
  - from_state: "CLOSED"
    to_state: "OPEN"
    trigger: "device_state_diverged"
    guard: "device_is_on"
    action: null

  # --- Ручное движение: штора стоит там, где её оставил человек (B104) ---
  #
  # Человек двинул штору из приложения или пульта. Уходим в MANUAL: решение
  # автоматики здесь не действует, пока не сменится флаг дома. Часовой локкаут
  # для штор больше не нужен — состояние хранит выбор человека явно.
  - from_state: "OPEN"
    to_state: "MANUAL"
    trigger: "manual_switch_on"
    action: null

  - from_state: "OPEN"
    to_state: "MANUAL"
    trigger: "manual_switch_off"
    action: null

  - from_state: "CLOSED"
    to_state: "MANUAL"
    trigger: "manual_switch_on"
    action: null

  - from_state: "CLOSED"
    to_state: "MANUAL"
    trigger: "manual_switch_off"
    action: null

  # Новое ручное движение в MANUAL перезапускает удержание и запоминает
  # актуальные флаги дома: отсчёт «до следующей смены» идёт от него.
  - from_state: "MANUAL"
    to_state: "MANUAL"
    trigger: "manual_switch_on"
    action: null

  - from_state: "MANUAL"
    to_state: "MANUAL"
    trigger: "manual_switch_off"
    action: null

  # Сменился флаг дома — автоматика снова решает. Условия сами проверяют, что
  # флаги действительно изменились: иначе обычная смена температуры двигала бы
  # штору (B104).
  - from_state: "MANUAL"
    to_state: "OPEN"
    trigger: "settings_changed"
    guard: "covers_should_open"
    action: "cover_open"

  - from_state: "MANUAL"
    to_state: "CLOSED"
    trigger: "settings_changed"
    guard: "covers_should_close"
    action: "cover_close"

  # Флаги сменились, но решения «открыть/закрыть» нет (фича выключена, штора
  # над дверью при людях и т.п.) — остаёмся в ручном положении.
  - from_state: "MANUAL"
    to_state: "MANUAL"
    trigger: "settings_changed"
    action: null

  # Сторож в MANUAL не сверяет решение (его нет), но событие не должно быть
  # отказом `no_transition`.
  - from_state: "MANUAL"
    to_state: "MANUAL"
    trigger: "device_state_diverged"
    action: null

  # --- Прибор разошёлся с решением: решение повторяется (B64) ---
  #
  # Сторож шлёт `device_state_diverged`, когда положение прибора противоречит
  # решению автомата (штора закрыта, а решение — открыть). Автомат повторяет
  # своё решение: открытая по решению открывается снова, закрытая — закрывается.
  # Команда идёт общим путём (посредник и блокировка человека), поэтому штору,
  # которую человек только что тронул, повтор не тронет.
  - from_state: "OPEN"
    to_state: "OPEN"
    trigger: "device_state_diverged"
    action: "cover_open"

  - from_state: "CLOSED"
    to_state: "CLOSED"
    trigger: "device_state_diverged"
    action: "cover_close"
