# Климат комнаты: обогрев по датчику температуры — АБСТРАКТНЫЙ ШАБЛОН
#
# Шаблон описывает, как комната держит заданную температуру. Источник цели —
# Home Assistant: `automation_rules.climate.setpoint_entity` (у владельца это
# `input_number.temperatura`, значение 21 °C, которое утром и ночью меняют его
# автоматизации). Расписание «утро/ночь» в платформу **не выносится**: оно уже
# работает в HA, и второе место, где его можно сломать, только вредит (решение
# владельца 2026-10-09).
#
# ОЖИДАЕМЫЕ ПАРАМЕТРЫ в params (из манифеста):
#   - hysteresis: float (опционально, по умолчанию 0.5) — ширина мёртвой зоны
#     вокруг цели, °C. Без неё обогреватель включается и выключается на границе
#   - run_minutes: float (опционально, по умолчанию 15) — на сколько минут
#     включается обогреватель через его собственный таймер
#   - heater_timer: str (опционально) — entity_id таймера обогревателя
#     (`number.*_countdown`). Нет — работа по датчику, и в журнал пишется, что
#     таймер недоступен: защиты от перегрева при отказе датчика тогда нет
#   - managed_by_hardware: bool (опционально) — в комнате стоит штатный
#     термостат; платформа обогревателем здесь не управляет (в гостиной)
#   - cooling: bool (опционально, по умолчанию false) — прибор умеет охлаждать
#     (кондиционер). Без этого параметра переходы COOLING и DRYING к прибору
#     **не относятся**: движок пропускает их молча, и в журнале нет
#     «кондиционер запрещён» по обогревателю (B66). Прибор, который и греет, и
#     охлаждает, объявляет этот параметр и остаётся одним автоматом.
#
# ПРИМЕР ИСПОЛЬЗОВАНИЯ в manifest.yaml:
#   rooms:
#     - id: spalnia
#       sensors:
#         temperature: sensor.datchik_temperatury_spalnia_temperature
#       devices:
#         - id: switch.obogrevatel_spalnia
#           type: climate
#           behaviors:
#             - template: climate_control
#               priority: 10
#               params:
#                 hysteresis: 0.5
#                 run_minutes: 15
#                 heater_timer: number.obogrevatel_spalnia_countdown
#
# СОСТОЯНИЯ:
#   - IDLE: Обогревать нечего — комната не холоднее цели минус гистерезис
#   - HEATING: Обогреватель работает по своему таймеру, ждём нового показания
#
# СОБЫТИЯ:
#   - temperature_changed — единственное событие, которое платформа публикует
#     для датчика температуры (`EventRouter.SENSOR_EVENT_MAP`, роль `temperature`).
#     Отдельных событий «холодно»/«жарко»/«достигнуто» не существует и не будет:
#     роутер не знает уставки дома, а решение «холодно ли» — работа условия.
#     Прежний шаблон слушал temperature_low/temperature_high/temperature_reached,
#     и климат не срабатывал никогда.
#
# ЧТО КЛАДЁТСЯ В КОНТЕКСТ ПЕРЕХОДА:
#   - temperature: показание датчика комнаты числом (роутер приводит; строкой
#     остаётся `unavailable`, и условие трактует это как отсутствие данных)
#   - climate_setpoint, comfort_max, is_winter, climate_enabled,
#     ac_allowed (только если дом объявил гейт `ac_gate_entity`: явный запрет
#     владельца. Нет гейта — охлаждение им не запрещается: технику защищают мороз
#     и сезон),
#     climate_shadow — состояния глобальных правил, кладёт адаптер
#   - managed_by_hardware: параметр поведения (комната с термостатом)
#
# ПРИМЕЧАНИЕ: entity_id будет переопределен фабрикой на основе device_id и priority

initial_state: "IDLE"
# Дебаунс меньше, чем у освещения: показывает��ие температуры шлёт каждый датчик
# ESPHome, а решение принимается по сравнению с уставкой, и отбрасывать
# показания чаще, чем раз в секунду, незачем.
debounce_sec: 1.0

states:
  - "IDLE"
  - "HEATING"
  - "COOLING"
  - "DRYING"
  - "OFF_MANUAL"

transitions:
  # ПОРЯДОК ПЕРЕХОДОВ ЗНАЧИМ: движок берёт первый подходящий, поэтому «ничего
  # не делать» (IDLE -> IDLE) стоит последним в блоке выходов из IDLE. Стоял он
  # вторым — и перехватывал показание раньше, чем доходили проверки охлаждения:
  # летом в жару дом выдавал «решение принято, ничего не менять».

  # Включение обогрева: комната холоднее цели минус гистерезис, климат не
  # выключен владельцем, и комнатой не управляет штатный термостат.
  #
  # Условие одно — `may_heat`, а не три по отдельности: движок допускает на
  # переход ровно одно имя условия, и перечислять тут три — значит либо ждать
  # отказа по первому попавшемуся, либо менять структуру движка (конституция I
  # разрешает это только по явному согласованию). Внутри `may_heat` проверки идут
  # по цене ошибки: право владельца, потом «в комнате свой термостат», потом
  # замер температуры.
  - from_state: "IDLE"
    to_state: "HEATING"
    trigger: "temperature_changed"
    guard: "may_heat"
    action: "heater_timer_on"

  # Выключение по достижению цели: на уставке, без гистерезиса. Держать
  # обогреватель ещё полградуса сверх цели — значит перегревать комнату, которая
  # уже достаточно тёплая. Полоса гистерезиса остаётся позади: включаемся ниже
  # `цель − гистерезис`, а в полосе не выключаемся (см. переход HEATING → HEATING).
  #
  # Обычное выключение: если человек только что трогал прибор, автоматика
  # уступает (FR-007).
  - from_state: "HEATING"
    to_state: "IDLE"
    trigger: "temperature_changed"
    guard: "may_stop_heating"
    action: "heater_off"

  # Страховка по таймеру: автомат отработал положенное время, а нового решения
  # не принял никто — датчик молчит или отказал (FR-004).
  #
  # Действие аварийное и блокировку обходит намеренно. В бою 2026-10-11 обычное
  # выключение было заблокировано ручным вмешательством, и масляный радиатор
  # простоял включённым пять часов при истёкшем таймере: блокировка защищает
  # «не мешай человеку», а не должна оставлять дом с открытым обогревом.
  # `timeout_sec` — срок по умолчанию; `timeout_param` связывает его с
  # `run_minutes` из манифеста (минуты переводятся в секунды): истекло
  # устройство — истекло и ожидание автомата. Без этой связи манифест с
  # `run_minutes: 20` получал таймер розетки на 1200 с, а автомат выключал
  # обогрев через 900 с — раньше, чем просил владелец. Значение по умолчанию
  # совпадает с `DEFAULT_HEATER_RUN_MINUTES` (15 мин); равенство держит
  # `tests/integration/climate/test_heating_by_sensor.py::TestTimerIsArmed`.
  - from_state: "HEATING"
    to_state: "IDLE"
    trigger: "timeout"
    action: "heater_emergency_off"
    timeout_sec: 900.0
    timeout_param: "run_minutes"

  # Охлаждение: комната выше потолка комфорта, лето, разрешение владельца есть.
  #
  # Режим и температура уходят одной командой (`ac_cool_on`): у кондиционера
  # общий `hvac_mode`, и два автомата, дергающие его попеременно, выглядели бы
  # как поломка. Осушение (`DRYING`) — тот же автомат, другое состояние: одно
  # решение на комнату, а не два (FR-017).
  - from_state: "IDLE"
    to_state: "COOLING"
    trigger: "temperature_changed"
    guard: "may_cool"
    action: "ac_cool_on"

  # Осушение при высокой влажности — только вне зимы и только если не жарко:
  # охлаждение приоритетнее, иначе комната получала бы и компрессор, и вентилятор
  # одновременно.
  - from_state: "IDLE"
    to_state: "DRYING"
    trigger: "humidity_changed"
    guard: "may_dry"
    action: "ac_dry_on"

  # Решение «обогревать незачем» — законное состояние, а не отказ.
  #
  # Переход в то же состояние без действия обязателен: без него каждое обычное
  # показание датчика превращалось бы в отказ «нет такого перехода» — ровно тот
  # шум, из-за которого ночной цикл суток молчал (вскрыто в доме 2026-10-09).
  #
  # Условие `may_stay_idle` здесь не для красоты. Без него переход срабатывал при
  # молчащем датчике («решение принято» при данных, которых нет, и ноль отказов
  # в журнале — FR-038) и перехватывал показание раньше проверок охлаждения.
  #
  # Условие разрешает покой только когда охлаждение действительно не требуется.
  # Если в комнате жарко, но охладить запрещено (зима или нет гейта владельца),
  # покой становится **отказом** с названной причиной — иначе по журналу выглядело
  # бы так, будто автоматика не заметила жары.
  - from_state: "IDLE"
    to_state: "IDLE"
    trigger: "temperature_changed"
    guard: "may_stay_idle"
    action: null

  # Возврат к обогреву из режимов охлаждения: комната остыла, а погода холодная.
  # Переход слушает то же событие, что и сам охлаждающий, иначе после снятия
  # жары автомат остался бы в COOLING до следующего показания влажности.
  - from_state: "COOLING"
    to_state: "HEATING"
    trigger: "temperature_changed"
    guard: "may_heat"
    action: "ac_off"

  - from_state: "COOLING"
    to_state: "IDLE"
    trigger: "temperature_changed"
    guard: "may_stay_idle"
    action: "ac_off"

  - from_state: "DRYING"
    to_state: "COOLING"
    trigger: "temperature_changed"
    guard: "may_cool"
    action: "ac_cool_on"

  - from_state: "DRYING"
    to_state: "HEATING"
    trigger: "temperature_changed"
    guard: "may_heat"
    action: "ac_off"

  - from_state: "DRYING"
    to_state: "IDLE"
    trigger: "temperature_changed"
    guard: "may_stay_idle"
    action: "ac_off"

  # Выключение по истечении страховочного таймера описано выше по списку
  # (HEATING → IDLE по timeout, аварийное действие). Дубль перехода с обычным
  # `heater_off` удалён 2026-10-11: два одинаковых перехода по одному триггеру
  # означали, что первым отрабатывал обычный — блокируемый ручным
  # вмешательством, и обогреватель оставался включённым при отказе датчика
  # (наблюдение в бою: масляный радиатор, пять часов).
  #
  # `timeout_sec` у оставшегося перехода — срок по умолчанию, а
  # `timeout_param: run_minutes` связывает его с длительностью работы из
  # манифеста (`_timeout_from_params` переводит минуты в секунды).

  # Решение «ещё греть нужно» из состояния нагрева: показание пришло, а цель ещё
  # не достигнута — в том числе внутри полосы гистерезиса (21.5…22.0 при цели 22).
  # Обогреватель уже работает, поэтому команда не нужна — переход без действия
  # оставляет автомат греть. Гистерезис здесь не применяется: полоса и есть
  # «ещё греем», выключение стоит на цели, а не на её нижней границе.
  #
  # Именно этот переход делает работу через таймер безопасной: если датчик молчит,
  # таймер обогревателя всё равно истечёт, а когда датчик оживёт, решение
  # продолжится с последнего показания. Без него показание в полосе не находило
  # ни одного перехода и писалось отказом на каждом отсчёте.
  #
  # Срок страховки он **не продлевает** (`extends_timeout: false`): иначе
  # показания каждые 10 минут отодвигали бы выключение, и прибор гас бы только
  # по собственному таймеру розетки — раньше, чем автомат успевал принять
  # решение (живая находка 2026-11-08).
  - from_state: "HEATING"
    to_state: "HEATING"
    trigger: "temperature_changed"
    guard: "may_keep_heating"
    action: null
    # Показание в полосе гистерезиса — не продление страховки. Иначе таймер
    # перевзводился бы каждые 10 минут и не сработал бы никогда (живая
    # находка 08.11: радиатор выключился своим таймером раньше автомата).
    extends_timeout: false

  # Человек физически выключил обогреватель (розетка, настенный выключатель).
  # Платформа уступает до конца срока ручной блокировки: держит прибор
  # выключенным, не спорит и не считает это проблемой. Дальше возвращается в
  # IDLE и следующее холодное показание снова включает обогрев — если человек
  # не выключил прибор повторно.
  - from_state: "HEATING"
    to_state: "OFF_MANUAL"
    trigger: "manual_switch_off"
    action: null

  # Конец уступки: срок тот же, что у ручной блокировки домена
  # (`climate.manual_lockout_min`, иначе глобальные 60 минут).
  - from_state: "OFF_MANUAL"
    to_state: "IDLE"
    trigger: "timeout"
    action: null
    timeout_sec: 3600.0
    timeout_param: "manual_lockout_min"

  # Человек включил обогреватель обратно — уступаем сразу и ждём следующего
  # показания, чтобы решить по температуре.
  - from_state: "OFF_MANUAL"
    to_state: "IDLE"
    trigger: "manual_switch_on"
    action: null
