# Климат комнаты: обогрев по датчику температуры — АБСТРАКТНЫЙ ШАБЛОН
#
# Шаблон описывает, как комната держит заданную температуру. Источник цели —
# Home Assistant: `automation_rules.climate.setpoint_entity` (у владельца это
# `input_number.temperatura`, значение 21 °C, которое утром и ночью меняют его
# автоматизации). Расписание «утро/ночь» в платформу **не выносится**: оно уже
# работает в HA, и второе место, где его можно сломать, только вредит (решение
# владельца 2026-10-09).
#
# ОЖИДАЕМЫЕ ПАРАМЕТРЫ в params (из манифеста):
#   - hysteresis: float (опционально, по умолчанию 0.5) — ширина мёртвой зоны
#     вокруг цели, °C. Без неё обогреватель включается и выключается на границе
#   - run_minutes: float (опционально, по умолчанию 15) — на сколько минут
#     включается обогреватель через его собственный таймер
#   - heater_timer: str (опционально) — entity_id таймера обогревателя
#     (`number.*_countdown`). Нет — работа по датчику, и в журнал пишется, что
#     таймер недоступен: защиты от перегрева при отказе датчика тогда нет
#   - managed_by_hardware: bool (опционально) — в комнате стоит штатный
#     термостат; платформа обогревателем здесь не управляет (в гостиной)
#
# ПРИМЕР ИСПОЛЬЗОВАНИЯ в manifest.yaml:
#   rooms:
#     - id: spalnia
#       sensors:
#         temperature: sensor.datchik_temperatury_spalnia_temperature
#       devices:
#         - id: switch.obogrevatel_spalnia
#           type: climate
#           behaviors:
#             - template: climate_control
#               priority: 10
#               params:
#                 hysteresis: 0.5
#                 run_minutes: 15
#                 heater_timer: number.obogrevatel_spalnia_countdown
#
# СОСТОЯНИЯ:
#   - IDLE: Обогревать нечего — комната не холоднее цели минус гистерезис
#   - HEATING: Обогреватель работает по своему таймеру, ждём нового показания
#
# СОБЫТИЯ:
#   - temperature_changed — единственное событие, которое платформа публикует
#     для датчика температуры (`EventRouter.SENSOR_EVENT_MAP`, роль `temperature`).
#     Отдельных событий «холодно»/«жарко»/«достигнуто» не существует и не будет:
#     роутер не знает уставки дома, а решение «холодно ли» — работа условия.
#     Прежний шаблон слушал temperature_low/temperature_high/temperature_reached,
#     и климат не срабатывал никогда.
#
# ЧТО КЛАДЁТСЯ В КОНТЕКСТ ПЕРЕХОДА:
#   - temperature: показание датчика комнаты числом (роутер приводит; строкой
#     остаётся `unavailable`, и условие трактует это как отсутствие данных)
#   - climate_setpoint, comfort_max, is_winter, ac_allowed, climate_enabled,
#     climate_shadow — состояния глобальных правил, кладёт адаптер
#   - managed_by_hardware: параметр поведения (комната с термостатом)
#
# ПРИМЕЧАНИЕ: entity_id будет переопределен фабрикой на основе device_id и priority

initial_state: "IDLE"
# Дебаунс меньше, чем у освещения: показывает��ие температуры шлёт каждый датчик
# ESPHome, а решение принимается по сравнению с уставкой, и отбрасывать
# показания чаще, чем раз в секунду, незачем.
debounce_sec: 1.0

states:
  - "IDLE"
  - "HEATING"

transitions:
  # Включение обогрева: комната холоднее цели минус гистерезис, климат не
  # выключен владельцем, и комнатой не управляет штатный термостат.
  #
  # Условие одно — `may_heat`, а не три по отдельности: движок допускает на
  # переход ровно одно имя условия, и перечислять тут три — значит либо ждать
  # отказа по первому попавшемуся, либо менять структуру движка (конституция I
  # разрешает это только по явному согласованию). Внутри `may_heat` проверки идут
  # по цене ошибки: право владельца, потом «в комнате свой термостат», потом
  # замер температуры.
  - from_state: "IDLE"
    to_state: "HEATING"
    trigger: "temperature_changed"
    guard: "may_heat"
    action: "heater_timer_on"

  # Решение «обогревать незачем» — законное состояние, а не отказ.
  #
  # Переход в то же состояние без действия обязателен: без него каждое обычное
  # показание датчика превращалось бы в отказ «нет такого перехода» — ровно тот
  # шум, из-за которого ночной цикл суток молчал (вскрыто в доме 2026-10-09).
  #
  # Условие `has_usable_reading` здесь не для красоты: без него переход срабатывал
  # и при молчащем датчике, то есть «решение принято» при данных, которых нет.
  # Журнал показывал ноль отказов при неотапливаемой комнате (FR-038).
  - from_state: "IDLE"
    to_state: "IDLE"
    trigger: "temperature_changed"
    guard: "has_usable_reading"
    action: null

  # Выключение по достижению цели: без гистерезиса. Держать обогреватель ещё
  # полградуса — значит перегревать комнату, которая уже достаточно тёплая.
  - from_state: "HEATING"
    to_state: "IDLE"
    trigger: "temperature_changed"
    guard: "may_stop_heating"
    action: "heater_off"

  # Выключение по истечении таймера работы: обогреватель отработал своё время,
  # и решение принимается заново по свежему показанию.
  #
  # `timeout_sec` задан здесь явно. Раньше комментарий утверждал, что фабрика
  # подставляет его из `run_minutes`, но `_timeout_from_params` читает только
  # `motion_timeout_sec` и только для триггера `timeout`, а поле в переходе не
  # было задано: таймер не взводился, и переход не срабатывал никогда
  # (`research.md` D4).
  #
  # Значение совпадает с `DEFAULT_HEATER_RUN_MINUTES` (15 мин), а не берётся из
  # него: истекло устройство — истекло и ожидание автомата, иначе решение приходит
  # позже, чем свет уже погас. Явное значение в шаблоне надёжнее и не требует
  # новой логики фабрики. Проверку равенства держит
  # `tests/integration/climate/test_heating_by_sensor.py::TestTimerIsArmed`.
  - from_state: "HEATING"
    to_state: "IDLE"
    trigger: "timeout"
    action: "heater_off"
    timeout_sec: 900.0

  # Решение «ещё греть нужно» из состояния нагрева: показание пришло, а в комнате
  # по-прежнему холодно. Обогреватель уже работает, поэтому команда не нужна —
  # переход без действия оставляет автомат греть.
  #
  # Именно этот переход делает работу через таймер безопасной: если датчик молчит,
  # таймер обогревателя всё равно истечёт, а когда датчик оживёт, решение
  # продолжится с последнего показания.
  - from_state: "HEATING"
    to_state: "HEATING"
    trigger: "temperature_changed"
    guard: "may_heat"
    action: null
