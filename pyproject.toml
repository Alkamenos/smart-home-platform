[project]
name = "smart-home-fsm-platform"
version = "3.0.0"
description = "Smart Home FSM Platform - State machine based automation for smart homes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Smart Home Team", email = "team@smarthome.local" }
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "aiohttp>=3.9",
    "websockets>=12.0",

]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.2",
    "freezegun>=1.4.0",
    "hypothesis>=6.0",
    "httpx>=0.27.0",

    # Type checking
    "mypy>=1.10",
    "types-PyYAML>=6.0",

    # Linting & Formatting
    "ruff>=0.4.0",


    # Documentation
    "interrogate>=1.7",

    # Utilities
    "psutil>=5.9",
]

webui = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.2",
]

integration = [
    "testcontainers>=4.0",
    "aiohttp>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src"
timeout = 30

[tool.hatch.build.targets.wheel]
packages = ["src/smart_home"]

[project.scripts]
smart-home = "smart_home.cli.main:main"

# ===== Tool Configuration =====

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

# Отключённые коды ошибок (перенесены из CLI)
disable_error_code = [
    "misc",
    "no-untyped-def",
    "no-any-return",
    "type-arg",
    "assignment",
    "attr-defined",
    "union-attr",
    "arg-type",
    "call-arg",
    "has-type",
    "var-annotated",
    "valid-type",
    "unused-ignore",
    "no-untyped-call",
    "index",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]

known-first-party = ["smart_home"]
known-third-party = ["fastapi", "sqlalchemy", "pydantic"]
force-single-line = false
lines-after-imports = 2
combine-as-imports = true

section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
