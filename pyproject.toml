[project]
name = "smart-home-fsm-platform"
version = "3.0.0"
description = "Smart Home FSM Platform - State machine based automation for smart homes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Smart Home Team", email = "team@smarthome.local" }
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "aiohttp>=3.9",

]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.2",
    "freezegun>=1.4.0",
    "hypothesis>=6.0",

    # Type checking
    "mypy>=1.10",
    "types-PyYAML>=6.0",

    # Linting & Formatting
    "ruff>=0.4.0",
    "black>=24.0",
    "isort>=5.13",

    # Documentation
    "interrogate>=1.7",

    # Utilities
    "psutil>=5.9",
]

integration = [
    "testcontainers>=4.0",
    "websockets>=12.0",
    "aiohttp>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src"
timeout = 30

[tool.hatch.build.targets.wheel]
packages = ["src/smart_home"]

[project.scripts]
smart-home = "smart_home.cli.main:main"

# ===== Tool Configuration =====

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["smart_home"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["smart_home", "tools"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = false
ignore-semiprivate = false
ignore-private = true
ignore-property-decorators = false
ignore-module = true
fail-under = 80
exclude = ["tests", "build", "dist"]
verbose = 2

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
