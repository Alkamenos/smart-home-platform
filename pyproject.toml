[project]
name = "smart-home-fsm-platform"
version = "3.0.0"
description = "Smart Home FSM Platform - State machine based automation for smart homes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Smart Home Team", email = "team@smarthome.local" }
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.24.0",
    "loguru>=0.7.0",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.19",
    "cryptography>=42.0",
    # Требуется src/services/config_watcher.py (hot reload конфигурации)
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.2",
    "pytest-playwright>=0.5.0",
    "freezegun>=1.4.0",
    "hypothesis>=6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pre-commit>=4.6.2",
    "playwright>=1.40.0",
    "requests>=2.31.0",

    # Type checking
    "mypy>=1.10",
    "types-PyYAML>=6.0",

    # Linting & Formatting
    "ruff>=0.4.0",


    # Documentation
    "interrogate>=1.7",

    # Utilities
    "psutil>=5.9",
]

webui = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.2",
    "playwright>=1.40.0",
]

integration = [
    "testcontainers>=4.0",
    "aiohttp>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# importlib: коллизия имён тестовых модулей с одинаковыми basename
# (contract/test_access_control.py == integration/test_access_control.py) — Known Issue #3
# test_webui_playwright.py исключён: playwright sync API держит running event loop
# на весь прогон и ломает последующие async-тесты (Known Issue #13).
# Запускать отдельно: pytest tests/test_webui_playwright.py
addopts = "-v --cov=src --import-mode=importlib --ignore=tests/test_webui_playwright.py"
timeout = 30

# Корень репозитория в sys.path. Без этого `pytest` (консольный скрипт) падал на
# коллекции с `ModuleNotFoundError: No module named 'src'` в 6 модулях: режим
# importlib не добавляет корень в путь, а console-script pytest не добавляет и
# текущий каталог — в отличие от `python -m pytest`. Расхождение обнаружилось
# при сверке путей проверки (спека 009, US3): `make test` завершался с кодом 2,
# не выполнив ни одного теста, и это нигде не было видно.
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_home"]

[project.scripts]
shp = "smart_home.cli.main:main"

# ===== Tool Configuration =====

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
mypy_path = "src"
disable_error_code = [
    "misc",
    "no-untyped-def",
    "no-any-return",
    "type-arg",
    "assignment",
    "attr-defined",
    "union-attr",
    "arg-type",
    "call-arg",
    "has-type",
    "var-annotated",
    "valid-type",
    "unused-ignore",
    "no-untyped-call",
    "index",
    "untyped-decorator",   # ← добавлено: FastAPI-декораторы
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

# Внешние пакеты без type-информации. Держать точечно: глобальный
# ignore_missing_imports скрывал бы и настоящие ошибки импорта внутри проекта.
# pyscript здесь легитимно — он опциональный импорт под contextlib.suppress
# в src/core/persistence/context_manager.py, в зависимостях не объявлен.
[[tool.mypy.overrides]]
module = ["fastapi.*", "starlette.*", "pyscript.*"]
ignore_missing_imports = true

# mypy_path = "src" обязателен и связан с единым стилем импорта.
# Раньше был mypy_path = "." при 52 импортах `core.*` и 44 `src.core.*`
# одновременно. Двойное имя файла (core.X и src.core.X) давало либо
# "Source file found twice", либо требовало глобального ignore_missing_imports,
# который отключал анализ примерно половины собственного кода.

# FastAPI-декораторы не типизированы — снимаем проверку для веб-слоя.
[[tool.mypy.overrides]]
module = ["webui.*"]
disallow_untyped_decorators = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]

known-first-party = ["smart_home"]
known-third-party = ["fastapi", "sqlalchemy", "pydantic"]
force-single-line = false
lines-after-imports = 2
combine-as-imports = true

section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
