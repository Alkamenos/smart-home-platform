features:
  lighting:
    enabled: true
    override_timeout_min: 60
    anti_cycle_min: 2
    color_temp:
      enabled_flag: input_boolean.feature_color_temp
      day_kelvin: 5000
      night_kelvin: 2200
      warm_from: '21:00'
      night_from: '23:00'
    dark:
      illuminance_sensor: sensor.datchik_osveshchennosti_illuminance
      dark_lux: 20
      light_lux: 40
      sun_dark_elevation: -3
      sun_light_elevation: 1
  ventilation:
    enabled: true
    sensors:
      outdoor_temp: sensor.temperatura_na_ulitse_srednee
      outdoor_humidity: sensor.datchik_temperatury_terassa_humidity
      house_humidity: input_number.vlazhnost_v_dome
    setpoints_ref:
      heat: input_number.temperatura
      cool: input_number.maksimalno_komfortnaia_temperatura
    speeds:
      day: 40
      away: 20
    deltas:
      free_cool: 2
      free_heat: 2
      humidity: 5
    boost_minutes: 60
    winter_pause_outdoor_max: -5
    flags:
      night: input_boolean.vecher
      away_home: input_boolean.my_doma
      boost_intake: input_boolean.provetrivanie
      boost_exhaust: input_boolean.provetrivanie_vytyazhka
  climate:
    enabled: true
    safety:
      min_setpoint: 16
      ac_winter_lockout: true
      ac_lockout_outdoor_max: 5
      ac_lockout_warn: script.ac_lockout_warning
      ac_dry_summer: true
      ac_dry_humidity: 60
    season:
      source: input_boolean.zima
      heating_when: 'on'
    zones:
    - id: gostinnaia
      temp_sensor_ref: temp_gostinnaia
      setpoints:
        heat:
          source: input_number.temperatura
        cool:
          source: input_number.maksimalno_komfortnaia_temperatura
        deadband: 0.5
      actuators:
      - ref: convector_gostinnaia
        role: secondary_heat
        priority: 1
      - ref: ac_gostinnaia
        role: primary_cool
        priority: 2
    - id: sanuzel
      temp_sensor_ref: temp_sanuzel
      setpoints:
        heat:
          source: input_number.temperatura_v_sanuzle
        deadband: 0.5
      actuators:
      - ref: convector_sanuzel
        role: secondary_heat
        priority: 1
    - id: spalnia
      temp_sensor_ref: temp_spalnia
      setpoints:
        heat:
          source: input_number.temperatura
        deadband: 0.5
      actuators:
      - ref: convector_spalnia
        role: secondary_heat
        priority: 1
    - id: kabinet
      temp_sensor_ref: temp_kabinet
      setpoints:
        heat:
          source: input_number.temperatura
        deadband: 0.5
      actuators:
      - ref: convector_kabinet
        role: secondary_heat
        priority: 1
    - id: gostevaia_spalnia
      temp_sensor_ref: temp_gostevaia_spalnia
      setpoints:
        heat:
          source: input_number.temperatura
        deadband: 0.5
      actuators:
      - ref: convector_gostevaia_spalnia
        role: secondary_heat
        priority: 1
  covers:
    enabled: true
    defaults:
      open_time: 08:00
      close_time: 00:00
  sensor_health:
    enabled: true
    check_interval_min: 10
global_flags:
  winter: input_boolean.zima
  night: input_boolean.vecher
  home: input_boolean.my_doma
  party: input_boolean.party_mode
