  table:
    id: table
    name: Кухня (обеденный стол)
    room: kitchen
    devices:
    - table_light_0
    fsm:
      states:
      - 'OFF'
      - ON_MOTION
      - ON_SCHEDULE
      - NIGHTLIGHT
      - MANUAL_LOCK
      - UNAVAILABLE
      initial: 'OFF'
      debounce_sec: 2.0
      transitions:
      - from:
        - 'OFF'
        - ON_SCHEDULE
        to: ON_MOTION
        trigger: motion
        guard: room_ok and motion_mode != 'Выкл' and (dark or motion_day)
        priority: 30
        why: Включение по датчику движения
      - from:
        - ON_MOTION
        to: 'OFF'
        trigger: no_motion_timeout
        priority: 10
        why: Выключение по таймеру отсутствия движения
      - from:
        - 'OFF'
        - ON_SCHEDULE
        to: NIGHTLIGHT
        trigger: night_motion
        guard: motion_mode != 'Выкл' and nightlight_enabled
        priority: 35
        why: 'Ночник: минимальная яркость ночью'
      - from:
        - NIGHTLIGHT
        to: 'OFF'
        trigger: nightlight_timeout
        priority: 10
        why: 'Ночник: таймер истёк'
      - from:
        - 'OFF'
        - ON_SCHEDULE
