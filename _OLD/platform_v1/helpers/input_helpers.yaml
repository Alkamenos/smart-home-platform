# Файл декларативных helper-сущностей для освещения (vlight + select + time)
# Добавьте в configuration.yaml:
# input_boolean: !include helpers/input_helpers.yaml
# input_select: !include helpers/input_selects.yaml
# input_datetime: !include helpers/input_datetimes.yaml

input_boolean:
