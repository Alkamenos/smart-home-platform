    id: vlight_yard_floodlights
  - name: "VLight: Входная дверь"
    id: vlight_front_door
  - name: "VLight: Ворота гаража"
    id: vlight_garage_gate
  - name: "VLight: Садовая дорожка"
    id: vlight_garden_path
